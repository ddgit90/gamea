<script>
/* js/town.js */
'use strict';
/* ===== 街：時間・施設・行動 ===== */
const TW = {
  hour() { return Math.floor((G.minute || 0) / 60) % 24; },
  timeLabel() { return `${G.day}日目（${U.dayName(G.day)}） ${U.timeStr(G.minute)}`; },
  period() { const h = this.hour(); return h < 5 ? '深夜' : h < 10 ? '朝' : h < 16 ? '昼' : h < 19 ? '夕方' : '夜'; },
  addMinutes(m, noTick) {
    if (!m) return;
    if (!noTick) P.tickMinutes(m);
    G.minute += m;
    while (G.minute >= 1440) { G.minute -= 1440; G.day++; this.newDay(); }
  },
  advanceToNext(h) {
    let diff = h * 60 - G.minute;
    if (diff <= 0) diff += 1440;
    this.addMinutes(diff, true);
  },
  newDay() {
    P.dailyBody();
    NP.daily();
    G.shops = {};
    const p = G.player;
    p.fortune = null;
    p.dayFlags = {};
    // 保険の払い戻し
    const ready = p.insClaims.filter(c => c.day <= G.day);
    if (ready.length) {
      for (const c of ready) G.stash.push(c.it);
      p.insClaims = p.insClaims.filter(c => c.day > G.day);
      UI.log(`保険会社から装備${ready.length}点が自宅の倉庫に届いた。`, 'good');
    }
    if (U.chance(0.15)) UI.log(U.pick(['ニュース：新たな迷宮踏破者が出たらしい。', 'ニュース：迷宮由来の新素材が話題に。', '天気予報：明日は晴れ。', 'ニュース：冒険者狩りの被害が増えているという。', '商店街で福引きセールが始まった。']), 'amb');
    P.checkAcq();
  },
  isOpen(fid) {
    const f = DATA.facilities[fid]; const h = this.hour();
    const [a, b] = f.open;
    if (a === 0 && b === 24) return true;
    if (fid === 'insurance' && G.player.flags.vic_scam && G.day - G.player.flags.vic_scam < 3) return false;
    return b > 24 ? (h >= a || h < b - 24) : (h >= a && h < b);
  },
  hoursLabel(fid) { const [a, b] = DATA.facilities[fid].open; return a === 0 && b === 24 ? '24時間' : `${a}:00〜${b > 24 ? '翌' + (b - 24) : b}:00`; },

  /* ===== 能力の成長 ===== */
  grow(k, amt) {
    const p = G.player;
    p.grow = p.grow || {};
    p.grow[k] = (p.grow[k] || 0) + amt / (1 + p.base[k] / 25);
    while (p.grow[k] >= 1 && p.base[k] < 99) { p.grow[k] -= 1; p.base[k]++; UI.log(`${DATA.attrs.find(a => a.id === k).n}が上がった！（${p.base[k]}）`, 'level'); SND.play('level'); }
  },
  canTrain() {
    const p = G.player;
    if (p.needs.fatigue > 85) return '疲れすぎている';
    if (DATA.parts.some(x => p.parts[x.id].fr || p.parts[x.id].dead)) return '怪我を治してから';
    return null;
  },
  train(pts, kcal, fat, grows, mins, stress = 0) {
    const p = G.player;
    const why = this.canTrain(); if (why) { UI.toast(why); return false; }
    const eff = (p.needs.fatigue > 60 ? 0.7 : 1) * (p.needs.hunger < 20 ? 0.7 : 1);
    p.today.train += pts * eff;
    p.today.act += kcal;
    p.needs.fatigue = U.clamp(p.needs.fatigue + fat * (1 + (G.d.m.fatigueMult || 0) / 200), 0, 100);
    p.needs.hygiene = U.clamp(p.needs.hygiene - 15, 0, 100);
    p.needs.thirst = U.clamp(p.needs.thirst - 10, 0, 100);
    p.needs.stress = U.clamp(p.needs.stress + stress - (p.traits.includes('gymrat') ? 8 : 0), 0, 100);
    for (const k in grows) this.grow(k, grows[k] * eff * (p.traits.includes('gymrat') ? 1.3 : 1));
    this.addMinutes(mins);
    return true;
  },

  /* ===== 店の品揃え ===== */
  shopIlvl() { return Math.max(1, Math.round(G.player.counters.maxFloor * 1.3 + 2)); },
  stock(fid) {
    G.shops = G.shops || {};
    if (G.shops[fid]) return G.shops[fid];
    const mf = G.player.counters.maxFloor, il = this.shopIlvl();
    const S = { staples: [], items: [], markup: 1 };
    const lvOk = c => (c.lv || 1) <= mf + 2;
    const cons = (k) => Object.values(DATA.cons).filter(c => k.includes(c.k));
    const eq = (n, o) => { for (let i = 0; i < n; i++) S.items.push(IT.genEquip(Object.assign({ ilvl: il, idf: true }, o, { rar: o.rar != null ? o.rar : U.wpick([1, 2, 3], r => [0, 0, 6, 3, 1][r + 1] || 1) }))); };
    switch (fid) {
      case 'super': S.staples = cons(['food', 'drink', 'ingr']).filter(c => !c.lv && !['grilledchicken', 'curry', 'nikujaga', 'omurice', 'yasaiitame', 'teishoku', 'tkg', 'monsterstew', 'steak', 'tofusoup', 'mushroomsoup', 'homebento', 'cookies', 'macaron', 'gyudon', 'ration', 'sake', 'wine'].includes(c.id)).map(c => c.id); S.markup = this.hour() >= 18 ? 0.8 : 1; break;
      case 'konbini': S.staples = ['onigiri', 'sandwich', 'bento', 'cupnoodle', 'bread', 'chocolate', 'chips', 'energybar', 'cake', 'water', 'tea', 'sportsdrink', 'coffee', 'energy', 'cola', 'milk', 'beer', 'juice', 'bandage', 'painkiller', 'deodorant', 'protein']; S.markup = 1.15; break;
      case 'pharmacy': S.staples = ['bandage', 'tourniquet', 'splint', 'painkiller', 'compress', 'medkit', 'antidote', 'burnoint', 'vitamins', 'sleepingpill', 'eyedrops', 'stamina', 'protein', 'lotion', 'facemask', 'sunscreen', 'hairoil', 'perfume', 'deodorant', 'handcream']; break;
      case 'hospital': S.staples = ['strongpk', 'ifak', 'milkit', 'surgery', 'tourniquet', 'splint', 'medkit']; break;
      case 'outdoor': S.staples = ['tent', 'flare', 'lockpick', 'smoke', 'detector', 'water', 'ration', 'canned', 'energybar', 'potion', 'mppotion', 'recallscroll', 'idscroll', 'mapscroll'].concat(mf >= 8 ? ['hipotion'] : []);
        for (let i = 0; i < 3; i++) S.items.push(IT.genEquip({ ilvl: il, slot: U.pick(['bag', 'rig']), rar: U.pick([1, 1, 2]), idf: true }));
        for (let i = 0; i < 3; i++) S.items.push(IT.genEquip({ ilvl: il, slot: U.pick(['back', 'belt']), rar: U.pick([1, 2, 2, 3]), idf: true }));
        break;
      case 'gunshop': S.staples = cons(['ammo']).filter(lvOk).map(c => c.id).concat(['throwknife', 'firecracker', 'molotov', 'grenade', 'flashbang', 'icebomb', 'holybomb'].filter(x => lvOk(DATA.cons[x])));
        for (let i = 0; i < 6; i++) { const cls = U.pick(['bow', 'crossbow', 'pistol', 'shotgun', 'rifle', 'cards', 'chakram', 'sling', 'javelin']); const mt = IT.maxTier(il); S.items.push(IT.genEquip({ ilvl: il, base: `${cls}_${U.ri(Math.max(0, mt - 1), mt)}`, rar: U.pick([1, 1, 2, 2, 3]), idf: true })); }
        S.items.push(IT.genEquip({ ilvl: il, base: `quiver_${IT.maxTier(il)}`, rar: 2, idf: true }));
        break;
      case 'weapon': for (let i = 0; i < 10; i++) { S.items.push(IT.genEquip({ ilvl: il, slot: 'weapon', rar: U.pick([1, 1, 2, 2, 3]), idf: true })); } S.items = S.items.filter(it => !IT.bases[it.base].range || U.chance(0.3)); break;
      case 'armor': for (let i = 0; i < 9; i++) S.items.push(IT.genEquip({ ilvl: il, cat: 'armor', rar: U.pick([1, 1, 2, 2, 3]), idf: true }));
        for (let i = 0; i < 3; i++) S.items.push(IT.genEquip({ ilvl: il, slot: 'offhand', rar: U.pick([1, 2, 3]), idf: true }));
        break;
      case 'jewel': S.staples = DATA.gemTypes.map(g => `gem_${g.id}_0`).concat(mf >= 6 ? DATA.gemTypes.map(g => `gem_${g.id}_1`) : []);
        for (let i = 0; i < 6; i++) S.items.push(IT.genEquip({ ilvl: il, cat: 'jewel', rar: U.pick([2, 2, 3, 3, 4]), idf: true }));
        break;
      case 'clothes': for (let i = 0; i < 8; i++) S.items.push(IT.genEquip({ ilvl: il, slot: 'outfit', rar: U.pick([1, 1, 2, 3]), idf: true }));
        for (let i = 0; i < 6; i++) S.items.push(IT.genEquip({ ilvl: il, slot: 'acc', rar: U.pick([1, 2, 3]), idf: true }));
        break;
      case 'giftshop': S.staples = ['bouquet', 'plant', 'plush', 'novel', 'boardgame', 'gamesoft', 'cd', 'figure', 'silveracc', 'whetstone', 'teaset', 'fishingrod', 'scarfgift', 'macaron', 'cake', 'handcream', 'perfume', 'sake', 'wine', 'tomatojuice', 'cookies']; break;
      case 'bookstore': {
        const t1 = Object.values(DATA.cons).filter(c => c.k === 'book' && DATA.skills.find(s => s.id === c.skill).book === 1).map(c => c.id);
        const t2 = Object.values(DATA.cons).filter(c => c.k === 'book' && DATA.skills.find(s => s.id === c.skill).book === 2).map(c => c.id);
        const t3 = Object.values(DATA.cons).filter(c => c.k === 'book' && DATA.skills.find(s => s.id === c.skill).book === 3).map(c => c.id);
        S.staples = U.shuffle(t1).slice(0, 10).concat(U.shuffle(t2).slice(0, 5)).concat(mf >= 10 ? U.shuffle(t3).slice(0, 2) : []).concat(['novel']);
        break;
      }
      case 'shrine': S.staples = ['omamori', 'holywater', 'sake']; break;
      case 'guild': S.staples = ['idscroll', 'recallscroll', 'mapscroll', 'potion', 'mppotion', 'bandage', 'enhance']; break;
      case 'smith': S.staples = ['enhance', 'orb_socket'].concat(QS.rankOf(G.player.rep).n >= 'C' && G.player.rep >= 700 ? ['enhance_hi'] : []); break;
      case 'blackmarket':
        S.staples = ['orb_reroll', 'orb_add', 'orb_bless', 'orb_remove', 'orb_upgrade', 'orb_chaos', 'orb_clean', 'orb_divine', 'adrenaline', 'strongpk'].concat(mf >= 20 ? ['orb_ancient'] : []);
        if (U.chance(0.35)) S.staples.push('feather');
        if (U.chance(0.35)) S.staples.push('elixir');
        for (let i = 0; i < 7; i++) S.items.push(IT.genEquip({ ilvl: il + 6, minR: 3, mult: 2, idf: false }));
        for (const it of (G.bmExtra || [])) S.items.push(it);
        G.bmExtra = [];
        S.markup = 1.3;
        break;
      case 'pawn':
        S.staples = ['oldcoin', 'monsterfang', 'strangedoll'];
        for (let i = 0; i < 2; i++) S.items.push(IT.genEquip({ ilvl: il, rar: U.chance(0.15) ? 5 : 3, idf: true }));
        S.markup = 1.4;
        break;
      case 'tavern': S.staples = ['beer', 'sake', 'wine', 'jerky', 'tomatojuice']; S.markup = 1.6; break;
      case 'cafe': S.staples = ['cake', 'coffee', 'tea', 'sandwich', 'macaron']; S.markup = 1.8; break;
    }
    G.shops[fid] = S;
    return S;
  },

  /* ===== 表示 ===== */
  render() {
    const el = document.getElementById('town-view');
    if (!el) return;
    const p = G.player;
    if (!G.district) G.district = 'res';
    let h = '';
    h += `<div class="districts">${DATA.districts.map(d => `<button class="dist ${G.district === d.id ? 'on' : ''}" data-dist="${d.id}">${d.n}</button>`).join('')}</div>`;
    if (G.loc && DATA.facilities[G.loc]) {
      h += this.renderFac(G.loc);
    } else {
      const dd = DATA.districts.find(x => x.id === G.district);
      h += `<div class="dist-desc">${dd.d}　<span class="dim">${this.period()}</span></div>`;
      h += `<div class="facs">`;
      for (const fid in DATA.facilities) {
        const f = DATA.facilities[fid];
        if (f.dist !== G.district) continue;
        const open = this.isOpen(fid);
        const here = NP.present(fid);
        h += `<button class="fac ${open ? '' : 'closed'}" data-fac="${fid}">
          <span class="fic">${f.icon}</span><span class="fn">${f.n}</span>
          <span class="fh">${open ? '営業中' : '準備中'}・${this.hoursLabel(fid)}</span>
          ${here.length ? `<span class="fnpc">${here.map(id => `<i title="${NP.def(id).n}">${NP.def(id).n.charAt(0)}</i>`).join('')}</span>` : ''}
        </button>`;
      }
      h += `</div>`;
    }
    el.innerHTML = h;
    el.querySelectorAll('[data-dist]').forEach(b => b.onclick = () => this.goDistrict(b.dataset.dist));
    el.querySelectorAll('[data-fac]').forEach(b => b.onclick = () => this.enterFac(b.dataset.fac));
    el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => this.runAct(+b.dataset.act));
    el.querySelectorAll('[data-npc]').forEach(b => b.onclick = () => UI.npcModal(b.dataset.npc));
    el.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { G.loc = null; UI.refresh(); });
  },
  renderFac(fid) {
    const f = DATA.facilities[fid];
    const open = this.isOpen(fid);
    let h = `<div class="facview"><div class="fhead"><button class="back" data-back="1">← 通りに出る</button><span class="fic">${f.icon}</span><b>${f.n}</b><span class="dim">${this.hoursLabel(fid)}</span></div>`;
    h += `<div class="fdesc">${f.d}${this.facFlavor(fid)}</div>`;
    const here = NP.present(fid);
    if (here.length) {
      h += `<div class="npcs">`;
      for (const id of here) {
        const d = NP.def(id), s = G.npcs[id], stg = NP.stage(id);
        const race = DATA.races.find(r => r.id === d.race);
        h += `<button class="npc" data-npc="${id}"><b>${d.n}</b><span class="dim">${race.n}${NP.sexLabel(d)}・${d.job}</span><span style="color:${stg.c}">${stg.n}${s.met ? ` ♥${Math.round(s.aff)}` : '（初対面）'}</span>${s.jealousPending ? '<span class="bad">…</span>' : ''}</button>`;
      }
      h += `</div>`;
    }
    this._acts = open ? this.actions(fid) : [];
    if (!open) h += `<div class="closedmsg">準備中です。営業時間：${this.hoursLabel(fid)}</div>`;
    else {
      h += `<div class="acts">`;
      this._acts.forEach((a, i) => { h += `<button class="act" data-act="${i}" ${a.d ? 'disabled' : ''}><b>${a.l}</b>${a.s ? `<span>${a.s}</span>` : ''}${a.d && a.d !== true ? `<em>${a.d}</em>` : ''}</button>`; });
      h += `</div>`;
    }
    h += `</div>`;
    return h;
  },
  facFlavor(fid) {
    const h = this.hour();
    const map = {
      park: h < 6 ? '　街灯の下、誰もいない。' : h < 10 ? '　朝のジョギングをする人がちらほら。' : h >= 19 ? '　川面に街の灯りが揺れている。' : '',
      tavern: h >= 22 || h < 3 ? '　夜も更けて、店内は冒険者で満席だ。' : '',
      super: h >= 18 && h < 22 ? '　<span class="good">割引シールの時間だ！（2割引）</span>' : '',
      gate: G.player.checkpoints.length > 1 ? `　解放済みの階層：${G.player.checkpoints.join('・')}階` : '',
      home: G.stash.length ? `　倉庫：${G.stash.length}/${DATA.houses.find(x => x.id === G.player.house).stash}` : '',
    };
    return map[fid] || '';
  },
  goDistrict(id) {
    if (G.district === id && !G.loc) return;
    if (G.district !== id) {
      this.addMinutes(15);
      G.district = id; G.loc = null;
      UI.log(`${DATA.districts.find(d => d.id === id).n}へ移動した。`, 'dim');
      if (U.chance(0.12)) { UI.refresh(); EV.town(); return; }
    } else G.loc = null;
    UI.refresh();
  },
  enterFac(fid) {
    G.loc = fid;
    this.addMinutes(2);
    const here = NP.present(fid);
    for (const id of here) if (G.npcs[id].jealousPending && G.npcs[id].status === 'lover') { UI.refresh(); NP.jealousyEvent(id); return; }
    UI.refresh();
  },
  runAct(i) {
    const a = this._acts && this._acts[i];
    if (!a || a.d) return;
    SND.play('ui');
    try { a.f(); } catch (e) { console.error(e); UI.toast('エラー：' + e.message); }
    P.calc();
    UI.refresh();
  },
  pay(n) { const p = G.player; if (p.money < n) { UI.toast('お金が足りない'); return false; } p.money -= n; return true; },
  hospCost() {
    const p = G.player; let c = 0;
    for (const pt of DATA.parts) {
      const pp = p.parts[pt.id];
      if (pp.dead) c += 30000;
      c += Math.max(0, G.d.hpMax[pt.id] - pp.hp) * 12;
      if (pp.bl) c += pp.bl * 2000; if (pp.fr) c += 8000;
    }
    const h = this.hour();
    if (h < 9 || h >= 17) c *= 1.5;
    return Math.round(c);
  },
  hospMins() { const p = G.player; return 60 + DATA.parts.filter(x => p.parts[x.id].dead).length * 120 + DATA.parts.filter(x => p.parts[x.id].fr).length * 30; },

      case 'insurance':
        add('保険をかける', 'ハードコアで死んでも翌日戻る', () => UI.insureModal());
        add('保険の状況', `受け取り待ち${p.insClaims.length}件`, () => UI.toast(p.insClaims.length ? `${p.insClaims.length}件、${Math.min(...p.insClaims.map(c => c.day))}日目に倉庫へ届く` : '受け取り待ちはない'));
        break;
      case 'tavern':
        add('一杯やる（¥600）', 'ストレス-12・酔う', () => { if (!this.pay(600)) return; p.needs.stress = U.clamp(p.needs.stress - (p.traits.includes('drinker') ? 18 : 12), 0, 100); p.alc += p.traits.includes('drinker') ? 0.4 : 1; p.needs.thirst = U.clamp(p.needs.thirst + 10, 0, 100); this.addMinutes(30); UI.log('乾杯！', 'good'); });
        add('食事（¥1,200）', '満腹+45', () => { if (!this.pay(1200)) return; p.needs.hunger = U.clamp(p.needs.hunger + 45, 0, 100); p.today.kcal += 900; p.today.protein += 35; this.addMinutes(40); UI.log('冒険者飯は量が多い。', 'good'); });
        add('噂話を聞く（¥500）', '役立つ情報', () => { if (!this.pay(500)) return; this.addMinutes(30); UI.dialog({ title: '酒場の噂', text: `<p>${this.rumor()}</p>`, choices: [{ label: '閉じる', fn: () => UI.closeDialog() }] }); });
        shop('酒とつまみ');
        break;
      case 'hospital': {
        const c = this.hospCost();
        add(`診察・治療（¥${U.fmt(c)}）`, `全快・${Math.round(this.hospMins() / 60 * 10) / 10}時間${this.hour() < 9 || this.hour() >= 17 ? '・夜間割増' : ''}`, () => { if (!this.pay(c)) return; P.fullHeal(); P.calc(); P.fullHeal(); this.addMinutes(this.hospMins()); UI.log('治療を受けた。体の調子が戻った。', 'good'); SND.play('heal'); }, c < 50 ? '治療の必要はない' : null);
        add('健康診断（¥3,000）', '身体データを確認', () => { if (!this.pay(3000)) return; this.addMinutes(60); UI.healthModal(); });
        shop('病院の売店');
        break;
      }
      case 'bank': add('入出金', `預金${U.yen(p.bank)}`, () => UI.bankModal(0)); break;
      case 'gym': {
        const jinHere = NP.present('gym').includes('jin');
        const paid = p.dayFlags && p.dayFlags.gym;
        const fee = () => { if (paid || (p.dayFlags && p.dayFlags.gym)) return true; if (!this.pay(1000)) return false; p.dayFlags = p.dayFlags || {}; p.dayFlags.gym = 1; return true; };
        add('上半身トレ（1.5時間）', `筋力↑${paid ? '' : '・入場¥1,000'}`, () => { if (!fee()) return; if (this.train(2.2, 400, 16, { str: 0.3 }, 90)) UI.log('胸と背中と腕を追い込んだ。', 'good'); });
        add('下半身トレ（1.5時間）', '筋力・敏捷↑', () => { if (!fee()) return; if (this.train(2.2, 500, 18, { str: 0.2, agi: 0.15 }, 90)) UI.log('脚が生まれたての小鹿のようだ。', 'good'); });
        add('有酸素（1時間）', '体力↑・脂肪燃焼', () => { if (!fee()) return; if (this.train(0.8, 700, 12, { vit: 0.3 }, 60)) UI.log('汗だくになった。', 'good'); });
        add('ストレッチ（30分）', '敏捷↑・ストレス減', () => { if (!fee()) return; if (this.train(0.2, 80, 2, { agi: 0.1 }, 30, -6)) UI.log('体がほぐれた。', 'good'); });
        add('パーソナルトレーニング（¥5,000・1時間）', jinHere ? 'ジンが担当' : 'トレーナー不在', () => { if (!this.pay(5000)) return; if (this.train(3.6, 600, 18, { str: 0.35, vit: 0.2 }, 60)) { NP.gainAff('jin', 2, true); UI.log('「いいぞ！あと3回！」ジンの指導で限界を超えた。', 'good'); } }, jinHere ? null : 'ジンがいない');
        break;
      }
      case 'library':
        add('勉強する（2時間）', '知力↑・経験値', () => { this.grow('int', 0.35 * (p.traits.includes('bookworm') ? 1.5 : 1)); P.gainExp(8 + p.level * 3); p.needs.fatigue = U.clamp(p.needs.fatigue + 5, 0, 100); this.addMinutes(120); UI.log('静かな閲覧室で集中できた。', 'good'); });
        add('魔導書の写本を読む', '今日の蔵書から習得（4時間）', () => UI.libraryModal());
        add('読書（1時間）', 'ストレス-10', () => { p.needs.stress = U.clamp(p.needs.stress - 10, 0, 100); this.addMinutes(60); UI.log('物語の世界に浸った。', 'good'); });
        break;
      case 'jobcenter': break;
      case 'restaurant':
        add('コース料理（¥3,800）', '満腹+60・回復力アップ', () => { if (!this.pay(3800)) return; p.needs.hunger = U.clamp(p.needs.hunger + 60, 0, 100); p.today.kcal += 1100; p.today.protein += 40; p.needs.stress = U.clamp(p.needs.stress - 12, 0, 100); P.addBuff('美食の余韻', 6000, { hpRegen: 3 }); this.addMinutes(90); UI.log('絶品だった。', 'good'); });
        add('ステーキ（¥2,800）', 'タンパク質たっぷり', () => { if (!this.pay(2800)) return; p.needs.hunger = U.clamp(p.needs.hunger + 50, 0, 100); p.today.kcal += 900; p.today.protein += 55; this.addMinutes(60); UI.log('肉汁が溢れる。', 'good'); });
        add('サラダランチ（¥1,500）', 'ヘルシー・肌に良い', () => { if (!this.pay(1500)) return; p.needs.hunger = U.clamp(p.needs.hunger + 35, 0, 100); p.today.kcal += 500; p.today.protein += 20; p.today.skin += 1; this.addMinutes(45); UI.log('彩り豊か。', 'good'); });
        break;
      case 'casino':
        add('スロット（¥1,000）', '一攫千金', () => { if (!this.pay(1000)) return; this.addMinutes(10); const r = Math.random(); let msg; if (r < 0.62) msg = 'ハズレ。'; else if (r < 0.88) { p.money += 2000; msg = '小当たり！ ¥2,000'; } else if (r < 0.98) { p.money += 8000; msg = '当たり！ ¥8,000'; } else { p.money += 50000; msg = '★大当たり★ ¥50,000！'; SND.play('drop_legend'); } p.needs.stress = U.clamp(p.needs.stress + (r < 0.62 ? 2 : -5) * (p.traits.includes('gambler') ? -1 : 1), 0, 100); UI.log('スロット：' + msg, r < 0.62 ? 'dim' : 'gold'); });
        add('骨董くじ（未鑑定品を買う）', '種類を選んで運試し', () => UI.gambleModal());
        break;
      case 'blackmarket': shop('闇市の品'); break;
      case 'fortune':
        add('運勢を占う（¥3,000）', '今日の運気バフ', () => { if (!this.pay(3000)) return; const f = U.wpick(DATA.fortunes, x => ({ 大吉: 2, 中吉: 3, 小吉: 3, 吉: 2, 末吉: 2, 凶: 1, 大凶: 0.4 }[x.n])); P.addBuff('占い：' + f.n, 9000, f.buff); this.addMinutes(30); UI.dialog({ title: `占い【${f.n}】`, text: `<p>水晶玉が淡く光る……「${f.d}」</p>`, choices: [{ label: '閉じる', fn: () => UI.closeDialog() }] }); });
        add('人の本性を占う（¥8,000）', '裏切りやすさ・嫉妬深さが分かる', () => UI.selectNpc({ title: '誰の本性を占う？', onPick: id => { if (!this.pay(8000)) return; G.npcs[id].revealed = true; const d = NP.def(id); this.addMinutes(30); UI.dialog({ title: `${d.n}の本性`, text: `<p>裏切りの相：<b>${this.lvWord(d.betray)}</b><br>嫉妬の相：<b>${this.lvWord(d.jealous)}</b><br>あなたとの相性：<b>${this.compatWord(NP.compat(d))}</b></p>`, choices: [{ label: '閉じる', fn: () => UI.closeDialog() }] }); } }));
        break;
      case 'backdoc': {
        const c = Math.round(this.hospCost() * 0.5);
        add(`闇治療（¥${U.fmt(c)}）`, '安いが副作用あり(15%)', () => { if (!this.pay(c)) return; P.fullHeal(); this.addMinutes(this.hospMins()); if (U.chance(0.15)) { const r = U.pick(['skin', 'stress', 'stat']); if (r === 'skin') p.body.skin = U.clamp(p.body.skin - 10, 0, 100); if (r === 'stress') p.needs.stress = U.clamp(p.needs.stress + 20, 0, 100); if (r === 'stat') { const k = U.pick(['str', 'dex', 'agi']); p.base[k] = Math.max(1, p.base[k] - 1); } UI.log('治療は済んだが、副作用が出た……。', 'bad'); } else UI.log('腕は確かだった。', 'good'); }, c < 25 ? '治療の必要はない' : null);
        add('肉体改造（¥50,000）', '筋肉量+10・副作用あり', () => { if (!this.pay(50000)) return; p.body.muscle = U.clamp(p.body.muscle + 10, 0, 100); p.needs.stress = U.clamp(p.needs.stress + 20, 0, 100); this.addMinutes(180); if (U.chance(0.1)) { p.base.vit = Math.max(1, p.base.vit - 1); UI.log('体が悲鳴を上げている。体力が1下がった。', 'bad'); } else UI.log('筋肉が膨れ上がった。', 'good'); });
        add('美容整形（¥120,000）', '素の顔立ち+8', () => { if (!this.pay(120000)) return; p.body.looks = Math.min(88, p.body.looks + 8); p.needs.stress = U.clamp(p.needs.stress + 10, 0, 100); this.addMinutes(240); UI.log('鏡の中の自分が少し変わった。', 'good'); }, p.body.looks >= 88 ? 'これ以上は無理' : null);
        break;
      }
      case 'gate':
        for (const f of p.checkpoints) add(`${f}階から潜る`, DG.biomeFor(f).n, () => this.dive(f));
        break;
    }
    for (const j of jobs) {
      const req = j.req || {};
      let why = null;
      if (req.int && G.d.attr.int < req.int) why = `知力${req.int}必要`;
      if (req.str && G.d.attr.str < req.str) why = `筋力${req.str}必要`;
      if (req.charm && G.d.charm < req.charm) why = `魅力度${req.charm}必要`;
      if (p.needs.fatigue > 85) why = '疲れすぎている';
      add(`バイト：${j.n}（${j.hrs}時間）`, `¥${U.fmt(j.pay * j.hrs)}・${j.d}`, () => this.work(j), why);
    }
    if (fid === 'jobcenter') for (const j of DATA.jobs.filter(x => x.at !== 'jobcenter')) add(`紹介：${j.n}`, `${DATA.facilities[j.at].n}で募集中`, () => UI.toast(`${DATA.facilities[j.at].n}に行けば働ける`));
    return A;
  },
  lvWord(v) { return v >= 0.6 ? '非常に強い' : v >= 0.3 ? '強い' : v >= 0.12 ? 'やや有る' : v > 0.02 ? 'わずか' : 'ほぼ無い'; },
  compatWord(c) { return c >= 1.2 ? '最高' : c >= 0.5 ? '良い' : c >= -0.2 ? '普通' : c >= -0.8 ? '悪い' : '最悪'; },
  idCost(it) { return Math.round([0, 0, 100, 500, 2000, 6000, 6000, 15000, 20000][it.rar] * (1 + it.ilvl / 40)); },
  work(j) {
    const p = G.player;
    let pay = j.pay * j.hrs;
    p.needs.fatigue = U.clamp(p.needs.fatigue + j.fat * j.hrs, 0, 100);
    p.needs.stress = U.clamp(p.needs.stress + (j.str || 0) * j.hrs, 0, 100);
    p.needs.hunger = U.clamp(p.needs.hunger - 4 * j.hrs, 0, 100);
    if (j.kcal) p.today.act += j.kcal;
    for (const k in (j.gain || {})) this.grow(k, j.gain[k] * j.hrs);
    if (j.muscle) p.today.train += j.muscle * j.hrs;
    this.addMinutes(j.hrs * 60);
    p.money += pay;
    let extra = '';
    if (j.id === 'j_sort' && U.chance(0.15)) { const it = IT.randomCons(Math.max(1, p.counters.maxFloor)); P.addItem(it); extra = `（${IT.name(it)}をこっそり貰った）`; }
    if (j.id === 'j_bar') extra = `噂：${this.rumor()}`;
    UI.log(`${j.n}として働いた。${U.yen(pay)}を稼いだ。${extra}`, 'gold');
  },
  rumor() {
    const r = [
      () => { const top = NP.ranking()[0]; return `今のランキング1位は${top.n}だってさ。`; },
      () => '宝石トカゲを倒すと宝石を落とすらしい。結晶洞窟(16〜20階)にいるとか。',
      () => '財宝運びのゴブリンを見たら、何を置いても追いかけろ。',
      () => '闇市の品は全部未鑑定。たまにとんでもない当たりがあるって話だ。',
      () => '骨董くじは、魔物から拾うよりレアが出やすいらしい。',
      () => '鍛冶屋で+4以上の強化に失敗すると、強化値が下がることがある。上質な強化石なら安心だ。',
      () => '異界品ってのは、常識外れの力を持つ代わりに、ひどい代償があるらしい。',
      () => '仲間の信頼が低いと、レアを見た瞬間に裏切る奴もいる。占いの館で本性を見てもらうといい。',
      () => '5階ごとに主がいる。倒せばゲートから直接その先に行けるようになる。',
      () => 'プロテインは一日の総量が大事。筋肉は寝てる間に育つ。',
      () => '生活魔法を馬鹿にしちゃいけない。育て切った「着火」で主を焼いた奴がいる。',
      () => { const g = NP.def('gou'); return `${g.n}の一味が${15 + U.ri(0, 20)}階あたりで冒険者を襲ってるらしい。気をつけな。`; },
      () => '「神の滴」は、選んだ効果の数値を下げずに振り直せる。完璧ロールを狙うならこれだ。',
      () => '保険をかけた装備は、迷宮で全部失っても翌日戻ってくる。ハードコア勢の必需品だよ。',
    ];
    return U.pick(r)();
  },
  sleepUntil(h) {
    const p = G.player;
    let diff = h * 60 - G.minute; if (diff <= 0) diff += 1440;
    const hrs = diff / 60;
    P.sleep(Math.min(hrs, 10), 1);
    this.addMinutes(diff, true);
    P.needsTick(diff * 0.35, 1);
    p.needs.fatigue = U.clamp(p.needs.fatigue - 0, 0, 100);
    UI.log(`${Math.round(hrs * 10) / 10}時間眠った。${TW.timeLabel()}`, 'good');
    SV.auto();
  },
  sleepHours(h) {
    P.sleep(h, 0.95);
    this.addMinutes(h * 60, true);
    P.needsTick(h * 60 * 0.35, 1);
    UI.log(`${h}時間眠った。${TW.timeLabel()}`, 'good');
    SV.auto();
  },
  dive(f) {
    const p = G.player;
    const warn = [];
    if (p.needs.hunger < 30) warn.push('お腹が空いている'); if (p.needs.thirst < 30) warn.push('喉が渇いている');
    if (p.needs.fatigue > 70) warn.push('かなり疲れている');
    if (!p.inv.some(x => x.kind === 'cons' && DATA.cons[x.id].k === 'med')) warn.push('医療品を持っていない');
    if (P.hpRatio() < 0.6) warn.push('怪我が治っていない');
    if (G.d.wpn.ammo && !CB.ammoFor(G.d.wpn.ammo) && !CB.magOf()) warn.push('弾薬がない');
    const go = () => { UI.closeDialog(); DG.enter(f); };
    if (warn.length) UI.dialog({ title: '本当に潜る？', text: `<p class="bad">${warn.join('<br>')}</p>`, choices: [{ label: 'それでも潜る', fn: go }, { label: 'やめておく', fn: () => UI.closeDialog() }] });
    else go();
  },
};

</script>
<script>
/* js/ui.js */
'use strict';
/* ===== 画面：描画・入力・演出 ===== */
const UI = {
  logs: [], fx: [], ts: 28, anim: null, mapDirty: true, autoTimer: null, pending: null,
  $(id) { return document.getElementById(id); },

  init() {
    window.addEventListener('resize', () => { this.resize(); });
    if (window.ResizeObserver) { try { new ResizeObserver(() => this.resize()).observe(this.$('view')); } catch (e) { /* 無視 */ } }
    document.addEventListener('keydown', e => this.key(e));
    const cv = this.$('cv');
    cv.addEventListener('click', e => this.canvasClick(e));
    cv.addEventListener('mousemove', e => this.canvasHover(e));
    cv.addEventListener('mouseleave', () => this.hideTip());
    this.$('mini').addEventListener('click', () => this.mapModal());
    document.addEventListener('click', () => SND.init(), { once: true });
    this.buildDpad();
    this.resize();
  },
  resize() {
    const cv = this.$('cv'); if (!cv) return;
    const host = this.$('dungeon-view');
    const W = host.clientWidth, H = host.clientHeight;
    if (!W || !H) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    this.dpr = dpr;
    const zoom = (G && G.settings && G.settings.zoom) || 1;
    this.ts = U.clamp(Math.floor(Math.min(W / 21, H / 14) * zoom), 16, 48);
    this.mapDirty = true; this.mapFull = true;
    this.draw();
  },

  /* ===== 画面切り替え ===== */
  showDungeon() {
    this.$('town-view').style.display = 'none';
    this.$('dungeon-view').style.display = 'block';
    document.body.classList.add('in-dungeon');
    this.mapDirty = true; this.mapFull = true;
    this.resize();
    this.refresh();
    this.startAnim();
  },
  showTown() {
    this.stopAuto();
    this.$('dungeon-view').style.display = 'none';
    this.$('town-view').style.display = 'block';
    document.body.classList.remove('in-dungeon');
    if (!G.district) G.district = DATA.facilities[G.loc] ? DATA.facilities[G.loc].dist : 'res';
    if (G.loc && DATA.facilities[G.loc]) G.district = DATA.facilities[G.loc].dist;
    this.refresh();
  },
  refresh() {
    if (!G || !G.player) return;
    this.renderTop(); this.renderStatus(); this.renderHotbar();
    if (G.mode === 'town') TW.render();
    else { this.mapDirty = true; this.draw(); this.drawMini(); }
    if (this._refreshModal) { try { this._refreshModal(); } catch (e) { console.error(e); } }
  },
  afterTurn() {
    this.mapDirty = true;
    this.renderTop(); this.renderStatus(); this.renderHotbar();
    this.draw(); this.drawMini();
    if (G.target) { const t = G.dungeon && G.dungeon.mons.find(m => m.uid === G.target); if (!t || t.dead) G.target = null; }
  },

  /* ===== 上部バー ===== */
  renderTop() {
    const p = G.player;
    let loc;
    if (G.mode === 'dungeon') loc = `${G.dungeon.floor}階・${DG.biomeFor(G.dungeon.floor).n}`;
    else loc = G.loc && DATA.facilities[G.loc] ? DATA.facilities[G.loc].n : DATA.districts.find(d => d.id === G.district).n;
    this.$('tb-time').textContent = TW.timeLabel();
    this.$('tb-loc').textContent = loc;
    this.$('tb-money').textContent = U.yen(p.money);
  },

  /* ===== ステータス ===== */
  partColor(pid) {
    const p = G.player, pp = p.parts[pid], mx = G.d.hpMax[pid];
    if (pp.dead) return '#222';
    const r = pp.hp / mx;
    return r > 0.75 ? '#2e9e5b' : r > 0.5 ? '#9ab83a' : r > 0.25 ? '#d99a2b' : '#d0453a';
  },
  renderStatus() {
    const p = G.player, d = G.d, n = p.needs;
    const part = (id, cls) => {
      const pp = p.parts[id], def = DATA.parts.find(x => x.id === id);
      const ic = (pp.bl ? (pp.bl === 2 ? '🩸🩸' : '🩸') : '') + (pp.fr ? '🦴' : '') + (pp.dead ? '✖' : '');
      return `<div class="bp ${cls}" style="background:${this.partColor(id)}" title="${def.n} ${Math.round(pp.hp)}/${d.hpMax[id]} 防御${d.armor[id]}"><span>${def.n}</span><b>${Math.ceil(pp.hp)}</b><i>${ic}</i></div>`;
    };
    const tot = P.hp(), tm = d.hpTotalMax;
    const nb = (lbl, v, inv, cls) => `<div class="need"><span>${lbl}</span>${U.bar(v, 100, (inv ? (v > 80 ? 'bad' : v > 60 ? 'warn' : '') : (v < 20 ? 'bad' : v < 40 ? 'warn' : '')) + ' ' + (cls || ''))}<em>${Math.round(v)}</em></div>`;
    const st = [];
    for (const k in p.status) { const nm = { poison: '毒', burn: '炎上', freeze: '凍結', stun: 'スタン', slow: '鈍足', weaken: '衰弱', root: '拘束', sleep: '睡眠' }[k]; if (nm) st.push(`<span class="chip bad">${nm}</span>`); }
    if (d.pain) st.push('<span class="chip bad">痛み</span>');
    if (p.painSup > 0) st.push(`<span class="chip">鎮痛${Math.ceil(p.painSup)}</span>`);
    if (p.alc > 1) st.push('<span class="chip warn">酔い</span>');
    if (d.weight > d.carry) st.push('<span class="chip bad">重量超過</span>');
    if (p.barrier > 0) st.push(`<span class="chip good">障壁${Math.round(p.barrier)}</span>`);
    for (const b of p.buffs) st.push(`<span class="chip ${Object.values(b.mods).some(v => v < 0) && !Object.values(b.mods).some(v => v > 0) ? 'bad' : 'good'}" title="${Object.keys(b.mods).map(k => IT.modLine(k, U.round1(b.mods[k]))).join(' ')}">${U.esc(b.n)}${G.mode === 'dungeon' ? ' ' + Math.ceil(b.dur) : ''}</span>`);
    let party = '';
    if (G.party.length) {
      party = '<div class="party">' + G.party.map(id => {
        const a = G.dungeon ? G.dungeon.mons.find(m => m.npc === id) : null;
        return `<div class="pm"><span>${NP.def(id).n} Lv${G.npcs[id].lvl}</span>${a ? U.bar(a.hp, a.mhp, 'hp') : ''}</div>`;
      }).join('') + '</div>';
    }
    let ammo = '';

      <div class="who"><b>${U.esc(p.name)}</b> <span>Lv${p.level}</span> <span class="dim">${DATA.races.find(r => r.id === p.race).n}</span></div>
      <div class="xp">${U.bar(p.exp, P.expNeed(p.level), 'xp')}</div>
      ${pts}
      <div class="body">${part('head', 'h')}${part('larm', 'la')}${part('chest', 'c')}${part('rarm', 'ra')}${part('stomach', 's')}${part('lleg', 'll')}${part('rleg', 'rl')}</div>
      <div class="hpt">HP ${Math.ceil(tot)}/${tm}${U.bar(tot, tm, 'hp')}</div>
      <div class="sm"><span>ST ${Math.round(p.st)}/${d.stMax}</span>${U.bar(p.st, d.stMax, 'st')}<span>MP ${Math.round(p.mp)}/${d.mpMax}</span>${U.bar(p.mp, d.mpMax, 'mp')}</div>
      <div class="needs">${nb('満腹', n.hunger)}${nb('水分', n.thirst)}${nb('疲労', n.fatigue, 1)}${nb('ストレス', n.stress, 1)}${nb('清潔', n.hygiene)}</div>

  },

  /* ===== ホットバー ===== */
  renderHotbar() {
    const p = G.player;
    const hb = this.$('hotbar');
    let h = '';
    p.hotbar.forEach((id, i) => {
      if (!id || !p.skills[id]) { h += `<button class="hk empty" data-hk="${i}"><i>${i + 1}</i>—</button>`; return; }
      const e = SK.eff(id), cd = p.cds[id] || 0, c = SK.cost(e);
      const can = SK.canUse(id);
      h += `<button class="hk ${can.ok ? '' : 'off'}" data-hk="${i}" title="${U.esc(e.name)} Lv${e.lv}：${U.esc(SK.desc(id))}"><i>${i + 1}</i><b>${U.esc(e.name)}</b><small>${c.mp ? 'MP' + c.mp : ''}${c.st ? ' ST' + c.st : ''}</small>${cd > 0 ? `<em>${Math.ceil(cd)}</em>` : ''}</button>`;
    });
    hb.innerHTML = h;
    hb.querySelectorAll('[data-hk]').forEach(b => b.onclick = () => this.useHotkey(+b.dataset.hk));
    // クイックアイテム
    const q = this.$('quick');
    const qs = G.d.quickSlots;
    let qh = '';
    for (let i = 0; i < qs; i++) {
      const id = p.quick[i];
      const cnt = id ? P.countCons(id) + (p.pouch.filter(x => x.kind === 'cons' && x.id === id).reduce((s, x) => s + x.qty, 0)) : 0;
      qh += id ? `<button class="qk ${cnt ? '' : 'off'}" data-qk="${i}" title="${DATA.cons[id].n}"><span style="color:${DATA.cons[id].c}">${DATA.cons[id].n}</span><em>${cnt}</em></button>` : `<button class="qk empty" data-qk="${i}">空</button>`;
    }
    q.innerHTML = qh;
    q.querySelectorAll('[data-qk]').forEach(b => b.onclick = () => this.useQuick(+b.dataset.qk));
  },
  useHotkey(i) {
    const id = G.player.hotbar[i];
    if (!id) { this.skillModal(); return; }
    this.stopAuto();
    if (G.mode === 'dungeon') DG.useSkillAct(id);
    else { const c = CB.useSkill(id); if (c) { TW.addMinutes(5); this.refresh(); } }
  },
  useQuick(i) {
    const p = G.player, id = p.quick[i];
    if (!id) { this.toast('持ち物画面で消耗品を「クイック登録」できる'); return; }
    const it = P.findCons(id);
    if (!it) { this.toast(`${DATA.cons[id].n}がない`); return; }
    this.useItem(it.uid);
  },
  useItem(uid) {
    const t = P.useCons(uid);
    if (!t) { this.refresh(); return false; }
    if (G.mode === 'dungeon') DG.endTurn(t);
    else { TW.addMinutes(Math.max(1, Math.round(t))); this.refresh(); }
    return true;
  },

  /* ===== ログ ===== */
  log(text, cls = '') {
    this.logs.push({ text, cls });

    const el = this.$('log'); if (!el) return;
    const div = document.createElement('div');

    div.innerHTML = text;

    el.scrollTop = el.scrollHeight;
  },
  toast(msg) {

    const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg;
    r.appendChild(d);
    setTimeout(() => d.classList.add('out'), 1800);
    setTimeout(() => d.remove(), 2300);
  },
  banner(text, color, rar) {
    const b = this.$('banner'); if (!b) return;
    b.innerHTML = `<div class="bn ${rar >= 7 ? 'mythic' : rar === 8 ? 'anom' : ''}" style="--c:${color}">${U.esc(text)}</div>`;
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');

  },
  flash(color) {

    f.style.background = color; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  },
  hurtFlash() { const f = this.$('flash'); if (!f) return; f.style.background = 'rgba(255,0,0,.35)'; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); },
  fxHeart(good) { if (G.mode !== 'town') return; this.toast(good ? '♥ 好感度アップ' : '…好感度ダウン'); },

  /* ===== 迷宮描画 ===== */
  cam() {
    const d = G.dungeon, cv = this.$('cv');
    const W = cv.width / this.dpr, H = cv.height / this.dpr, ts = this.ts;
    const cols = Math.ceil(W / ts) + 1, rows = Math.ceil(H / ts) + 1;
    return { ox: Math.round(W / 2 - (d.px + 0.5) * ts), oy: Math.round(H / 2 - (d.py + 0.5) * ts), W, H, ts, cols, rows };
  },
  buildMapLayer() {
    const d = G.dungeon, ts = this.ts, b = DG.biomeFor(d.floor);
    if (!this.layer) this.layer = document.createElement('canvas');
    const L = this.layer;
    const key = d.floor + ':' + d.turn0 + ':' + ts + ':' + d.w;
    let x0 = 0, y0 = 0, x1 = d.w - 1, y1 = d.h - 1;
    const prev = this._lp;
    const full = this.mapFull || this._lkey !== key || !prev || U.dist(prev[0], prev[1], d.px, d.py) > 2 || L.width !== d.w * ts;
    if (full) { L.width = d.w * ts; L.height = d.h * ts; }
    else {
      const r = (G.d ? G.d.light : 6) + 2;
      x0 = Math.max(0, Math.min(prev[0], d.px) - r); y0 = Math.max(0, Math.min(prev[1], d.py) - r);
      x1 = Math.min(d.w - 1, Math.max(prev[0], d.px) + r); y1 = Math.min(d.h - 1, Math.max(prev[1], d.py) + r);
    }
    const c = L.getContext('2d');
    c.clearRect(x0 * ts, y0 * ts, (x1 - x0 + 1) * ts, (y1 - y0 + 1) * ts);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    const f1 = `${Math.floor(ts * 0.6)}px monospace`, f2 = `bold ${Math.floor(ts * 0.8)}px monospace`;
    c.font = f1;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const i = y * d.w + x;
      if (!d.seen[i]) continue;
      const t = d.map[i], X = x * ts, Y = y * ts;
      if (t === 0 || t === 8) {
        c.fillStyle = b.wall; c.fillRect(X, Y, ts, ts);
        c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(X, Y + ts - 3, ts, 3);
      } else {
        c.fillStyle = b.floor; c.fillRect(X, Y, ts, ts);
        if (t === 1) { c.fillStyle = b.fc; c.fillText('·', X + ts / 2, Y + ts / 2); }
        else if (t === 2) { c.fillStyle = '#ffd84a'; c.font = f2; c.fillText('>', X + ts / 2, Y + ts / 2); c.font = f1; }
        else if (t === 3) { c.fillStyle = '#4ee0ff'; c.fillText('◎', X + ts / 2, Y + ts / 2); }
        else if (t === 4) { c.fillStyle = 'rgba(70,140,220,.35)'; c.fillRect(X, Y, ts, ts); c.fillStyle = '#5aa0ff'; c.fillText('≈', X + ts / 2, Y + ts / 2); }
        else if (t === 9) { c.fillStyle = 'rgba(255,90,20,.55)'; c.fillRect(X, Y, ts, ts); c.fillStyle = '#ffb040'; c.fillText('≈', X + ts / 2, Y + ts / 2); }
        else if (t === 10) { c.fillStyle = 'rgba(170,220,255,.28)'; c.fillRect(X, Y, ts, ts); c.fillStyle = '#d8f0ff'; c.fillText('◇', X + ts / 2, Y + ts / 2); }
        else if (t === 11) { c.fillStyle = 'rgba(120,200,60,.28)'; c.fillRect(X, Y, ts, ts); c.fillStyle = '#a8f060'; c.fillText('"', X + ts / 2, Y + ts / 2); }
        else if (t === 12) { c.fillStyle = 'rgba(255,240,80,.18)'; c.fillRect(X, Y, ts, ts); c.fillStyle = '#fff060'; c.fillText('⌁', X + ts / 2, Y + ts / 2); }
      }
      if (!d.vis[i]) { c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(X, Y, ts, ts); }
    }
    this._lkey = key; this._lp = [d.px, d.py];
    this.mapDirty = false; this.mapFull = false;
  },
  draw() {
    if (!G || G.mode !== 'dungeon' || !G.dungeon) return;
    const cv = this.$('cv'), ctx = cv.getContext('2d');
    const d = G.dungeon;
    if (this.mapDirty || !this.layer || this.layer.width !== d.w * this.ts) this.buildMapLayer();
    const cam = this.cam(), ts = cam.ts;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.fillStyle = '#07070b'; ctx.fillRect(0, 0, cam.W, cam.H);
    {
      const sx0 = Math.max(0, -cam.ox), sy0 = Math.max(0, -cam.oy);
      const dx0 = Math.max(0, cam.ox), dy0 = Math.max(0, cam.oy);
      const sw = Math.min(this.layer.width - sx0, cam.W - dx0), sh = Math.min(this.layer.height - sy0, cam.H - dy0);
      if (sw > 0 && sh > 0) ctx.drawImage(this.layer, sx0, sy0, sw, sh, dx0, dy0, sw, sh);
    }
    const now = performance.now();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const sx = x => cam.ox + x * ts, sy = y => cam.oy + y * ts;
    const onScreen = (x, y) => sx(x) > -ts && sy(y) > -ts * 4 && sx(x) < cam.W + ts && sy(y) < cam.H + ts;
    // 地形効果
    for (const h of d.hazards) {
      if (!d.vis[h.y * d.w + h.x] || !onScreen(h.x, h.y)) continue;
      ctx.fillStyle = { fire: 'rgba(255,100,30,.35)', ice: 'rgba(120,200,255,.35)', poison: 'rgba(120,255,60,.3)', ltn: 'rgba(255,255,80,.3)', dark: 'rgba(140,60,200,.35)', holy: 'rgba(255,255,200,.35)' }[h.el] || 'rgba(255,255,255,.2)';
      ctx.fillRect(sx(h.x), sy(h.y), ts, ts);
    }
    // 地物
    ctx.font = `${Math.floor(ts * 0.7)}px monospace`;
    for (const f of d.feats) {
      if (f.gone || !d.seen[f.y * d.w + f.x] || !onScreen(f.x, f.y)) continue;
      if (f.t === 'trap' && f.hidden) continue;
      const g = { chest: '■', event: '?', shrine: f.used ? '†' : '✝', fountain: '❂', trial: '♜', portal: f.kind === 'deep' ? '◉' : '✺', trap: '^' }[f.t] || '?';
      let col = { chest: f.type === 'rare' ? '#ffd84a' : f.type === 'locked' ? '#c0a080' : '#a0703a', event: `hsl(${(now / 8) % 360},80%,70%)`, shrine: f.used ? '#666' : '#e8f4ff', fountain: '#6ef0ff', trial: f.used ? '#666' : '#ff9a40', trap: '#ff5050' }[f.t];
      if (f.t === 'portal') {
        col = f.kind === 'deep' ? '#b070ff' : `hsl(${(now / 4) % 360},90%,70%)`;
        ctx.fillStyle = this.alpha(f.kind === 'deep' ? '#b070ff' : '#ff6be6', 0.18 + 0.12 * Math.sin(now / 200));
        ctx.beginPath(); ctx.arc(sx(f.x) + ts / 2, sy(f.y) + ts / 2, ts * 0.6, 0, 7); ctx.fill();
      }
      ctx.fillStyle = col; ctx.fillText(g, sx(f.x) + ts / 2, sy(f.y) + ts / 2);
    }
    // アイテム（山積みは一番レアなもの）
    const piles = {};
    for (const e of d.items) {
      const k = e.x + ',' + e.y;
      const r = e.it.kind === 'equip' ? e.it.rar + 10 : e.it.kind === 'gold' ? 5 : 1;
      if (!piles[k] || r > piles[k].r) piles[k] = { e, r, n: (piles[k] ? piles[k].n : 0) + 1 }; else piles[k].n++;
    }
    let beams = false;
    for (const k in piles) {
      const { e, n } = piles[k];
      if (!d.seen[e.y * d.w + e.x] || !onScreen(e.x, e.y)) continue;
      const it = e.it, X = sx(e.x), Y = sy(e.y);
      if (it.kind === 'equip' && it.rar >= 3) {
        beams = true;
        const col = DATA.rarities[it.rar].c;
        const hgt = ts * (it.rar >= 7 ? 5 : it.rar >= 5 ? 4 : it.rar === 4 ? 2.6 : 1.6);
        const pulse = 0.55 + 0.45 * Math.sin(now / (it.rar >= 5 ? 160 : 260) + e.x);
        const grd = ctx.createLinearGradient(0, Y + ts, 0, Y + ts - hgt);
        const c2 = it.rar === 8 ? `hsl(${(now / 5) % 360},90%,70%)` : col;
        grd.addColorStop(0, this.alpha(c2, 0.75 * pulse)); grd.addColorStop(1, this.alpha(c2, 0));
        ctx.fillStyle = grd;
        const bw = ts * (it.rar >= 5 ? 0.5 : 0.32);
        ctx.fillRect(X + ts / 2 - bw / 2, Y + ts - hgt, bw, hgt);
        if (it.rar >= 5) { ctx.fillStyle = this.alpha(c2, 0.2 * pulse); ctx.beginPath(); ctx.arc(X + ts / 2, Y + ts / 2, ts * 0.7, 0, 7); ctx.fill(); }
      }
      ctx.fillStyle = it.kind === 'equip' ? DATA.rarities[it.rar].c : IT.color(it);
      ctx.font = `bold ${Math.floor(ts * 0.68)}px monospace`;
      ctx.fillText(IT.glyph(it), X + ts / 2, Y + ts / 2);
      if (n > 1) { ctx.font = `${Math.floor(ts * 0.32)}px monospace`; ctx.fillStyle = '#fff'; ctx.fillText(n, X + ts * 0.85, Y + ts * 0.2); }
    }
    // 魔物
    const sense = G.d.sense, det = d.detect > 0;
    for (const m of d.mons) {
      if (m.dead || !onScreen(m.x, m.y)) continue;
      const vis = d.vis[m.y * d.w + m.x] && !(m.ab.invis && U.dist(m.x, m.y, d.px, d.py) > 1 && !m.ally);
      const near = U.dist(m.x, m.y, d.px, d.py);
      if (!vis && !(det || (sense && near <= sense))) continue;
      const X = sx(m.x), Y = sy(m.y);
      ctx.globalAlpha = vis ? 1 : 0.35;
      if (m.ally) { ctx.fillStyle = 'rgba(80,220,160,.25)'; ctx.fillRect(X + 2, Y + 2, ts - 4, ts - 4); }
      if (m.boss || m.uniq || (m.elite && m.elite.length)) { ctx.strokeStyle = m.boss ? '#ff3b4e' : m.uniq ? '#ff8c1a' : '#c06bff'; ctx.lineWidth = 2; ctx.strokeRect(X + 2, Y + 2, ts - 4, ts - 4); }
      ctx.fillStyle = m.c;
      ctx.font = `bold ${Math.floor(ts * (m.boss ? 0.95 : 0.75))}px "M PLUS 1 Code", monospace`;
      ctx.fillText(m.g, X + ts / 2, Y + ts / 2 + 1);
      if (vis && m.hp < m.mhp) { ctx.fillStyle = '#300'; ctx.fillRect(X + 3, Y + ts - 4, ts - 6, 3); ctx.fillStyle = m.ally ? '#4f4' : '#f44'; ctx.fillRect(X + 3, Y + ts - 4, (ts - 6) * Math.max(0, m.hp / m.mhp), 3); }
      if (vis && !m.awake && !m.ally) { ctx.fillStyle = '#88f'; ctx.font = `${Math.floor(ts * 0.3)}px monospace`; ctx.fillText('z', X + ts * 0.85, Y + ts * 0.15); }
      ctx.globalAlpha = 1;
      if (G.target === m.uid) { ctx.strokeStyle = '#ff0'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.strokeRect(X + 1, Y + 1, ts - 2, ts - 2); ctx.setLineDash([]); }
    }
    // プレイヤー
    const PX = sx(d.px), PY = sy(d.py);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(PX + ts / 2, PY + ts / 2, ts * 0.55, 0, 7); ctx.fill();
    ctx.fillStyle = d.recall > 0 ? `hsl(${(now / 4) % 360},90%,75%)` : '#fff';
    ctx.font = `bold ${Math.floor(ts * 0.8)}px monospace`;
    ctx.fillText('@', PX + ts / 2, PY + ts / 2 + 1);
    // 演出
    this.fx = this.fx.filter(f => now - f.t0 < f.dur);
    for (const f of this.fx) {
      const k = (now - f.t0) / f.dur;
      if (f.k === 'text') {
        ctx.globalAlpha = 1 - k; ctx.fillStyle = f.c;
        ctx.font = `bold ${Math.floor(ts * (f.small ? 0.38 : 0.5))}px sans-serif`;
        ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
        const tx = sx(f.x) + ts / 2 + (f.dx || 0), ty = sy(f.y) - k * ts * 0.9;
        ctx.strokeText(f.text, tx, ty); ctx.fillText(f.text, tx, ty);
      } else if (f.k === 'line') {
        ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.c; ctx.lineWidth = f.thick ? 5 : 2;
        ctx.beginPath(); ctx.moveTo(sx(f.x0) + ts / 2, sy(f.y0) + ts / 2); ctx.lineTo(sx(f.x1) + ts / 2, sy(f.y1) + ts / 2); ctx.stroke();
      } else if (f.k === 'area') {
        ctx.globalAlpha = (1 - k) * 0.5; ctx.fillStyle = f.c;
        ctx.fillRect(sx(f.x - f.r), sy(f.y - f.r), (f.r * 2 + 1) * ts, (f.r * 2 + 1) * ts);
      } else if (f.k === 'drop') {
        ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.c; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(sx(f.x) + ts / 2, sy(f.y) + ts / 2, ts * (0.5 + k * 3), 0, 7); ctx.stroke();
        for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283 + k * 2; ctx.fillStyle = f.c; ctx.fillRect(sx(f.x) + ts / 2 + Math.cos(a) * ts * k * 2.5, sy(f.y) + ts / 2 + Math.sin(a) * ts * k * 2.5, 3, 3); }
      }
      ctx.globalAlpha = 1;
    }
    this.needAnim = beams || this.fx.length > 0 || d.feats.some(f => (f.t === 'event' || f.t === 'portal') && !f.gone) || d.recall > 0;
  },
  alpha(c, a) {
    if (c.startsWith('hsl')) return c.replace('hsl', 'hsla').replace(')', `,${a})`);
    const n = parseInt(c.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  },
  startAnim() {
    if (this.anim) return;
    let last = 0;
    const loop = (t) => {
      this.anim = requestAnimationFrame(loop);
      if (!G || G.mode !== 'dungeon') return;
      if (!this.needAnim) return;
      if (t - last < 50) return;
      last = t;
      this.draw();
    };
    this.anim = requestAnimationFrame(loop);
  },
  fxText(x, y, text, c, small) { if (!G.dungeon) return; this.fx.push({ k: 'text', x, y, text: String(text), c, t0: performance.now(), dur: 750, small, dx: (Math.random() - 0.5) * this.ts * 0.5 }); this.needAnim = true; },
  elColor(el) { return { fire: '#ff7a30', ice: '#8fe0ff', ltn: '#fff36a', poison: '#7cff5a', holy: '#fff8c0', dark: '#b06bff', phys: '#e0e0e0', shot: '#ffe0a0', magic: '#e080ff' }[el] || '#fff'; },

    cmp('MP', cur.mpMax, nd.mpMax); cmp('視界', cur.light, nd.light); cmp('所持枠', cur.bagSlots, nd.bagSlots);
    cmp('レア発見', cur.m.magicFind || 0, nd.m.magicFind || 0);
    if (!rows.length) rows.push('<span class="dim">ほぼ変化なし</span>');
    const cn = p.equip[slot] ? IT.name(p.equip[slot]) : 'なし';
    return `<div class="tt-cmp"><div class="dim">装備中（${U.esc(cn)}）と比べて：</div>${rows.join('')}</div>`;
  },
};

</script>
<script>
/* js/ui2.js */
'use strict';
/* ===== 画面：各種ウィンドウ ===== */
Object.assign(UI, {
  bind(root, sel, fn) { root.querySelectorAll(sel).forEach(el => el.addEventListener('click', e => { e.stopPropagation(); SND.play('ui'); fn(el, e); })); },
  isTouch() { return window.matchMedia && window.matchMedia('(hover: none)').matches; },
  itemRow(it, extra = '', o = {}) {
    if (!it) return '';
    const nm = IT.name(it);
    const col = IT.color(it);
    let sub = '';
    if (it.kind === 'equip') sub = `${IT.bases[it.base].typeN}${it.idf ? '' : ''}`;
    else { const c = DATA.cons[it.id]; sub = { med: '医療', food: '食料', drink: '飲料', ingr: '食材', tool: '道具', throw: '投擲', scroll: '巻物', orb: '結晶', mat: '素材', gem: '宝石', ammo: '弾薬', gift: '雑貨', beauty: '美容', book: '書物' }[c.k] || ''; }
    const badges = (it.nw ? '<i class="new">NEW</i>' : '') + (it.lock ? '<i>🔒</i>' : '') + (G.player.insured[it.uid] ? '<i>保</i>' : '') + (it.kind === 'equip' && !it.idf ? '<i class="unid">?</i>' : '');
    const gr = IT.grade(it);
    return `<div class="irow ${it.kind === 'equip' ? 'r' + it.rar : ''}" data-uid="${it.uid}" ${o.attr || ''}><span class="ig" style="color:${col}">${U.esc(IT.glyph(it))}</span><span class="in" style="color:${col}">${U.esc(nm)}${it.kind === 'cons' && it.qty > 1 ? ` ×${it.qty}` : ''}</span><span class="is">${sub}${gr ? ` <b class="g${gr.g}">${gr.g}</b>` : ''}${gr && gr.perfect ? ' <b class="perfect">P</b>' : ''}</span>${badges}${extra}</div>`;
  },
  hoverTips(root, finder, cmp = true) {
    if (this.isTouch()) return;
    root.querySelectorAll('[data-uid]').forEach(el => {
      el.addEventListener('mouseenter', e => { const it = finder(el.dataset.uid); if (it) this.showTip(IT.tooltip(it, cmp && it.kind === 'equip' ? this.compareHtml(it) : ''), e.clientX, e.clientY); });
      el.addEventListener('mousemove', e => { const t = this.$('tip'); if (t.style.display === 'block') this.showTip(t.innerHTML, e.clientX, e.clientY); });
      el.addEventListener('mouseleave', () => this.hideTip());
    });
  },
  npcHead(id) {
    const d = NP.def(id), s = G.npcs[id], stg = NP.stage(id);
    const race = DATA.races.find(r => r.id === d.race);
    return `<div class="npchead"><div class="nface" style="background:hsl(${(id.charCodeAt(0) * 37 + id.length * 61) % 360},45%,32%)">${d.n.charAt(0)}</div><div><b>${d.n}</b> <span class="dim">${race.n}・${d.sex}・${d.age}歳${d.ageNote ? `（${d.ageNote}）` : ''}</span><br><span class="dim">${d.job}</span><br><span style="color:${stg.c}">${stg.n}</span> 好感度${U.bar(s.aff + 100, 200, 'baff')}<span class="dim">${Math.round(s.aff)}</span> 信頼${U.bar(s.trust, 100, 'btrust')}<span class="dim">${Math.round(s.trust)}</span></div></div>`;
  },

  /* ===== NPCとの会話 ===== */
  npcModal(id) {
    const d = NP.def(id), s = G.npcs[id];
    if (s.status === 'lover' && s.jealousPending) { NP.jealousyEvent(id); return; }
    let lastRes = `「${NP.greetLine(id)}」`;
    if (!s.met) { s.met = true; lastRes = `<span class="dim">${d.look}</span><br>「${NP.line(id, 'greet')}」`; }
    const render = () => {
      const p = G.player;
      const tp = [['chat', '世間話'], ['adv', '冒険の話'], ['praise', '褒める'], ['joke', '冗談を言う'], ['tease', 'からかう']];
      if (s.aff >= 30) tp.push(['consult', '相談に乗る']);
      if (s.aff >= 50) tp.push(['deep', '本音を話す']);
      if (s.aff >= 40) tp.push(['flirt', '口説く']);
      let h = this.npcHead(id) + `<div class="npcres">${lastRes}</div>`;
      if (s.aff >= 30 || s.revealed) h += `<div class="dim small">好きなもの：${d.likes.map(t => DATA.giftTagName[t] || t).join('・')}${s.aff >= 50 ? `　苦手：${d.dislikes.map(t => DATA.giftTagName[t] || t).join('・')}` : ''}${s.revealed ? `　裏切りの相：${TW.lvWord(d.betray)}　嫉妬：${TW.lvWord(d.jealous)}` : ''}</div>`;
      h += `<div class="topics">${tp.map(t => `<button data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div class="topics">`;
      h += `<button data-x="gift">贈り物</button>`;
      if (s.aff >= 45 || s.status === 'lover') h += `<button data-x="date">デートに誘う</button>`;
      if (d.cb) h += NP.inParty(id) ? `<button data-x="leave">仲間から外す</button>` : `<button data-x="party">仲間に誘う</button>`;
      if (s.status !== 'lover' && s.aff >= 75) h += `<button data-x="confess" class="pink">告白する</button>`;
      if (s.status === 'lover') h += `<button data-x="breakup" class="dim">別れる</button>`;
      if (!s.evDone && d.event && s.aff >= 50) h += `<button data-x="event" class="gold">★ ${d.n}の話を聞く</button>`;
      h += `</div><div class="dim small">${d.bio}</div>`;
      m.body.innerHTML = h;
      this.bind(m.body, '[data-t]', b => { const r = NP.talk(id, b.dataset.t); lastRes = r.res; render(); this.renderTop(); });
      this.bind(m.body, '[data-x]', b => {
        const x = b.dataset.x;
        if (x === 'gift') { this.selectItem({ title: `${d.n}への贈り物`, filter: it => !Object.values(p.equip).includes(it) && (it.kind === 'cons' ? !['mat', 'orb'].includes(DATA.cons[it.id].k) : true), onPick: it => { const r = NP.talk(id, 'gift', it.uid); lastRes = r.res; render(); } }); return; }
        if (x === 'date') { this.dateModal(id, r => { lastRes = r.res; render(); }); return; }
        if (x === 'event') { this.closeModal(m); NP.personalEvent(id); return; }
        if (x === 'breakup') { this.confirm(`本当に${d.n}と別れる？`, () => { const r = NP.talk(id, 'breakup'); lastRes = r.res; render(); }); return; }
        const r = NP.talk(id, x); lastRes = r.res; render(); this.refresh();
      });
    };
    const m = this.modal('', { title: d.n, wide: true, onClose: () => this.refresh() });
    render();
  },
  dateModal(id, cb) {
    const spots = DATA.dateSpots.filter(s => TW.isOpen(s));
    const cost = { cafe: 1500, cinema: 3600, restaurant: 9000, park: 0, aquarium: 5000, tavern: 4000, shrine: 300 };
    const m = this.modal(`<div class="list">${spots.length ? spots.map(s => `<button class="row" data-s="${s}">${DATA.facilities[s].icon} ${DATA.facilities[s].n}<span>¥${U.fmt(cost[s])}・2.5時間</span></button>`).join('') : '<p class="dim">今の時間に開いているデートスポットがない。</p>'}</div>`, { title: 'どこへ行く？' });
    this.bind(m.body, '[data-s]', b => { this.closeModal(m); cb(NP.date(id, b.dataset.s)); });
  },

  /* ===== 店 ===== */
  openShop(o) {
    const st = o.fid ? TW.stock(o.fid) : { staples: [], items: o.stock, markup: o.markup || 1 };
    const mk = (st.markup || 1) * (o.markup && o.fid ? o.markup : 1);
    let tab = 'buy';
    const render = () => {
      const p = G.player;
      let h = `<div class="tabs"><button class="${tab === 'buy' ? 'on' : ''}" data-tab="buy">買う</button><button class="${tab === 'sell' ? 'on' : ''}" data-tab="sell">売る</button><span class="money">${U.yen(p.money)}</span></div>`;
      if (o.desc) h += `<div class="dim small">${o.desc}</div>`;
      if (tab === 'buy') {
        h += '<div class="shoplist">';
        for (const id of st.staples) {
          const c = DATA.cons[id]; if (!c) continue;
          const price = Math.max(1, Math.round(c.p * mk * (1 - U.clamp(G.d.m.shopDiscount || 0, -30, 40) / 100)));
          const stackable = ['food', 'drink', 'ingr', 'ammo', 'med', 'gem', 'throw', 'scroll', 'beauty', 'tool', 'orb'].includes(c.k);
          h += `<div class="srow" data-cid="${id}"><span class="in" style="color:${c.c}">${U.esc(c.n)}</span><span class="pr">${U.yen(price)}${c.k === 'ammo' ? '/発' : ''}</span><span class="btns">${(c.k === 'ammo' ? [10, 50, 100] : stackable ? [1, 5, 10] : [1]).map(n => `<button data-buy="${id}" data-n="${n}" data-p="${price}" ${p.money < price * n ? 'disabled' : ''}>×${n}</button>`).join('')}</span></div>`;
        }
        for (const it of st.items) {
          const price = IT.buyPrice(it, mk);
          h += `<div class="srow" data-uid="${it.uid}"><span class="in" style="color:${IT.color(it)}">${U.esc(IT.name(it))}</span><span class="is">${it.kind === 'equip' ? IT.bases[it.base].typeN : ''}</span><span class="pr">${U.yen(price)}</span><span class="btns"><button data-bi="${it.uid}" data-p="${price}" ${p.money < price ? 'disabled' : ''}>買う</button>${this.isTouch() ? `<button data-info="${it.uid}">詳細</button>` : ''}</span></div>`;
        }
        if (!st.staples.length && !st.items.length) h += '<p class="dim">品切れ</p>';
        h += '</div>';
      } else {
        h += `<div class="shoplist">${p.inv.filter(it => !it.lock).map(it => `<div class="srow" data-uid="${it.uid}"><span class="in" style="color:${IT.color(it)}">${U.esc(IT.name(it))}${it.kind === 'cons' && it.qty > 1 ? ' ×' + it.qty : ''}</span><span class="pr">${U.yen(IT.sellPrice(it) / (it.kind === 'cons' ? it.qty : 1))}${it.kind === 'cons' && it.qty > 1 ? '/個' : ''}</span><span class="btns"><button data-sell="${it.uid}" data-n="1">売る</button>${it.kind === 'cons' && it.qty > 1 ? `<button data-sell="${it.uid}" data-n="all">全部</button>` : ''}</span></div>`).join('') || '<p class="dim">売れる物がない（🔒は売れない）</p>'}</div>`;
      }
      m.body.innerHTML = h;
      this.bind(m.body, '[data-tab]', b => { tab = b.dataset.tab; render(); });
      this.bind(m.body, '[data-buy]', b => {
        const n = +b.dataset.n, pr = +b.dataset.p * n;
        if (p.money < pr) { this.toast('お金が足りない'); return; }
        const it = IT.cons(b.dataset.buy, n);
        if (G.mode === 'dungeon' && p.inv.length >= G.d.bagSlots && !P.findCons(b.dataset.buy)) { this.toast('持ちきれない'); return; }
        p.money -= pr; P.addItem(it); SND.play('coin');
        if (p.traits.includes('spender')) p.needs.stress = U.clamp(p.needs.stress - 2, 0, 100);
        render(); this.renderTop();
      });
      this.bind(m.body, '[data-bi]', b => {
        const i = st.items.findIndex(x => x.uid === b.dataset.bi); if (i < 0) return;
        const pr = +b.dataset.p; if (p.money < pr) { this.toast('お金が足りない'); return; }
        if (G.mode === 'dungeon' && p.inv.length >= G.d.bagSlots) { this.toast('持ちきれない'); return; }
        p.money -= pr; const it = st.items.splice(i, 1)[0]; it.nw = 1; P.addItem(it); SND.play('coin');
        if (p.traits.includes('spender')) p.needs.stress = U.clamp(p.needs.stress - 3, 0, 100);
        this.log(`${IT.name(it)}を購入した。`, it.kind === 'equip' ? 'r' + it.rar : '');
        render(); this.renderTop();
      });
      this.bind(m.body, '[data-info]', b => { const it = st.items.find(x => x.uid === b.dataset.info); if (it) this.modal(IT.tooltip(it, this.compareHtml(it)), { title: '詳細' }); });
      this.bind(m.body, '[data-sell]', b => { this.sellOne(b.dataset.sell, b.dataset.n); render(); this.renderTop(); });
      this.hoverTips(m.body, uid => st.items.find(x => x.uid === uid) || p.inv.find(x => x.uid === uid));
    };
    const m = this.modal('', { title: o.title, wide: true });
    render();
  },
  sellOne(uid, n) {
    const p = G.player;
    const f = P.findItem(uid); if (!f || f.where !== 'inv') return;
    const it = f.it;
    if (it.lock) { this.toast('ロック中'); return; }
    let qty = it.kind === 'cons' ? (n === 'all' ? it.qty : 1) : 1;
    const unit = IT.sellPrice(it) / (it.kind === 'cons' ? it.qty : 1);
    const price = Math.floor(unit * qty);
    const removed = P.removeItem(uid, it.kind === 'cons' ? qty : undefined);
    p.money += price;
    G.buyback = G.buyback || [];
    G.buyback.unshift({ it: removed, price });
    if (G.buyback.length > 12) G.buyback.pop();
    delete p.insured[uid];
    SND.play('coin');
    this.log(`${IT.name(removed)}${qty > 1 ? ' ×' + qty : ''}を${U.yen(price)}で売った。`, 'gold');
  },
  sellModal() { this.openShop({ title: '古物商「ぽんぽこ堂」', stock: [], desc: '「へい、どれを売ってくれるんで？」' }); },
  bulkSell() {
    const p = G.player;
    const list = p.inv.filter(it => it.kind === 'equip' && !it.lock && it.idf && it.rar <= 2);
    if (!list.length) { this.toast('まとめ売りできる物がない'); return; }
    const total = list.reduce((s, it) => s + IT.sellPrice(it), 0);
    this.confirm(`粗悪・ノーマル・マジックの装備${list.length}点を${U.yen(total)}で売る？<br><span class="dim">（ロック中・未鑑定は除く）</span>`, () => {
      for (const it of list) this.sellOne(it.uid);
      this.refresh();
    });
  },
  buybackModal() {
    const p = G.player, bb = G.buyback || [];
    const m = this.modal('', { title: '買い戻し' });
    const render = () => {
      m.body.innerHTML = bb.length ? bb.map((e, i) => `<div class="srow"><span class="in" style="color:${IT.color(e.it)}">${U.esc(IT.name(e.it))}</span><span class="pr">${U.yen(Math.round(e.price * 1.3))}</span><span class="btns"><button data-bb="${i}">買い戻す</button></span></div>`).join('') : '<p class="dim">最近売った物はない</p>';
      this.bind(m.body, '[data-bb]', b => { const e = bb[+b.dataset.bb]; const pr = Math.round(e.price * 1.3); if (p.money < pr) { this.toast('お金が足りない'); return; } p.money -= pr; P.addItem(e.it); bb.splice(+b.dataset.bb, 1); render(); this.renderTop(); });
    };
    render();
  },

  /* ===== 持ち物 ===== */
  invModal(filter) {
    let flt = filter || 'all', sort = G.settings.invSort || 'kind';
    const m = this.modal('', { title: '持ち物・装備', wide: true, size: 'tall' });
    const render = () => {
      const p = G.player, d = G.d;
      let h = '<div class="invgrid"><div class="eqcol"><div class="sec">装備</div>';
      for (const s of DATA.slotOrder) {
        const it = p.equip[s];
        h += `<div class="eqslot"><span class="sl">${DATA.slots[s]}</span>${it ? this.itemRow(it) : '<div class="irow empty">—</div>'}</div>`;
      }
      const setInfo = Object.keys(d.setsOn).map(sid => `${DATA.sets.find(x => x.id === sid).n}(${d.setsOn[sid]})`).join(' ');
      if (setInfo) h += `<div class="dim small">セット：${setInfo}</div>`;
      h += `<div class="sec">セキュアポーチ（死んでも失わない） ${p.pouch.length}/3</div>`;
      h += p.pouch.map(it => this.itemRow(it)).join('') || '<div class="dim small">空</div>';
      h += '</div><div class="invcol">';
      h += `<div class="tabs">${[['all', '全部'], ['equip', '装備'], ['cons', '消耗品'], ['other', '素材他']].map(t => `<button class="${flt === t[0] ? 'on' : ''}" data-f="${t[0]}">${t[1]}</button>`).join('')}<select data-sort><option value="kind" ${sort === 'kind' ? 'selected' : ''}>種類順</option><option value="rar" ${sort === 'rar' ? 'selected' : ''}>レア順</option><option value="new" ${sort === 'new' ? 'selected' : ''}>新着順</option><option value="val" ${sort === 'val' ? 'selected' : ''}>価値順</option></select></div>`;
      h += `<div class="dim small">所持枠 ${p.inv.length}/${d.bagSlots}　重量 ${d.weight}/${d.carry}kg　${U.yen(p.money)}</div>`;
      let list = p.inv.slice();
      if (flt === 'equip') list = list.filter(x => x.kind === 'equip');
      if (flt === 'cons') list = list.filter(x => x.kind === 'cons' && ['med', 'food', 'drink', 'scroll', 'tool', 'throw', 'beauty', 'book'].includes(DATA.cons[x.id].k));
      if (flt === 'other') list = list.filter(x => x.kind === 'cons' && !['med', 'food', 'drink', 'scroll', 'tool', 'throw', 'beauty', 'book'].includes(DATA.cons[x.id].k));
      const kOrd = it => it.kind === 'equip' ? 0 + DATA.slotOrder.indexOf(IT.bases[it.base].slot) / 100 : 1 + ['med', 'food', 'drink', 'scroll', 'tool', 'throw', 'ammo', 'orb', 'gem', 'book', 'beauty', 'gift', 'ingr', 'mat'].indexOf(DATA.cons[it.id].k) / 100;
      if (sort === 'kind') list.sort((a, b) => kOrd(a) - kOrd(b));
      if (sort === 'rar') list.sort((a, b) => (b.kind === 'equip' ? b.rar : -1) - (a.kind === 'equip' ? a.rar : -1));
      if (sort === 'new') list.sort((a, b) => (b.nw || 0) - (a.nw || 0));
      if (sort === 'val') list.sort((a, b) => IT.value(b) - IT.value(a));
      h += `<div class="ilist">${list.map(it => this.itemRow(it)).join('') || '<p class="dim">何もない</p>'}</div>`;
      h += '</div></div>';
      m.body.innerHTML = h;
      this.bind(m.body, '[data-f]', b => { flt = b.dataset.f; render(); });
      m.body.querySelector('[data-sort]').onchange = e => { sort = e.target.value; G.settings.invSort = sort; render(); };
      this.bind(m.body, '[data-uid]', b => this.itemDetail(b.dataset.uid, render));
      this.hoverTips(m.body, uid => { const f = P.findItem(uid); return f && f.it; });
    };
    m.refresh = render;
    render();
  },
  itemDetail(uid, after) {
    const f = P.findItem(uid); if (!f) return;
    const it = f.it, p = G.player;
    it.nw = 0;
    const inDg = G.mode === 'dungeon';
    const acts = [];
    if (it.kind === 'equip') {
      if (f.where === 'equip') acts.push(['unequip', '外す']);
      else acts.push(['equip', '装備する']);
      const b = IT.bases[it.base];
      if (b.slot === 'ring' && f.where !== 'equip') acts.push(['equip2', '指輪2に装備']);
      if (!it.idf && P.findCons('idscroll')) acts.push(['idscroll', '鑑定の巻物を使う']);
    } else {
      const c = DATA.cons[it.id];
      if (['med', 'food', 'drink', 'scroll', 'tool', 'throw', 'beauty', 'book'].includes(c.k)) acts.push(['use', c.k === 'book' ? '読む' : c.k === 'throw' ? '投げる' : '使う']);
      if (['med', 'food', 'drink', 'scroll', 'tool', 'throw', 'beauty'].includes(c.k)) acts.push(['quick', p.quick.includes(it.id) ? 'クイック解除' : 'クイック登録']);
      if (c.k === 'ammo') acts.push(['ammo', p.ammoSel[c.at] === it.id ? '優先弾薬を解除' : 'この弾薬を優先して使う']);
    }
    if (f.where === 'inv') { if (p.pouch.length < 3) acts.push(['pouch', 'ポーチへ入れる']); }
    if (f.where === 'pouch') acts.push(['unpouch', 'ポーチから出す']);
    if (f.where !== 'equip') acts.push(['lock', it.lock ? 'ロック解除' : 'ロック（売却防止）']);
    if (f.where === 'inv' || f.where === 'pouch') acts.push(['drop', inDg ? '足元に置く' : '捨てる']);
    if (f.where === 'inv' && G.mode === 'town' && G.loc === 'home') acts.push(['stash', '倉庫へ']);
    const m = this.modal(`${IT.tooltip(it, it.kind === 'equip' && f.where !== 'equip' ? this.compareHtml(it) : '')}<div class="acts2">${acts.map(a => `<button data-a="${a[0]}">${a[1]}</button>`).join('')}</div>`, { title: '' });
    const done = () => { this.closeModal(m); P.calc(); if (after) after(); this.refresh(); };
    this.bind(m.body, '[data-a]', b => {
      const a = b.dataset.a;
      if (a === 'equip' || a === 'equip2') { if (P.equipItem(uid, a === 'equip2' ? 'ring2' : null)) { this.log(`${IT.name(it)}を装備した。`, 'r' + it.rar); if (inDg) DG.endTurn(1); } done(); return; }
      if (a === 'unequip') { if (P.unequip(f.slot)) this.log(`${IT.name(it)}を外した。`, 'dim'); done(); return; }
      if (a === 'use') { this.closeModal(m); this.useItem(uid); if (after) after(); return; }
      if (a === 'idscroll') { P.takeCons('idscroll', 1); this.closeModal(m); this.reveal(it); return; }
      if (a === 'quick') { const i = p.quick.indexOf(it.id); if (i >= 0) p.quick[i] = null; else { const j = p.quick.slice(0, G.d.quickSlots).indexOf(null); if (j < 0) { this.toast('クイックスロットが空いていない'); return; } p.quick[j] = it.id; } done(); return; }
      if (a === 'ammo') { const c = DATA.cons[it.id]; p.ammoSel[c.at] = p.ammoSel[c.at] === it.id ? null : it.id; done(); return; }
      if (a === 'pouch') { const r = P.removeItem(uid); p.pouch.push(r); done(); return; }
      if (a === 'unpouch') { if (p.inv.length >= G.d.bagSlots) { this.toast('所持品がいっぱい'); return; } const i = p.pouch.findIndex(x => x.uid === uid); p.inv.push(p.pouch.splice(i, 1)[0]); done(); return; }
      if (a === 'lock') { it.lock = !it.lock; done(); return; }
      if (a === 'stash') { const r = P.removeItem(uid); G.stash.push(r); done(); return; }
      if (a === 'drop') {
        if (it.lock) { this.toast('ロック中'); return; }
        const doit = () => { const r = P.removeItem(uid); delete p.insured[uid]; if (inDg) { G.dungeon.items.push({ x: G.dungeon.px, y: G.dungeon.py, it: r, ign: true }); } this.log(`${IT.name(r)}を${inDg ? '置いた' : '捨てた'}。`, 'dim'); done(); };
        if (!inDg && (it.kind === 'equip' && it.rar >= 3)) this.confirm(`${IT.name(it)}を捨てる？`, doit); else doit();
      }
    });
  },

  /* ===== 鑑定演出 ===== */
  reveal(it, next) {
    const R = DATA.rarities[it.rar];
    const m = this.modal(`<div class="reveal" style="--c:${R.c}"><div class="card ${it.rar >= 5 ? 'big' : ''} ${it.rar === 8 ? 'anom' : ''}"><div class="front">?</div><div class="back"></div></div><div class="rv-actions"></div></div>`, { title: `鑑定：${R.n}`, cls: 'rvwrap' });
    SND.play('identify');
    setTimeout(() => {
      IT.identify(it);
      const back = m.body.querySelector('.back');
      back.innerHTML = IT.tooltip(it, this.compareHtml(it));
      m.body.querySelector('.card').classList.add('flip');
      back.querySelectorAll('.aff, .tt-ex, .tt-anom, .tt-curse').forEach((el, i) => { el.style.animationDelay = (0.25 + i * 0.22) + 's'; el.classList.add('pop'); });
      const gr = IT.grade(it);
      if (it.rar >= 5 || (gr && (gr.g === 'S' || gr.perfect))) { SND.play(it.rar === 8 ? 'drop_anomaly' : 'reveal_good'); this.flash(R.c); }
      if (gr && gr.perfect) this.banner('PERFECT ROLL!!', '#fff');
      if (it.uq) this.log(`鑑定：${IT.name(it)}【${R.n}】${gr ? ` 評価${gr.g}` : ''}`, 'r' + it.rar);
      const act = m.body.querySelector('.rv-actions');
      act.innerHTML = `${next ? '<button data-n="1">次へ</button>' : ''}<button data-c="1">閉じる</button>`;
      this.bind(act, '[data-n]', () => { this.closeModal(m); next(); });
      this.bind(act, '[data-c]', () => this.closeModal(m));
      P.calc(); this.refresh();
    }, it.rar >= 5 ? 900 : 550);
  },
  revealMany(list) {
    const q = list.slice().sort((a, b) => a.rar - b.rar);
    const go = () => { const it = q.shift(); if (!it) return; this.reveal(it, q.length ? go : null); };
    go();
  },

  /* ===== 地図 ===== */
  mapModal() {
    if (G.mode !== 'dungeon') return;
    const m = this.modal('<canvas class="bigmap"></canvas><div class="dim small">白:自分 金:階段 水色:帰還陣 紫:ポータル 赤:敵 光:レア装備</div>', { title: `${G.dungeon.floor}階の地図`, wide: true });
    const c = m.body.querySelector('canvas'), d = G.dungeon, s = 8;
    c.width = d.w * s; c.height = d.h * s;
    const x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < d.map.length; i++) {
      if (!d.seen[i] || d.map[i] === 0 || d.map[i] === 8) continue;
      x.fillStyle = d.map[i] === 2 ? '#ffd84a' : d.map[i] === 3 ? '#4ee0ff' : d.vis[i] ? '#778' : '#44444f';
      x.fillRect((i % d.w) * s, ((i / d.w) | 0) * s, s, s);
    }
    for (const f of d.feats) if (!f.gone && d.seen[f.y * d.w + f.x] && !(f.t === 'trap' && f.hidden)) { x.fillStyle = f.t === 'chest' ? '#c08040' : f.t === 'event' ? '#f0f' : f.t === 'trap' ? '#f44' : f.t === 'portal' ? '#b070ff' : f.t === 'fountain' ? '#6ef0ff' : '#fff'; x.fillRect(f.x * s + 2, f.y * s + 2, s - 4, s - 4); }
    for (const e of d.items) if (d.seen[e.y * d.w + e.x] && e.it.kind === 'equip' && e.it.rar >= 3) { x.fillStyle = DATA.rarities[e.it.rar].c; x.fillRect(e.x * s + 1, e.y * s + 1, s - 2, s - 2); }
    for (const mo of d.mons) if (!mo.dead && (d.vis[mo.y * d.w + mo.x] || d.detect > 0)) { x.fillStyle = mo.ally ? '#4f8' : '#f44'; x.beginPath(); x.arc(mo.x * s + s / 2, mo.y * s + s / 2, s / 2.5, 0, 7); x.fill(); }
    x.fillStyle = '#fff'; x.fillRect(d.px * s, d.py * s, s, s);
  },

  bankModal(fee) {
    const m = this.modal('', { title: fee ? 'ATM' : '銀行' });
    const render = () => {
      const p = G.player;
      m.body.innerHTML = `<p>所持金 ${U.yen(p.money)}　預金 ${U.yen(p.bank)}</p>${fee ? `<p class="dim small">手数料 ¥${fee}/回</p>` : '<p class="dim small">預金は迷宮で死んでも失わない。</p>'}<input type="number" min="0" step="1000" data-amt placeholder="金額"><div class="row2"><button data-dep>預ける</button><button data-wd>引き出す</button><button data-depall>全額預ける</button><button data-wdall>全額引き出す</button></div>`;
      const amt = () => Math.max(0, Math.floor(+m.body.querySelector('[data-amt]').value || 0));
      const go = (dep, a) => {
        if (fee) { if (p.money + (dep ? 0 : a) < fee) { this.toast('手数料が払えない'); return; } }
        if (dep) { a = Math.min(a, p.money - fee); if (a <= 0) return; p.money -= a + fee; p.bank += a; }
        else { a = Math.min(a, p.bank); if (a <= 0) return; p.bank -= a; p.money += a - fee; }
        SND.play('coin'); render(); this.renderTop();
      };
      this.bind(m.body, '[data-dep]', () => go(true, amt()));
      this.bind(m.body, '[data-wd]', () => go(false, amt()));
      this.bind(m.body, '[data-depall]', () => go(true, p.money));
      this.bind(m.body, '[data-wdall]', () => go(false, p.bank));
    };
    render();
  },
