      const list = p.inv.concat(Object.values(p.equip).filter(Boolean)).filter(it => it.kind === 'equip' && it.idf);
      let h = `<div class="dim small">所持結晶：${orbs.map(o => `${DATA.cons[o.id].n}×${o.qty}`).join('、') || 'なし（迷宮・闇市で手に入る）'}</div><div class="ilist">${list.map(it => this.itemRow(it)).join('')}</div>`;
      const it = sel && P.findItem(sel) ? P.findItem(sel).it : null;
      if (it) {
        h += `<div class="sel">${IT.tooltip(it)}<div class="acts2">${orbs.map(o => `<button data-orb="${o.id}" title="${U.esc(DATA.cons[o.id].d)}">${DATA.cons[o.id].n}</button>`).join('')}</div></div>`;
      }
      m.body.innerHTML = h;
      this.bind(m.body, '.ilist [data-uid]', b => { sel = b.dataset.uid; render(); });
      this.bind(m.body, '[data-orb]', b => {
        const id = b.dataset.orb, op = DATA.cons[id].op;
        const apply = (opt) => { const r = IT.craft(it, op, opt); if (r.ok) P.takeCons(id, 1); SND.play(r.ok && !r.fail ? 'reveal_good' : 'fail'); this.log(r.msg, r.ok && !r.fail ? 'good' : 'bad'); P.calc(); render(); };
        if (op === 'divine') {
          const mm = this.modal(it.aff.map((a, i) => a.fix ? '' : `<button class="row" data-i="${i}">${IT.modLine(a.s, a.v)}（${Math.round(a.q * 100)}%）</button>`).join(''), { title: 'どの効果を振り直す？' });
          this.bind(mm.body, '[data-i]', bb => { this.closeModal(mm); apply({ idx: +bb.dataset.i }); });
          return;
        }
        if (op === 'chaos') { this.confirm('混沌化すると二度と変更できない。本当に使う？', () => apply({})); return; }
        apply({});
      });
    };
    render();
  },
  salvageModal() {
    const m = this.modal('', { title: '分解', wide: true });
    const chosen = new Set();
    const render = () => {
      const p = G.player;
      const list = p.inv.filter(it => it.kind === 'equip' && !it.lock);
      m.body.innerHTML = `<div class="dim small">選んだ装備を素材に変える。宝石は戻ってくる。ロック中の装備は対象外。</div><div class="row2"><button data-selall>マジック以下を全選択</button><button data-go class="gold" ${chosen.size ? '' : 'disabled'}>分解する（${chosen.size}点）</button></div><div class="ilist">${list.map(it => this.itemRow(it, `<input type="checkbox" ${chosen.has(it.uid) ? 'checked' : ''}>`)).join('')}</div>`;
      this.bind(m.body, '[data-uid]', b => { const u = b.dataset.uid; if (chosen.has(u)) chosen.delete(u); else chosen.add(u); render(); });
      this.bind(m.body, '[data-selall]', () => { for (const it of list) if (it.rar <= 2) chosen.add(it.uid); render(); });
      this.bind(m.body, '[data-go]', () => {
        const got = {};
        for (const u of chosen) { const f = P.findItem(u); if (!f) continue; for (const r of IT.salvage(f.it)) { got[r.id] = (got[r.id] || 0) + r.qty; } P.removeItem(u); delete p.insured[u]; }
        for (const id in got) P.addItem(IT.cons(id, got[id]), true);
        this.log(`分解した：${Object.keys(got).map(k => `${DATA.cons[k].n}×${got[k]}`).join('、')}`, 'good');
        chosen.clear(); TW.addMinutes(20); render(); this.renderStatus();
      });
    };
    render();
  },
  gemCombineModal() {
    const m = this.modal('', { title: '宝石の合成' });
    const render = () => {
      const gems = G.player.inv.filter(x => x.kind === 'cons' && DATA.cons[x.id].k === 'gem');
      m.body.innerHTML = gems.length ? gems.map(g => { const c = DATA.cons[g.id]; const can = g.qty >= 3 && c.gr < 4; const fee = 1000 * (c.gr + 1) * (c.gr + 1); return `<div class="srow"><span class="in" style="color:${c.c}">${c.n} ×${g.qty}</span>${c.gr < 4 ? `<span class="is">→ ${DATA.cons[`gem_${c.gem}_${c.gr + 1}`].n}</span><span class="pr">${U.yen(fee)}</span><span class="btns"><button data-g="${g.id}" data-fee="${fee}" ${can ? '' : 'disabled'}>合成</button></span>` : '<span class="is">最上級</span>'}</div>`; }).join('') : '<p class="dim">宝石を持っていない</p>';
      this.bind(m.body, '[data-g]', b => { const c = DATA.cons[b.dataset.g]; if (!TW.pay(+b.dataset.fee)) return; P.takeCons(c.id, 3); P.addItem(IT.cons(`gem_${c.gem}_${c.gr + 1}`, 1), true); SND.play('reveal_good'); this.log(`${DATA.cons[`gem_${c.gem}_${c.gr + 1}`].n}を作った！`, 'good'); render(); this.renderTop(); });
    };
    render();
  },
  socketModal() {
    const m = this.modal('', { title: 'ソケット加工', wide: true });
    let sel = null;
    const render = () => {
      const p = G.player;
      const list = p.inv.concat(Object.values(p.equip).filter(Boolean)).filter(it => it.kind === 'equip' && it.sock > 0);
      let h = `<div class="ilist">${list.map(it => this.itemRow(it)).join('') || '<p class="dim">ソケット付きの装備がない</p>'}</div>`;
      const it = sel && P.findItem(sel) ? P.findItem(sel).it : null;
      if (it) {
        const gems = p.inv.filter(x => x.kind === 'cons' && DATA.cons[x.id].k === 'gem');
        h += `<div class="sel"><b>${U.esc(IT.name(it))}</b><div>${it.gems.map((g, i) => g ? `<div class="row2"><span style="color:${DATA.cons[g].c}">◆${DATA.cons[g].n}</span><button data-rm="${i}">外す(¥2,000)</button></div>` : `<div class="row2"><span class="dim">◇空き</span>${gems.map(gm => `<button data-put="${i}" data-gem="${gm.id}">${DATA.cons[gm.id].n}</button>`).join('') || '<span class="dim small">宝石なし</span>'}</div>`).join('')}</div></div>`;
      }
      m.body.innerHTML = h;
      this.bind(m.body, '.ilist [data-uid]', b => { sel = b.dataset.uid; render(); });
      this.bind(m.body, '[data-put]', b => { it.gems[+b.dataset.put] = b.dataset.gem; P.takeCons(b.dataset.gem, 1); SND.play('pick'); P.calc(); render(); });
      this.bind(m.body, '[data-rm]', b => { if (!TW.pay(2000)) return; const g = it.gems[+b.dataset.rm]; it.gems[+b.dataset.rm] = null; P.addItem(IT.cons(g, 1), true); P.calc(); render(); this.renderTop(); });
      this.hoverTips(m.body, uid => { const f = P.findItem(uid); return f && f.it; }, false);
    };
    render();
  },
  insureModal() {
    const m = this.modal('', { title: '冒険者保険', wide: true });
    const render = () => {
      const p = G.player;
      const list = p.inv.concat(Object.values(p.equip).filter(Boolean)).filter(it => it.kind === 'equip');
      const prem = it => Math.round(IT.value(it) * 0.12 + 500);
      m.body.innerHTML = `<div class="dim small">保険をかけた装備は、迷宮で失っても翌日倉庫に戻ってくる（「タルコフ式」「ふつう」の難易度で有効）。売却・分解すると保険は切れる。</div><div class="ilist">${list.map(it => this.itemRow(it, p.insured[it.uid] ? '<span class="good">加入済</span>' : `<button class="mv" data-ins="${it.uid}">${U.yen(prem(it))}</button>`)).join('')}</div>`;
      m.body.querySelectorAll('[data-ins]').forEach(b => b.onclick = e => { e.stopPropagation(); const f = P.findItem(b.dataset.ins); if (!f) return; if (!TW.pay(prem(f.it))) return; p.insured[f.it.uid] = 1; SND.play('coin'); render(); this.renderTop(); });
      this.hoverTips(m.body, uid => { const f = P.findItem(uid); return f && f.it; }, false);
    };
    render();
  },
  libraryModal() {
    const p = G.player;
    if (G.libDay !== G.day) {
      G.libDay = G.day;
      const pool = DATA.skills.filter(s => s.book && s.book <= (p.counters.maxFloor >= 15 ? 3 : 2) && !s.race);
      G.libBooks = U.shuffle(pool.slice()).slice(0, 3).map(s => s.id);
      G.libRead = false;
    }
    const m = this.modal(`<div class="dim small">閲覧室の写本は日替わり。1日1冊、4時間かけて読み込めば習得できる。</div>${G.libBooks.map(id => { const s = SK.def(id); const lv = SK.baseLv(id); return `<div class="row2"><b>${s.n}</b><span class="dim small">${DATA.schools[s.sch]}・${s.d}</span>${lv ? `<span class="small">習得済Lv${lv}</span>` : ''}<button data-b="${id}" ${G.libRead || lv >= 20 ? 'disabled' : ''}>${lv ? 'Lv+1' : '習得'}</button></div>`; }).join('')}`, { title: '閲覧室', wide: true });
    this.bind(m.body, '[data-b]', b => { if (G.libRead) return; G.libRead = true; TW.addMinutes(240); SK.learn(b.dataset.b); p.needs.fatigue = U.clamp(p.needs.fatigue + 8, 0, 100); this.closeModal(m); this.refresh(); });
  },
  gambleModal() {
    const p = G.player;
    const il = TW.shopIlvl() + 4;
    const cats = [['weapon', '武器', 1.2], ['armor', '防具', 1.0], ['jewel', '指輪・首飾り', 1.6], ['off', '盾・宝珠など', 1.0], ['backbelt', '外套・ベルト', 0.9], [null, 'なんでも', 1.0]];
    const price = c => Math.round((2500 + il * 450) * c[2]);
    const m = this.modal(`<div class="dim small">中身の分からない骨董品を買う。迷宮で拾うよりレア以上が出やすい。iLv${il}</div>${cats.map((c, i) => `<div class="srow"><span class="in">${c[1]}</span><span class="pr">${U.yen(price(c))}</span><span class="btns"><button data-c="${i}" ${p.money < price(c) ? 'disabled' : ''}>買う</button></span></div>`).join('')}`, { title: '骨董くじ' });
    this.bind(m.body, '[data-c]', b => {
      const c = cats[+b.dataset.c];
      if (!TW.pay(price(c))) return;
      const it = IT.genEquip({ ilvl: il, cat: c[0] || undefined, mult: 2.4, mf: G.d.m.magicFind || 0, idf: false });
      if (it.rar < 2) it.rar = 2;
      if (!it.aff.length && it.rar >= 2 && it.rar <= 4) IT.fillAffixes(it, 2);
      it.idf = false;
      P.addItem(it, true);
      p.needs.stress = U.clamp(p.needs.stress - (p.traits.includes('gambler') ? 6 : 2), 0, 100);
      this.closeModal(m);
      this.reveal(it);
      this.renderTop();
    });
  },
  healthModal() {
    const p = G.player, b = p.body, d = G.d;
    this.modal(`<div class="kv"><span>筋肉量</span><b>${U.round1(b.muscle)}</b><span>体脂肪</span><b>${U.round1(b.fat)}</b><span>肌</span><b>${U.round1(b.skin)}</b><span>髪</span><b>${U.round1(b.hair)}</b><span>顔立ち</span><b>${b.looks}</b><span>筋力ボーナス</span><b>${U.signed(Math.floor((b.muscle - 40) / 6))}</b><span>ストレス</span><b>${Math.round(p.needs.stress)}</b><span>今日のkcal</span><b>${Math.round(p.today.kcal)}</b><span>今日のタンパク質</span><b>${Math.round(p.today.protein)}g</b><span>必要タンパク質</span><b>${Math.round(60 + b.muscle * 0.7)}g</b></div><p class="dim small">医師「${b.fat > 35 ? '少し脂肪が多いですね。有酸素運動を。' : b.fat < 8 ? '絞りすぎです。もう少し食べてください。' : p.today.protein < 40 ? 'タンパク質が足りていません。筋肉が育ちませんよ。' : p.needs.stress > 60 ? 'ストレスが溜まっています。休息を。' : '健康そのものです。'}」</p>`, { title: '健康診断の結果' });
  },
});

</script>
<script>
/* js/main.js */
'use strict';
/* ===== セーブ ===== */
const SV = {
  KEY: 'abyssdiver_',
  ls() { try { return window.localStorage; } catch (e) { return null; } },
  serialize() {
    const keep = ['player', 'stash', 'npcs', 'party', 'day', 'minute', 'mode', 'dungeon', 'loc', 'district', 'settings', 'board', 'buyback', 'bmExtra', 'rankFill', 'libDay', 'libBooks', 'libRead', 'target'];
    const o = { v: 1, t: Date.now() };
    for (const k of keep) o[k] = G[k];
    return JSON.stringify(o, (k, v) => (k === 'vis' || k === 'dmap') ? undefined : v);
  },
  meta(slot) {
    const s = this.ls(); if (!s) return null;
    try { const m = s.getItem(this.KEY + 'meta_' + slot); return m ? JSON.parse(m) : null; } catch (e) { return null; }
  },
  save(slot) {
    const s = this.ls(); if (!s || !G || !G.player) return false;
    try {
      s.setItem(this.KEY + slot, this.serialize());
      s.setItem(this.KEY + 'meta_' + slot, JSON.stringify({ name: G.player.name, level: G.player.level, day: G.day, floor: G.player.counters.maxFloor, t: Date.now() }));
      return true;
    } catch (e) { UI.toast('セーブに失敗した（容量不足の可能性）'); return false; }
  },
  auto() { if (G && G.player && !G.pendingDeath) this.save('auto'); },
  load(slot) {
    const s = this.ls(); if (!s) { UI.toast('このブラウザでは保存領域が使えない'); return false; }
    const raw = s.getItem(this.KEY + slot);
    if (!raw) { UI.toast('セーブデータがない'); return false; }
    return this.restore(raw);
  },
  restore(raw) {
    let o;
    try { o = JSON.parse(raw); } catch (e) { UI.toast('データが壊れている'); return false; }
    if (!o || !o.player) { UI.toast('データが壊れている'); return false; }
    G = MAIN.blank();
    Object.assign(G, o);
    G.shops = {};
    G.settings = Object.assign(MAIN.defaultSettings(), o.settings || {});
    SND.on = G.settings.sound !== false;
    if (!G.stash) G.stash = [];
    if (!G.party) G.party = [];
    if (!G.npcs) NP.init();
    for (const n of DATA.npcs) if (!G.npcs[n.id]) G.npcs[n.id] = { aff: 0, trust: 20, met: false, status: 'none', talkDay: 0, talkN: 0, giftDay: 0, evDone: false, lvl: n.cb ? n.cb.lvl : 1, exp: 0, injured: 0, harem: false, power: n.power || 0, dateDay: 0, revealed: false, jealousPending: false, lastMet: 0 };
    if (!G.rankFill) G.rankFill = DATA.rankFillers.map((n, i) => ({ n, power: 200 + i * 90 }));
    const p = G.player;
    p.pouch = p.pouch || []; p.quick = p.quick || Array(10).fill(null); p.flags = p.flags || {}; p.status = p.status || {};
    // 存在しないデータの掃除（バージョン違い対策）
    const okItem = it => it && (it.kind === 'cons' ? !!DATA.cons[it.id] : it.kind === 'equip' ? !!IT.bases[it.base] : it.kind === 'gold');
    p.inv = p.inv.filter(okItem); p.pouch = p.pouch.filter(okItem); G.stash = G.stash.filter(okItem);
    for (const s of DATA.slotOrder) if (p.equip[s] && !okItem(p.equip[s])) p.equip[s] = null;
    for (const id in p.skills) if (!SK.def(id)) delete p.skills[id];
    p.hotbar = p.hotbar.map(id => id && SK.def(id) ? id : null);
    UI.closeAll();
    MAIN.hideTitle();
    P.calc();
    if (G.mode === 'dungeon' && G.dungeon) {
      G.dungeon.vis = new Uint8Array(G.dungeon.w * G.dungeon.h);
      G.dungeon.mons = G.dungeon.mons.filter(m => m && !m.dead);
      DG.updateFov();
      UI.showDungeon();
    } else { G.mode = 'town'; G.dungeon = null; UI.showTown(); }
    UI.log('セーブデータを読み込んだ。', 'good');
    return true;
  },
  exportFile() {
    try {
      const blob = new Blob([this.serialize()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `abyssdiver_${G.player.name}_day${G.day}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (e) { UI.toast('書き出しに失敗した'); }
  },
  importFile(file) {
    const r = new FileReader();
    r.onload = () => { this.restore(r.result); };
    r.readAsText(file);
  },
};

/* ===== 起動・タイトル・キャラ作成 ===== */
const MAIN = {
  defaultSettings() { return { mode: 'normal', pickCons: true, pickRar: 2, fast: false, zoom: 1, sound: true, invSort: 'kind' }; },
  blank() { return { player: null, d: null, stash: [], npcs: null, party: [], day: 1, minute: 480, mode: 'town', dungeon: null, loc: 'home', district: 'res', settings: this.defaultSettings(), shops: {}, board: null, buyback: [], bmExtra: [], target: null }; },
  boot() {
    IT.init(); CB.init();
    G = this.blank();
    UI.init();
    window.addEventListener('error', e => { try { UI.toast('エラー：' + (e.message || e)); console.error(e); } catch (x) { /* */ } });
    this.title();
  },
  hideTitle() { document.getElementById('title').style.display = 'none'; },
  title() {
    UI.closeAll(); UI.stopAuto();
    const t = document.getElementById('title');
    t.style.display = 'flex';
    const auto = SV.meta('auto');
    t.innerHTML = `<div class="tbox">
      <div class="logo">ABYSS DIVER</div><div class="sub">迷宮都市・新灯市の日々</div>
      <p class="lead">十年前、街の真ん中に穴が開いた。<br>底の見えない迷宮と、そこから溢れる富と怪物。<br>人と獣人と亜人が入り混じるこの街で、あなたは「潜る者（ダイバー）」になる。</p>
      <button data-new class="big">はじめから</button>
      ${auto ? `<button data-cont class="big">つづきから <small>${U.esc(auto.name)} Lv${auto.level} ${auto.day}日目</small></button>` : ''}
      <button data-load>セーブスロットから</button>
      <label class="filebtn">ファイルを読み込む<input type="file" accept=".json,application/json" data-imp></label>
      <p class="dim small">データはこのブラウザに保存されます。別の端末へはメニューの「書き出す」で移せます。</p></div>`;
    t.querySelector('[data-new]').onclick = () => { SND.init(); this.create(); };
    const c = t.querySelector('[data-cont]'); if (c) c.onclick = () => { SND.init(); SV.load('auto'); };
    t.querySelector('[data-load]').onclick = () => {
      const h = [1, 2, 3].map(i => { const m = SV.meta(i); return m ? `<button class="row" data-s="${i}">スロット${i}：${U.esc(m.name)} Lv${m.level} ${m.day}日目</button>` : `<div class="row dim">スロット${i}：空き</div>`; }).join('');
      const m = UI.modal(h, { title: 'ロード' });
      UI.bind(m.body, '[data-s]', b => { UI.closeModal(m); SV.load(+b.dataset.s); });
    };
    t.querySelector('[data-imp]').onchange = e => { const f = e.target.files[0]; if (f) SV.importFile(f); };
  },
  create() {
    const t = document.getElementById('title');
    const st = {
      name: '', sex: '男性', age: 20, race: 'human', bg: 'student', mode: 'normal',
      look: { height: 170, build: 'normal', hairColor: '黒', hairStyle: 'ショート', eyeColor: '黒', skin: '普通', text: '' },
      axes: {}, traits: [], bonus: { str: 0, dex: 0, vit: 0, int: 0, agi: 0, luk: 0, cha: 0 },
    };
    for (const a of DATA.axes) st.axes[a.id] = 50;
    const BONUS = 5;
    const sel = (arr, v, k) => `<select data-k="${k}">${arr.map(x => `<option ${x === v ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
    const render = () => {
      const race = DATA.races.find(r => r.id === st.race), bg = DATA.backgrounds.find(b => b.id === st.bg);
      const used = U.sum(Object.values(st.bonus));
      const base = {}; for (const a of DATA.attrs) base[a.id] = 10 + (race.stat[a.id] || 0) + (bg.stat[a.id] || 0) + st.bonus[a.id];
      t.innerHTML = `<div class="cbox">
        <h2>キャラクター作成</h2>
        <div class="csec"><h3>1. 基本</h3>
          <label>名前 <input data-k="name" maxlength="16" value="${U.esc(st.name)}" placeholder="名前"></label>
          <label>性別 ${sel(DATA.looks.sex, st.sex, 'sex')}</label>
          <label>年齢 <input data-k="age" type="number" min="18" max="99" value="${st.age}"></label>
        </div>
        <div class="csec"><h3>2. 種族</h3><div class="cards">${DATA.races.map(r => `<button class="ccard ${st.race === r.id ? 'on' : ''}" data-race="${r.id}"><b>${r.n}</b><small>${r.g}</small></button>`).join('')}</div>
          <div class="cinfo"><b>${race.n}</b>：${race.desc}<br><span class="small">${race.feats.join('／')}</span><br><span class="small dim">能力補正：${Object.keys(race.stat).map(k => `${DATA.attrs.find(a => a.id === k).n}${U.signed(race.stat[k])}`).join(' ') || 'なし'}</span></div></div>
        <div class="csec"><h3>3. 出自</h3><div class="cards">${DATA.backgrounds.map(b => `<button class="ccard ${st.bg === b.id ? 'on' : ''}" data-bg="${b.id}"><b>${b.n}</b><small>${U.yen(b.money)}</small></button>`).join('')}</div>
          <div class="cinfo"><b>${bg.n}</b>：${bg.d}<br><span class="small dim">初期武器：${DATA.wclasses[bg.weapon].n}　能力補正：${Object.keys(bg.stat).map(k => `${DATA.attrs.find(a => a.id === k).n}${U.signed(bg.stat[k])}`).join(' ')}　${Object.keys(bg.mods || {}).map(k => IT.modLine(k, bg.mods[k])).join('、')}</span></div></div>
        <div class="csec"><h3>4. 容姿</h3>
          <label>身長 <input data-k="height" type="range" min="135" max="215" value="${st.look.height}"> ${st.look.height}cm</label>
          <label>体型 <select data-k="build">${DATA.looks.build.map(b => `<option value="${b.id}" ${b.id === st.look.build ? 'selected' : ''}>${b.n}</option>`).join('')}</select></label>
          <label>髪色 ${sel(DATA.looks.hairColor, st.look.hairColor, 'hairColor')}</label>
          <label>髪型 ${sel(DATA.looks.hairStyle, st.look.hairStyle, 'hairStyle')}</label>
          <label>瞳 ${sel(DATA.looks.eyeColor, st.look.eyeColor, 'eyeColor')}</label>
          <label>肌 ${sel(DATA.looks.skin, st.look.skin, 'skin')}</label>
          <label class="full">容姿の詳細（自由に書ける・後から変更可）<textarea data-k="text" rows="2" maxlength="300" placeholder="例：右頬に小さな傷。笑うと目が細くなる。">${U.esc(st.look.text)}</textarea></label>
        </div>
        <div class="csec"><h3>5. 性格</h3><div class="axes">${DATA.axes.map(a => `<label class="axl"><span>${a.lo}</span><input type="range" min="0" max="100" data-ax="${a.id}" value="${st.axes[a.id]}"><span>${a.hi}</span></label>`).join('')}</div>
          <div class="small dim">特性を最大3つ選ぶ（${st.traits.length}/3）</div><div class="chips2">${DATA.traits.map(tr => `<button class="tchip ${st.traits.includes(tr.id) ? 'on' : ''}" data-tr="${tr.id}" title="${U.esc(tr.d)}">${tr.n}</button>`).join('')}</div>
          <div class="small">${st.traits.map(id => { const tr = DATA.traits.find(x => x.id === id); return `<b>${tr.n}</b>：${tr.d}`; }).join('<br>')}</div></div>
        <div class="csec"><h3>6. 能力値（ボーナス${BONUS - used}ポイント）</h3><div class="attrs">${DATA.attrs.map(a => `<div class="attr"><b>${a.n}</b><span class="v">${base[a.id]}</span><button data-bm="${a.id}">−</button><button data-bp="${a.id}">＋</button><small class="dim">${a.d}</small></div>`).join('')}</div></div>
        <div class="csec"><h3>7. 難易度（迷宮で死んだ時）</h3><div class="cards">
          ${[['casual', 'やさしい', '所持金の10%を失うだけ。'], ['normal', 'ふつう', '所持金の25%と、持ち物の約半分を失う。装備は残る。'], ['hardcore', 'タルコフ式', '所持金と、装備も含めた持ち物を全て失う。保険とポーチだけが頼り。致命打の踏みとどまりもなし。']].map(x => `<button class="ccard wide ${st.mode === x[0] ? 'on' : ''}" data-mode="${x[0]}"><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div></div>
        <div class="cbtns"><button data-rand>おまかせ</button><button data-back>戻る</button><button data-go class="big">この人物で始める</button></div>
      </div>`;
      t.querySelectorAll('[data-k]').forEach(el => el.oninput = el.onchange = () => {
        const k = el.dataset.k;
        if (k === 'name' || k === 'sex') st[k] = el.value;
        else if (k === 'age') st.age = U.clamp(+el.value || 18, 18, 99);
        else if (k === 'height') { st.look.height = +el.value; el.parentElement.lastChild.textContent = ` ${el.value}cm`; return; }
        else st.look[k] = el.value;
      });
      t.querySelectorAll('[data-ax]').forEach(el => el.oninput = () => { st.axes[el.dataset.ax] = +el.value; });
      t.querySelectorAll('[data-race]').forEach(b => b.onclick = () => { st.race = b.dataset.race; render(); });
      t.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => { st.bg = b.dataset.bg; render(); });
      t.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { st.mode = b.dataset.mode; render(); });
      t.querySelectorAll('[data-tr]').forEach(b => b.onclick = () => { const id = b.dataset.tr; if (st.traits.includes(id)) st.traits = st.traits.filter(x => x !== id); else if (st.traits.length < 3) st.traits.push(id); render(); });
      t.querySelectorAll('[data-bp]').forEach(b => b.onclick = () => { if (U.sum(Object.values(st.bonus)) < BONUS) { st.bonus[b.dataset.bp]++; render(); } });
      t.querySelectorAll('[data-bm]').forEach(b => b.onclick = () => { if (st.bonus[b.dataset.bm] > 0) { st.bonus[b.dataset.bm]--; render(); } });
      t.querySelector('[data-rand]').onclick = () => {
        st.race = U.pick(DATA.races).id; st.bg = U.pick(DATA.backgrounds).id;
        st.sex = U.pick(DATA.looks.sex.slice(0, 2)); st.age = U.ri(18, 35);
        st.look = { height: U.ri(150, 190), build: U.pick(DATA.looks.build).id, hairColor: U.pick(DATA.looks.hairColor), hairStyle: U.pick(DATA.looks.hairStyle), eyeColor: U.pick(DATA.looks.eyeColor), skin: U.pick(DATA.looks.skin), text: st.look.text };
        for (const a of DATA.axes) st.axes[a.id] = U.ri(15, 85);
        st.traits = U.shuffle(DATA.traits.map(x => x.id)).slice(0, 3);
        for (const k in st.bonus) st.bonus[k] = 0;
        for (let i = 0; i < BONUS; i++) st.bonus[U.pick(DATA.attrs).id]++;
        if (!st.name) st.name = U.pick(['カナタ', 'ユウ', 'ハルカ', 'レン', 'ミツキ', 'ソラ', 'アキラ', 'ヒカル', 'ナギ', 'トウマ']);
        render();
      };
      t.querySelector('[data-back]').onclick = () => this.title();
      t.querySelector('[data-go]').onclick = () => {
        if (!st.name.trim()) { UI.toast('名前を入力してください'); return; }
        this.start(st);
      };
    };
    render();
    t.scrollTop = 0;
  },
  start(st) {
    G = this.blank();
    G.settings.mode = st.mode;
    NP.init();
    P.create({ name: st.name.trim(), sex: st.sex, age: st.age, race: st.race, bg: st.bg, look: st.look, axes: st.axes, traits: st.traits, bonus: st.bonus });
    G.day = 1; G.minute = 8 * 60; G.mode = 'town'; G.loc = 'home'; G.district = 'res';
    this.hideTitle();
    document.getElementById('log').innerHTML = '';
    UI.logs = [];
    UI.showTown();
    UI.log(`${G.player.name}の新しい生活が始まった。`, 'legend');
    UI.log('まずは冒険者街の「迷宮ゲート」から1階に潜ってみよう。準備はドラッグストアやスーパーで。[?]で操作説明。', 'info');
    UI.dialog({
      title: '新灯市へようこそ', text: `<p>築40年のアパートで目を覚ました。窓の外、街の中心には巨大な「穴」が口を開けている。</p><p>迷宮で稼ぎ、鍛え、街で暮らす。誰と出会い、誰を信じるかはあなた次第だ。</p><p class="dim small">ヒント：街の上のタブで地区を移動。施設には営業時間があり、時間とともに人の居場所も変わる。持ち物はI、キャラはP、スキルはK。</p>`,
      choices: [{ label: 'はじめる', fn: () => { UI.closeDialog(); SV.auto(); } }],
    });
  },
};
window.addEventListener('DOMContentLoaded', () => MAIN.boot());

</script>
</body>
</html>
