    P.calc();
  },

  /* ===== 街での時間経過（分） ===== */
  tickMinutes(mins) {
    const p = G.player;
    P.needsTick(mins, 1);
    // 自然治癒（毎時3%）
    const heavy = DATA.parts.some(x => p.parts[x.id].bl === 2);
    for (const pt of DATA.parts) {
      const pp = p.parts[pt.id];
      if (pp.bl === 1) pp.bl = 0;
      if (pp.dead) continue;
      if (pp.bl === 2) { pp.hp = Math.max(pt.vital ? 1 : 0, pp.hp - 0.5 * mins); if (pp.hp <= 0) { pp.dead = true; pp.bl = 0; } continue; }
      if (!heavy && p.needs.hunger > 10) pp.hp = Math.min(G.d.hpMax[pt.id], pp.hp + G.d.hpMax[pt.id] * 0.0005 * mins * (pp.fr ? 0.5 : 1) * (1 + (G.d.m.hpRegen || 0) / 30));
    }
    p.status = {};
    p.st = Math.min(G.d.stMax, p.st + mins * 2);
    p.mp = Math.min(G.d.mpMax, p.mp + mins * 0.5);
    if (p.painSup > 0) p.painSup = Math.max(0, p.painSup - mins * 12);
    if (p.alc > 0) p.alc = Math.max(0, p.alc - mins * 0.02);
    P.tickBuffs(mins * 12);
    for (const k in p.cds) { p.cds[k] -= mins * 12; if (p.cds[k] <= 0) delete p.cds[k]; }
  },

  /* 睡眠 */
  sleep(hours, quality = 1) {
    const p = G.player, n = p.needs;
    const h = DATA.houses.find(x => x.id === p.house);
    const q = quality * (h ? h.sleep : 1) * (p.traits.includes('nightowl') && TW.hour() < 12 && TW.hour() > 4 ? 1.1 : 1);
    n.fatigue = U.clamp(n.fatigue - 12.5 * hours * q, 0, 100);
    n.stress = U.clamp(n.stress - 2.2 * hours * q, 0, 100);
    for (const pt of DATA.parts) {
      const pp = p.parts[pt.id];
      if (!pp.dead && pp.bl !== 2) pp.hp = Math.min(G.d.hpMax[pt.id], pp.hp + G.d.hpMax[pt.id] * 0.06 * hours * q);
    }
    if (hours >= 5) p.body.skin = U.clamp(p.body.skin + 0.6 * q * (p.traits.includes('healthnut') ? 1.5 : 1), 0, 100);
  },

  /* 一日の身体変化（日付が変わる時） */
  dailyBody() {
    const p = G.player, t = p.today, b = p.body;
    const tmul = (p.traits.includes('gymrat') ? 1.4 : 1) * ((DATA.backgrounds.find(x => x.id === p.bg) || {}).train || 1);
    const protNeed = 60 + b.muscle * 0.7;
    const pf = U.clamp(t.protein / protNeed, 0.25, 1.3);
    const ceiling = Math.max(0.2, 1 - b.muscle / 115);
    let gain = t.train * 0.22 * pf * tmul * ceiling * (p.needs.fatigue < 85 ? 1 : 0.5);
    if (t.train > 0) p.lastTrain = G.day;
    if (G.day - p.lastTrain > 2) gain -= 0.35;
    if (t.protein < 30) gain -= 0.1;
    b.muscle = U.clamp(b.muscle + gain, 5, 100);
    const burn = 1650 + b.muscle * 10 + t.act;
    const delta = (t.kcal - burn) / 1500 * 0.6;
    b.fat = U.clamp(b.fat + U.clamp(delta, -1.0, 1.0), 3, 65);
    b.skin = U.clamp(b.skin + Math.min(6, t.skin) + (50 - b.skin) * 0.02 - (p.needs.stress > 60 ? 1 : 0) - (p.needs.hygiene < 30 ? 1.2 : 0), 0, 100);
    b.hair = U.clamp(b.hair - 1.2 + Math.min(6, t.hair), 15, 100);
    p.today = { kcal: 0, protein: 0, train: 0, act: 0, skin: 0, hair: 0 };
  },

  /* ===== 経験値 ===== */
  gainExp(n) {
    const p = G.player;
    n = Math.round(n * (1 + (G.d.m.expPct || 0) / 100));
    if (n <= 0) return;
    p.exp += n;
    let up = false;
    while (p.exp >= P.expNeed(p.level)) {
      p.exp -= P.expNeed(p.level); p.level++; p.statPts += 3; p.skillPts += 1; up = true;
    }
    if (up) {
      P.calc(); P.healPct(30); p.st = G.d.stMax; p.mp = G.d.mpMax;
      UI.log(`レベルアップ！ Lv${p.level}になった！（能力P+3、スキルP+1）`, 'level'); SND.play('level'); UI.flash('#ffd84a');
      if (UI.refresh) UI.refresh();
    }
  },

  checkAcq() {
    const p = G.player;
    for (const t of DATA.acqTraits) {
      if (p.acq.includes(t.id)) continue;
      try { if (t.cond(p)) { p.acq.push(t.id); U.addMods(p.ax, t.ax || {}); UI.log(`新たな特性「${t.n}」を獲得した！ ${t.d}`, 'legend'); P.calc(); } } catch (e) { /* 無視 */ }
    }
  },
  shiftAx(ax) {
    const p = G.player;
    for (const k in ax) if (p.ax[k] != null) p.ax[k] = U.clamp(p.ax[k] + ax[k], 0, 100);
  },

  /* ===== 所持品 ===== */
  slotsUsed() { return G.player.inv.length; },
  addItem(it, force) {
    const p = G.player;
    if (!it) return false;
    if (it.kind === 'gold') { p.money += it.amt; return true; }
    if (it.kind === 'cons') {
      const ex = p.inv.find(x => x.kind === 'cons' && x.id === it.id);
      if (ex) { ex.qty += it.qty; return true; }
    }
    const cap = G.d ? G.d.bagSlots : 20;
    if (!force && p.inv.length >= cap) {
      if (G.mode === 'town') { G.stash.push(it); UI.log(`持ちきれないので「${IT.name(it)}」を倉庫に送った。`, 'dim'); return true; }
      return false;
    }
    p.inv.push(it);
    return true;
  },
  findCons(id) { return G.player.inv.find(x => x.kind === 'cons' && x.id === id) || G.player.pouch.find(x => x.kind === 'cons' && x.id === id); },
  countCons(id) { let n = 0; for (const x of G.player.inv) if (x.kind === 'cons' && x.id === id) n += x.qty; return n; },
  takeCons(id, n = 1) {
    const p = G.player;
    let left = n;
    for (const list of [p.inv, p.pouch]) {
      for (let i = list.length - 1; i >= 0 && left > 0; i--) {
        const x = list[i];
        if (x.kind !== 'cons' || x.id !== id) continue;
        const t = Math.min(left, x.qty); x.qty -= t; left -= t;
        if (x.qty <= 0) list.splice(i, 1);
      }
    }
    return left === 0;
  },
  findItem(uid) {
    const p = G.player;
    let i = p.inv.findIndex(x => x.uid === uid); if (i >= 0) return { list: p.inv, i, it: p.inv[i], where: 'inv' };
    i = p.pouch.findIndex(x => x.uid === uid); if (i >= 0) return { list: p.pouch, i, it: p.pouch[i], where: 'pouch' };
    i = G.stash.findIndex(x => x.uid === uid); if (i >= 0) return { list: G.stash, i, it: G.stash[i], where: 'stash' };
    for (const s of DATA.slotOrder) if (p.equip[s] && p.equip[s].uid === uid) return { slot: s, it: p.equip[s], where: 'equip' };
    return null;
  },
  removeItem(uid, qty) {
    const f = P.findItem(uid); if (!f) return null;
    if (f.where === 'equip') { G.player.equip[f.slot] = null; P.calc(); return f.it; }
    if (f.it.kind === 'cons' && qty && qty < f.it.qty) { f.it.qty -= qty; return IT.cons(f.it.id, qty); }
    f.list.splice(f.i, 1);
    return f.it;
  },

  slotFor(it) {
    const b = IT.bases[it.base], e = G.player.equip;
    if (b.slot === 'ring') return !e.ring1 ? 'ring1' : !e.ring2 ? 'ring2' : 'ring1';
    return b.slot;
  },
  equipItem(uid, forceSlot) {
    const p = G.player;
    const f = P.findItem(uid);
    if (!f || f.it.kind !== 'equip' || f.where === 'equip') return false;
    const it = f.it, b = IT.bases[it.base];
    const slot = forceSlot || P.slotFor(it);
    const toInv = [];
    if (p.equip[slot]) toInv.push(slot);
    if (slot === 'weapon' && b.hands === 2 && p.equip.offhand) toInv.push('offhand');
    if (slot === 'offhand' && p.equip.weapon && IT.bases[p.equip.weapon.base].hands === 2) toInv.push('weapon');
    const free = G.d.bagSlots - p.inv.length + (f.where === 'inv' ? 1 : 0);
    if (f.where !== 'stash' && toInv.length > free) { UI.toast('所持品がいっぱいで付け替えられない'); return false; }
    f.list.splice(f.i, 1);
    for (const s of toInv) {
      const old = p.equip[s]; p.equip[s] = null;
      if (f.where === 'stash') G.stash.push(old); else p.inv.push(old);
    }
    p.equip[slot] = it;
    it.nw = 0;
    if (!it.idf) UI.log('未鑑定のため、隠された効果は発揮されない。', 'dim');
    P.calc();
    return true;
  },
  unequip(slot, toStash) {
    const p = G.player;
    const it = p.equip[slot]; if (!it) return false;
    if (!toStash && p.inv.length >= G.d.bagSlots) { UI.toast('所持品がいっぱい'); return false; }
    p.equip[slot] = null;
    (toStash ? G.stash : p.inv).push(it);
    P.calc();
    return true;
  },

  /* ===== 消耗品の使用 ===== */
  useCons(uid, opt = {}) {
    const p = G.player;
    const f = P.findItem(uid);
    if (!f || f.it.kind !== 'cons') return false;
    const c = DATA.cons[f.it.id], u = c.u || {};
    if (c.k === 'ingr' || c.k === 'mat' || c.k === 'gem' || c.k === 'ammo' || c.k === 'gift' || c.k === 'orb') return false;
    if (c.k === 'book') return SK.readBook(f.it);
    if (u.throw) { if (G.mode !== 'dungeon') { UI.toast('迷宮内でしか使えない'); return false; } return DG.startThrow(f.it); }
    if (c.special === 'feather') { UI.toast('持っているだけで効果がある'); return false; }
    if (u.special) { const ok = P.special(u.special, f.it); if (!ok) return false; }
    const he = 1 + (G.d.m.healEff || 0) / 100;
    const msgs = [];
    if (u.bleed) {
      let stopped = 0;
      for (const pt of DATA.parts) { const pp = p.parts[pt.id]; if (pp.bl && pp.bl <= u.bleed) { pp.bl = 0; stopped++; if (u.bleed === 1) break; } }
      if (stopped) msgs.push('出血を止めた');
    }
    if (u.frac || u.fracAll) {
      for (const pt of DATA.parts) { const pp = p.parts[pt.id]; if (pp.fr) { pp.fr = false; msgs.push(`${pt.n}を固定した`); if (!u.fracAll) break; } }
    }
    if (u.surgery || u.surgeryAll) {
      for (const pt of DATA.parts) { const pp = p.parts[pt.id]; if (pp.dead) { pp.dead = false; pp.hp = Math.max(1, G.d.hpMax[pt.id] * 0.2); msgs.push(`${pt.n}の機能を回復した`); if (!u.surgeryAll) break; } }
    }
    if (u.heal) { const h = P.heal(u.heal); msgs.push(`HPが${h}回復`); }
    if (u.healPct) { const h = P.healPct(u.healPct); msgs.push(`HPが${h}回復`); }
    if (u.pain) { p.painSup = Math.max(p.painSup, u.pain); msgs.push('痛みが引いた'); }
    if (u.cure) for (const k of u.cure) { if (p.status[k]) { delete p.status[k]; msgs.push(`${k === 'poison' ? '毒' : k === 'burn' ? '炎上' : '状態異常'}が治った`); } if (k === 'curse') p.buffs = p.buffs.filter(b => !b.curse); }
    if (u.mp) p.mp = Math.min(G.d.mpMax, p.mp + u.mp * he);
    if (u.st) p.st = Math.min(G.d.stMax, p.st + u.st);
    const n = p.needs;
    const food2 = p.traits.includes('food2') || p.traits.includes('glutton');
    if (u.hunger) n.hunger = U.clamp(n.hunger + u.hunger, 0, 100);
    if (u.thirst) n.thirst = U.clamp(n.thirst + u.thirst, 0, 100);
    if (u.fatigue) n.fatigue = U.clamp(n.fatigue + u.fatigue, 0, 100);
    if (u.stress) { let s = u.stress; if (s < 0 && food2 && (c.k === 'food' || c.k === 'drink')) s *= 2; if (s < 0 && p.traits.includes('sweettooth') && (c.tags || []).includes('sweet')) s *= 2; n.stress = U.clamp(n.stress + s, 0, 100); }
    if (u.hygiene) n.hygiene = U.clamp(n.hygiene + u.hygiene, 0, 100);
    if (u.kcal) p.today.kcal += u.kcal;
    if (u.protein) p.today.protein += u.protein;
    if (u.skin) { p.today.skin += u.skin * (p.traits.includes('narcissist') ? 1.3 : 1); }
    if (u.hair) p.today.hair += u.hair;
    if (u.alc) { p.alc += u.alc * (p.traits.includes('drinker') ? 0.4 : 1); if (p.alc > 2.5) msgs.push('酔っ払っている'); }
    if (u.buff) P.addBuff(u.buff.n, u.buff.dur, u.buff.mods);
    if (u.risk && U.chance(u.risk / 100)) { P.applyStatus('poison', 100, 2); n.stress = U.clamp(n.stress + 8, 0, 100); msgs.push('腹を壊した！'); }
    P.removeItem(uid, 1);
    UI.log(`${c.n}を使った。${msgs.join('、')}`, 'good');
    if (c.k === 'food' || c.k === 'drink') SND.play('pick'); else SND.play('heal');
    P.calc();
    return c.t || 1;
  },

  special(k, it) {
    const p = G.player;
    switch (k) {
      case 'identify': {
        const tgt = p.inv.find(x => x.kind === 'equip' && !x.idf) || Object.values(p.equip).find(x => x && !x.idf);
        if (!tgt) { UI.toast('未鑑定品がない'); return false; }
        UI.reveal(tgt);
        return true;
      }
      case 'recall':
        if (G.mode !== 'dungeon') { UI.toast('迷宮内でしか使えない'); return false; }
        G.dungeon.recall = 10; UI.log('帰還の詠唱を始めた……(10ターン)', 'magic'); return true;
      case 'map':
        if (G.mode !== 'dungeon') { UI.toast('迷宮内でしか使えない'); return false; }
        DG.revealMap(); UI.log('階層の地形が頭に流れ込んできた。', 'magic'); return true;
      case 'detect':
        if (G.mode !== 'dungeon') { UI.toast('迷宮内でしか使えない'); return false; }
        G.dungeon.detect = 150; UI.log('魔物の気配が手に取るように分かる。', 'magic'); return true;
      case 'smoke':
        if (G.mode !== 'dungeon') { UI.toast('迷宮内でしか使えない'); return false; }
        for (const mo of G.dungeon.mons) if (!mo.ally && U.dist(mo.x, mo.y, G.dungeon.px, G.dungeon.py) <= 5) { mo.st.fear = 8; mo.awake = false; }
        UI.log('煙が立ち込めた！ 魔物たちが見失った。', 'magic'); return true;
      case 'camp':
        if (G.mode !== 'dungeon') { UI.toast('迷宮内でしか使えない'); return false; }
        return DG.camp();
    }
    return true;
  },

  /* ===== 外見の描写 ===== */
  describe() {
    const p = G.player, b = p.body, d = G.d;
    const race = DATA.races.find(r => r.id === p.race);
    const desc = (arr, v) => { let s = arr[0][1]; for (const [t, w] of arr) if (v >= t) s = w; return s; };
    const L = [];
    L.push(`${U.esc(p.name)}。${p.age}歳、${U.esc(p.sex)}。${race.n}。身長${p.look.height}cm。`);
    L.push(`${desc(DATA.muscleDesc, b.muscle)}、${desc(DATA.fatDesc, b.fat)}体つき。${b.muscle >= 75 ? '服の上からでも筋肉の線が分かる。' : b.muscle < 20 ? '腕は細く、少し頼りない。' : ''}`);
    const hairQ = b.hair >= 85 ? 'よく手入れされた艶やかな' : b.hair >= 60 ? '整った' : b.hair >= 35 ? '少し伸びかけの' : 'ぼさぼさの';
    L.push(`${hairQ}${U.esc(p.look.hairColor)}の${U.esc(p.look.hairStyle)}。${U.esc(p.look.eyeColor)}の瞳。`);
    const skinQ = b.skin >= 85 ? '透き通るような' : b.skin >= 65 ? '血色の良い' : b.skin >= 40 ? 'ごく普通の' : b.skin >= 20 ? '少し荒れた' : 'ひどく荒れた';
    L.push(`${skinQ}${U.esc(p.look.skin)}の肌。${race.look ? race.look + 'が特徴的。' : ''}`);
    const of = p.equip.outfit ? IT.name(p.equip.outfit) : null, bo = p.equip.body ? IT.name(p.equip.body) : null;
    if (G.mode === 'town' && of) L.push(`今日の服装は${U.esc(of)}。`);
    else if (bo) L.push(`${U.esc(bo)}を身に着けている。${of ? `その下に${U.esc(of)}。` : ''}`);
    const cond = [];
    if (p.needs.fatigue > 70) cond.push('目の下に濃いクマがある'); else if (p.needs.fatigue > 45) cond.push('少し疲れた顔をしている');
    if (p.needs.hygiene < 25) cond.push('汗と埃の匂いがする'); else if (p.needs.hygiene > 85) cond.push('石鹸の香りがする');
    if (p.needs.stress > 70) cond.push('表情が険しい'); else if (p.needs.stress < 20) cond.push('穏やかな表情だ');
    if (p.needs.hunger < 20) cond.push('お腹が鳴っている');
    for (const pt of DATA.parts) {
      const pp = p.parts[pt.id];
      if (pp.dead) cond.push(`${pt.n}がまったく動かない`);
      else if (pp.fr) cond.push(`${pt.n}を庇っている`);
      else if (pp.bl) cond.push(`${pt.n}から血が滲んでいる`);
    }
    if (p.alc > 1.5) cond.push('顔が赤い');
    if (cond.length) L.push(cond.join('。') + '。');
    const ch = d.charm;
    L.push(ch >= 90 ? '道行く人が思わず振り返るほどの存在感がある。' : ch >= 70 ? '人目を引く魅力がある。' : ch >= 50 ? '感じの良い印象を与える。' : ch >= 30 ? '地味だが、悪くはない。' : '……身だしなみを整えた方がいいかもしれない。');
    const ax = DATA.axes.map(a => ({ a, v: p.ax[a.id] })).sort((x, y) => Math.abs(y.v - 50) - Math.abs(x.v - 50)).slice(0, 3)
      .filter(x => Math.abs(x.v - 50) >= 12).map(x => x.v > 50 ? x.a.hi : x.a.lo);
    if (ax.length) L.push(`性格は${ax.join('で、')}。`);
    if (p.look.text) L.push(`<span class="usertext">「${U.esc(p.look.text)}」</span>`);
    return L.map(x => `<p>${x}</p>`).join('');
  },
};

</script>
<script>
/* js/combat.js */
'use strict';
/* ===== スキル管理 ===== */
const SK = {
  _m: null,
  def(id) { if (!this._m) { this._m = {}; for (const s of DATA.skills) this._m[s.id] = s; } return this._m[id]; },
  baseLv(id) { return G.player.skills[id] || 0; },
  level(id) { const b = this.baseLv(id); if (!b) return 0; return Math.min(25, b + Math.round(G.d ? (G.d.m.skillLevel || 0) : 0)); },
  learn(id, silent) {
    const p = G.player, d = this.def(id);
    if (!d) return false;
    if (!p.skills[id]) {
      p.skills[id] = 1; p.sxp[id] = 0;
      if (d.t !== 'passive') { const i = p.hotbar.indexOf(null); if (i >= 0 && !p.hotbar.includes(id)) p.hotbar[i] = id; }
      if (!silent) { UI.log(`スキル「${d.n}」を習得した！`, 'legend'); SND.play('magic'); }
    } else if (p.skills[id] < 20) {
      p.skills[id]++; if (!silent) UI.log(`「${this.name(id)}」がLv${p.skills[id]}になった！`, 'good');
      this.checkAwake(id, p.skills[id]);
    } else { if (!silent) UI.toast('これ以上は上がらない'); return false; }
    if (G.d) P.calc();
    return true;
  },
  xpNeed(lv) { return Math.round(10 * Math.pow(lv, 1.55)); },
  gainXp(id, n = 1) {
    const p = G.player;
    if (!p.skills[id] || p.skills[id] >= 20) return;
    p.sxp[id] = (p.sxp[id] || 0) + n;
    while (p.skills[id] < 20 && p.sxp[id] >= this.xpNeed(p.skills[id])) {
      p.sxp[id] -= this.xpNeed(p.skills[id]);
      p.skills[id]++;
      UI.log(`熟練により「${this.name(id)}」がLv${p.skills[id]}に上がった！`, 'good');
      this.checkAwake(id, p.skills[id]);
    }
  },
  checkAwake(id, lv) {
    const d = this.def(id);
    if ([5, 10, 15, 20].includes(lv) && (d.aw && d.aw[lv] || (d.evo && d.evo.some(e => e[0] === lv)))) {
      UI.log(`★覚醒★ 「${d.n}」は「${this.name(id, lv)}」へと進化した！`, 'legend');
      UI.banner(`覚醒：${this.name(id, lv)}`, '#ffd84a'); SND.play('reveal_good');
    }
  },
  name(id, lv) {
    const d = this.def(id); if (!d) return '?';
    if (lv == null) lv = this.level(id);
    let n = d.n;
    if (d.evo) for (const [l, nm] of d.evo) if (lv >= l) n = nm;
    return n;
  },
  eff(id) {
    const d = this.def(id);
    const lv = Math.max(1, this.level(id));
    const e = Object.assign({}, d);
    e.fx = Object.assign({}, d.fx || {});
    e.mods = d.mods ? Object.assign({}, d.mods) : null;
    if (d.aw) for (const k of [5, 10, 15, 20]) {
      if (lv < k || !d.aw[k]) continue;
      const a = d.aw[k];
      for (const key in a) {
        if (key === 't') e.t = a.t;
        else if (key === 'fx') for (const f in a.fx) e.fx[f] = (e.fx[f] || 0) + a.fx[f];
        else if (key === 'mods') { e.mods = e.mods || {}; for (const f in a.mods) e.mods[f] = (e.mods[f] || 0) + a.mods[f]; }
        else e[key] = (e[key] || 0) + a[key];
      }
    }
    e.lv = lv; e.name = this.name(id, lv);
    e.pw = (e.p || 1) * (1 + (d.g || 0.12) * (lv - 1));
    if (e.t === 'cone' && !e.rng) e.rng = 3;
    return e;
  },
  reqOk(d) {
    const p = G.player, w = G.d.wpn;
    if (d.race && !d.race.includes(p.race)) return '種族が違う';
    if (!d.req) return null;
    if (d.req === 'melee' && w.range) return '近接武器が必要';
    if (d.req === 'ranged' && !w.range) return '遠距離武器が必要';
    if (d.req === 'gun' && !w.gun) return '銃が必要';
    if (d.req === 'shield') { const o = p.equip.offhand; if (!o || !['shield', 'greatshield'].includes(IT.bases[o.base].sub)) return '盾が必要'; }
    if (Array.isArray(d.req) && !d.req.includes(w.cls)) return '対応武器が必要';
    return null;
  },
  cost(e) { return { mp: Math.round((e.mp || 0)), st: Math.round((e.st || 0)) }; },
  canUse(id) {
    const p = G.player, d = this.def(id);
    if (!d || !p.skills[id]) return { ok: false, why: '未習得' };
    if (d.t === 'passive') return { ok: false, why: 'パッシブ' };
    const r = this.reqOk(d); if (r) return { ok: false, why: r };
    if (p.cds[id] > 0) return { ok: false, why: `再使用まで${Math.ceil(p.cds[id])}T` };
    const e = this.eff(id), c = this.cost(e);
    if (p.mp < c.mp) return { ok: false, why: 'MP不足' };
    if (p.st < c.st) return { ok: false, why: 'スタミナ不足' };
    if (p.status.stun || p.status.freeze) return { ok: false, why: '行動不能' };
    return { ok: true, e, c };
  },
  needsTarget(e) { return ['strike', 'line', 'dash', 'shot', 'volley', 'bolt', 'beam', 'ball', 'cone', 'chain', 'rain', 'cloud', 'drain'].includes(e.t) || (e.t === 'debuff' && !e.self); },
  readBook(it) {
    const c = DATA.cons[it.id];
    const ok = this.learn(c.skill);
    if (ok) { P.removeItem(it.uid, 1); return 2; }
    return false;
  },
  desc(id) {
    const d = this.def(id), e = this.eff(id);
    const tn = { strike: '単体攻撃', adj: '周囲攻撃', line: '直線攻撃', dash: '突進', shot: '射撃', volley: '範囲射撃', bolt: '単体魔法', missile: '追尾弾', beam: '貫通', ball: '範囲魔法', nova: '自分中心範囲', cone: '扇状範囲', chain: '連鎖', rain: '範囲連打', cloud: '設置', drain: '吸収', buff: '強化', pbuff: '全体強化', heal: '回復', shield: '障壁', blink: '転移', summon: '召喚', debuff: '弱体', util: '補助', passive: 'パッシブ' }[e.t];
    const parts = [tn];
    if (e.b) parts.push(`威力${Math.round(e.pw * 100)}%(${e.b === 'w' ? '武器' : '魔力'})`);
    if (e.el && e.el !== 'phys') parts.push(`${DATA.elements[e.el]}属性`);
    if (e.rng) parts.push(`射程${e.rng}`); if (e.rad) parts.push(`範囲${e.rad}`); if (e.hits) parts.push(`${e.hits}回`); if (e.tg) parts.push(`${e.tg}体`);
    if (e.mp) parts.push(`MP${e.mp}`); if (e.st) parts.push(`ST${e.st}`); if (e.cd) parts.push(`CT${e.cd}`);
    if (e.dur && e.t !== 'summon') parts.push(`${e.dur}T`);
    if (e.mods) parts.push(Object.keys(e.mods).map(k => IT.modLine(k, U.round1(e.mods[k] * (e.t === 'passive' ? e.lv : 1)))).join('、'));
    const fxn = { burn: '炎上', poison: '毒', bleed: '出血', freeze: '凍結', stun: 'スタン', slow: '鈍足', fear: '恐怖', weaken: '衰弱', abreak: '防御低下', root: '拘束', sleep: '睡眠', confuse: '混乱', kb: 'ノックバック' };
    const fx = Object.keys(e.fx || {}).filter(k => fxn[k]).map(k => `${fxn[k]}${e.fx[k]}%`);
    if (fx.length) parts.push(fx.join(' '));
    return parts.join(' ・ ');
  },
};

/* ===== 戦闘 ===== */
const CB = {
  bavg: {},
  init() {
    const by = {};
    for (const id in DATA.monsters) {
      const m = DATA.monsters[id]; if (m.b === 'any') continue;
      (by[m.b] = by[m.b] || []).push(m);
    }
    for (const b in by) {
      const l = by[b];
      this.bavg[b] = { hp: U.sum(l.map(x => x.hp)) / l.length, atk: U.sum(l.map(x => (x.atk[0] + x.atk[1]) / 2)) / l.length, def: Math.max(1, U.sum(l.map(x => x.def)) / l.length), exp: U.sum(l.map(x => x.exp)) / l.length };
    }
    this.bavg.any = this.bavg.subway;
  },

  scale(f) {
    return {
      hp: 1 + 0.22 * (f - 1) + 0.012 * (f - 1) * (f - 1),
      atk: 1 + 0.13 * (f - 1) + 0.005 * (f - 1) * (f - 1),
      def: 1 + 0.1 * (f - 1),
      exp: 1 + 0.3 * (f - 1),
    };
  },

  makeMon(def, floor, o = {}) {
    const avg = this.bavg[def.b] || this.bavg.subway;
    const s = this.scale(floor);
    let hp = def.hp / avg.hp * 18 * s.hp;
    let a0 = def.atk[0] / avg.atk * 4 * s.atk, a1 = def.atk[1] / avg.atk * 4 * s.atk;
    let armor = def.def / avg.def * 3 * s.def;
    let exp = def.exp / avg.exp * 7 * s.exp;
    if (def.ab && def.ab.treasure) { hp = 18 * s.hp * 2.5; exp *= 2; }
    if (def.ab && def.ab.npc) { hp = 99999; a0 = a1 = 0; armor = 999; }
    const m = {
      uid: U.uid(), id: def.id, n: def.n, g: def.g, c: def.c, x: 0, y: 0,
      hp: 0, mhp: 0, atk: [a0, a1], def: armor, acc: (def.acc || 70) + floor * 1.2, eva: (def.eva || 0) * 0.8 + floor * 0.8,
      spd: def.spd || 100, el: def.el || 'phys', ab: U.deep(def.ab || {}), tags: (def.tags || []).slice(), res: Object.assign({}, def.res || {}),
      lvl: floor, energy: U.ri(0, 90), st: {}, awake: !!o.awake, cd: {}, exp, elite: [], d: def.d,
    };
    if (o.boss) {
      const bh = 13 + floor * 0.12;
      hp = 18 * s.hp * bh * (def.hp / 1000 * 0.3 + 0.85);
      m.atk = [4 * s.atk * 1.4, 4 * s.atk * 2.0];
      m.def = 3 * s.def * 1.6;
      m.exp = 7 * s.exp * 30;
      m.boss = true; m.awake = true;
      m.acc += 15;
    }
    if (o.elite) this.makeElite(m, o.uniq ? U.ri(3, 4) : U.ri(1, 2));
    if (o.uniq) {
      m.uniq = true; hp *= 3.5; m.atk = m.atk.map(x => x * 1.35); m.exp *= 5;
      m.n = U.pick(DATA.uniqueMonsterTitles) + m.n;
    }
    hp *= m.elite.length ? (m.ehp || 1) * 2 : 1;
    m.hp = m.mhp = Math.max(1, Math.round(hp));
    m.atk = m.atk.map(x => Math.max(1, x));
    return m;
  },
  makeElite(m, n) {
    const mods = U.shuffle(DATA.eliteMods.slice()).slice(0, n);
    m.ehp = 1;
    for (const e of mods) {
      m.elite.push(e.n);
      if (e.hp) m.ehp *= e.hp;
      if (e.spd) m.spd += e.spd;
      if (e.atk) m.atk = m.atk.map(x => x * e.atk);
      if (e.def) m.def *= e.def;
      if (e.el) m.el = e.el;
      if (e.res) for (const k in e.res) m.res[k] = (m.res[k] || 0) + e.res[k];
      if (e.ab) for (const k in e.ab) m.ab[k] = typeof e.ab[k] === 'number' ? Math.max(m.ab[k] || 0, e.ab[k]) : e.ab[k];
    }
    m.atk = m.atk.map(x => x * 1.2);
    m.exp *= 3;
  },

  /* ---- 命中 ---- */
  hitChance(mon) { return U.clamp(G.d.acc / (G.d.acc + mon.eva) * 1.15, 0.15, 0.97); },
  monHitChance(mon) {
    let acc = mon.acc;
    if (mon.st.weaken) acc *= 0.85;
    if (mon.st.confuse) acc *= 0.6;
    return U.clamp(acc / (acc + G.d.eva * 0.6) * 1.1, 0.08, 0.95);
  },

  /* ---- ダメージ適用（魔物） ---- */
  applyDmg(mon, parts, o = {}) {
    if (mon.dead) return 0;
    let total = 0;
    const m = G.d.m;
    let pct = 0;
    if (!o.ally) {
      for (const t of mon.tags) pct += m['dmgVs_' + t] || 0;
      if (mon.boss) pct += m.dmgVsBoss || 0;
      if (mon.hp >= mon.mhp && m.sp_firstStrike) pct += m.sp_firstStrike;
      if (m.sp_berserk && P.hpRatio() < 0.4) pct += m.sp_berserk;
    }
    if (o.undead2 && mon.tags.includes('undead')) pct += 100;
    const mult = 1 + pct / 100;
    for (const el in parts) {
      let v = parts[el] * mult;
      if (v <= 0) continue;
      if (el === 'phys') {
        let armor = mon.def * (mon.st.abreak ? 0.5 : 1);
        const pen = o.pen ? 1 : o.ally ? 0 : U.clamp((m.armorPen || 0) / 100, 0, 0.9);
        armor *= (1 - pen);
        v *= 60 / (60 + armor);
      }
      const r = mon.res[el] || 0;
      v *= (1 - U.clamp(r, -100, 100) / 100);
      total += Math.max(0, v);
    }
    total = Math.max(o.min0 ? 0 : 1, Math.round(total));
    mon.hp -= total;
    if (mon.st.sleep) mon.st.sleep = 0;
    mon.awake = true;
    if (mon.ab.flee) mon.fleeing = true;
    if (o.show !== false) UI.fxText(mon.x, mon.y, (o.crit ? '!' : '') + total, o.crit ? '#ffd84a' : (o.color || '#fff'));
    if (mon.hp <= 0) CB.killMon(mon, o);
    return total;
  },

  rollWeapon(mult = 1) {
    const d = G.d;
    return U.rf(d.dmg[0], d.dmg[1] + 0.999) * mult;
  },
  elemParts(mult) {
    const out = {};
    const e = G.d.elem;
    for (const k in e) if (e[k] > 0) out[k] = e[k] * U.rf(0.8, 1.2) * mult;
    if (out.ltn) out.ltn *= U.rf(0.3, 1.7);
    return out;
  },

  /* ---- プレイヤーの近接攻撃 ---- */
  attack(mon, o = {}) {
    if (!mon || mon.dead) return { miss: true };
    if (mon.ab.npc) { DG.talkMerchant(mon); return { none: true }; }
    const d = G.d, m = d.m, p = G.player;
    const hits = o.hits || 1;
    let total = 0, anyHit = false;
    for (let h = 0; h < hits && !mon.dead; h++) {
      if (!o.sure && !U.chance(this.hitChance(mon))) { UI.fxText(mon.x, mon.y, 'MISS', '#888'); if (h === 0 && hits === 1) UI.log(`${mon.n}への攻撃は外れた。`, 'dim'); SND.play('miss'); continue; }
      anyHit = true;
      const crit = U.chance((d.crit + (o.crit || 0)) / 100) || (mon.st.stun > 0 && U.chance(0.25));
      const cm = crit ? d.critDmg / 100 : 1;
      const mult = (o.mult || 1) * cm * (p.st < 5 ? 0.6 : 1) * (p.status.weaken ? 0.7 : 1);
      const parts = this.elemParts(mult);
      let phys = this.rollWeapon(mult);
      if (o.el && o.el !== 'phys') { parts[o.el] = (parts[o.el] || 0) + phys * 0.6; phys *= 0.4; }
      if (o.fx && o.fx.shield) { const oh = p.equip.offhand; if (oh) phys += IT.baseStats(oh).armor * 0.8 * mult; }
      if (o.fx && o.fx.execute && mon.hp / mon.mhp < 0.3) { phys *= 3; for (const k in parts) parts[k] *= 3; }
      parts.phys = phys;
      const dealt = this.applyDmg(mon, parts, { crit, pen: o.fx && o.fx.pen, undead2: o.fx && o.fx.undead2 });
      total += dealt;
      if (crit) SND.play('crit'); else SND.play('hit');
      p.st = Math.max(0, p.st - 1.2);
      if (m.lifeSteal) P.heal(Math.min(dealt * m.lifeSteal / 100, d.hpTotalMax * 0.06), { raw: true });
      if (!mon.dead) this.onHitEffects(mon, o, crit);
      this.onHitProcs(mon, dealt, crit);
      if (mon.ab.reflect && !mon.dead) { const r = dealt * mon.ab.reflect / 100; P.hurt(r * 0.5, U.pick(['larm', 'rarm', 'chest'])); }
    }
    if (anyHit) {
      UI.log(`${mon.n}に${total}のダメージ${mon.dead ? '、倒した！' : '！'}`, 'hit');
      // 薙ぎ払い
      const cl = (m.sp_cleave || 0);
      if (cl > 0 && !o.noCleave) {
        for (const o2 of DG.adjacentMons(G.dungeon.px, G.dungeon.py)) {
          if (o2 === mon || o2.ally || o2.dead) continue;
          this.applyDmg(o2, { phys: this.rollWeapon((o.mult || 1) * cl / 100) }, {});
        }
      }
      // 追撃
      if (!o.noExtra && !mon.dead && U.chance((m.extraAttack || 0) / 100)) {
        UI.log('追撃！', 'hit');
        this.attack(mon, Object.assign({}, o, { noExtra: true, hits: 1 }));
      }
    }
    if (DG.weaponNoise()) DG.makeNoise(G.dungeon.px, G.dungeon.py, DG.weaponNoise());
    return { total, hit: anyHit };
  },

  onHitEffects(mon, o, crit) {
    const m = G.d.m, fx = o.fx || {};
    const ch = (k) => (m[k + 'Chance'] || 0) + (fx[k] || 0);
    if (ch('bleed')) this.monStatus(mon, 'bleed', ch('bleed'), this.rollWeapon(0.25));
    if (ch('stun')) this.monStatus(mon, 'stun', ch('stun'));
    if (ch('freeze')) this.monStatus(mon, 'freeze', ch('freeze'));
    if (ch('burn')) this.monStatus(mon, 'burn', ch('burn'), this.rollWeapon(0.3));
    if (ch('poison')) this.monStatus(mon, 'poison', ch('poison'), this.rollWeapon(0.25));
    for (const k of ['slow', 'weaken', 'abreak', 'root', 'sleep', 'confuse']) if (fx[k]) this.monStatus(mon, k, fx[k]);
    if ((m.sp_fear || 0) + (fx.fear || 0)) this.monStatus(mon, 'fear', (m.sp_fear || 0) + (fx.fear || 0));
    if ((m.sp_knockback || 0) + (fx.kb || 0)) { if (U.chance(((m.sp_knockback || 0) + (fx.kb || 0)) / 100)) DG.knockback(mon, G.dungeon.px, G.dungeon.py, 2); }
    if (m.sp_execute && !mon.boss && mon.hp > 0 && mon.hp / mon.mhp < 0.15 && U.chance(m.sp_execute / 100)) { UI.log(`${mon.n}を処刑した！`, 'crit'); mon.hp = 0; this.killMon(mon, {}); }
  },
  onHitProcs(mon, dealt, crit) {
    const m = G.d.m;
    const wavg = (G.d.dmg[0] + G.d.dmg[1]) / 2;
    if (m.proc_chain && U.chance(m.proc_chain / 100)) { UI.log('連鎖雷が走る！', 'magic'); this.chain(mon, 3, wavg * 0.7, 'ltn', {}); }
    if (m.proc_nova && U.chance(m.proc_nova / 100)) { UI.log('氷結ノヴァ！', 'magic'); this.area(G.dungeon.px, G.dungeon.py, 2, wavg * 0.6, 'ice', { freeze: 40 }); }
    if (m.proc_heal && U.chance(m.proc_heal / 100)) { const h = P.healPct(4); UI.fxText(G.dungeon.px, G.dungeon.py, '+' + h, '#7f7'); }
    if (m.proc_shadow && U.chance(m.proc_shadow / 100) && !mon.dead) { UI.fxText(mon.x, mon.y, '影', '#a6f'); this.applyDmg(mon, { dark: wavg * 0.6 }, {}); }
    if (crit && m.proc_meteor && U.chance(m.proc_meteor / 100)) { UI.log('隕石が降り注ぐ！', 'magic'); this.area(mon.x, mon.y, 1, wavg * 1.5, 'fire', { burn: 40 }); }
  },

  monStatus(mon, k, chance, power = 0) {
    if (mon.dead || !U.chance(chance / 100)) return;
    if (mon.boss && ['sleep', 'fear', 'confuse', 'root'].includes(k) && U.chance(0.7)) return;
    if (mon.ab.npc) return;
    const res = { burn: 'fire', freeze: 'ice', poison: 'poison' }[k];
    if (res && (mon.res[res] || 0) >= 80) return;
    const dur = { stun: 2, freeze: 3, sleep: 10, fear: 6, confuse: 5, root: 4, slow: 6, weaken: 8, abreak: 8 }[k];
    if (['poison', 'burn', 'bleed'].includes(k)) {
      if (k === 'bleed' && mon.tags.includes('slime') || k === 'bleed' && mon.tags.includes('elemental') || k === 'bleed' && mon.tags.includes('machine')) return;
      const t = { poison: 8, burn: 5, bleed: 8 }[k];
      const ex = mon.st[k];
      mon.st[k] = { t, d: Math.max(ex ? ex.d : 0, Math.max(1, power)) };
    } else {
      const dd = mon.boss ? Math.ceil(dur / 2) : dur;
      mon.st[k] = Math.max(mon.st[k] || 0, dd);
    }
    const nm = { stun: 'スタン', freeze: '凍結', sleep: '睡眠', fear: '恐怖', confuse: '混乱', root: '拘束', slow: '鈍足', weaken: '衰弱', abreak: '防御低下', poison: '毒', burn: '炎上', bleed: '出血' }[k];
    UI.fxText(mon.x, mon.y, nm, '#ccf', 1);
  },

  /* ---- 範囲系ヘルパ ---- */
  enemiesIn(x, y, r) { return G.dungeon.mons.filter(m => !m.dead && !m.ally && !m.ab.npc && U.dist(m.x, m.y, x, y) <= r && DG.visibleOrNear(m)); },
  area(x, y, r, dmg, el, fx, o = {}) {
    UI.fxArea(x, y, r, el);
    for (const m of this.enemiesIn(x, y, r)) {
      if (o.los && !DG.los(x, y, m.x, m.y)) continue;
      this.applyDmg(m, { [el || 'phys']: dmg * U.rf(0.85, 1.15) }, { pen: fx && fx.pen, undead2: fx && fx.undead2 });
      if (fx && !m.dead) this.spellFx(m, fx, dmg);
    }
  },
  spellFx(m, fx, dmg) {
    for (const k of ['stun', 'freeze', 'slow', 'weaken', 'abreak', 'root', 'sleep', 'confuse', 'fear']) if (fx[k]) this.monStatus(m, k, fx[k]);
    for (const k of ['burn', 'poison', 'bleed']) if (fx[k]) this.monStatus(m, k, fx[k], dmg * 0.25);
    if (fx.kb && U.chance(fx.kb / 100)) DG.knockback(m, G.dungeon.px, G.dungeon.py, 2);
  },
  chain(first, n, dmg, el, fx) {
    let cur = first; const hit = new Set();
    let px = G.dungeon.px, py = G.dungeon.py;
    for (let i = 0; i < n && cur; i++) {
      hit.add(cur.uid);
      UI.fxLine(px, py, cur.x, cur.y, el);
      this.applyDmg(cur, { [el]: dmg * Math.pow(0.88, i) }, { pen: fx && fx.pen });
      if (fx && !cur.dead) this.spellFx(cur, fx, dmg);
      px = cur.x; py = cur.y;
      const cand = this.enemiesIn(px, py, 4).filter(m => !hit.has(m.uid) && DG.los(px, py, m.x, m.y));
      cur = cand.sort((a, b) => U.dist(a.x, a.y, px, py) - U.dist(b.x, b.y, px, py))[0];
    }
  },

  /* ---- 射撃 ---- */
  ammoFor(type) {
    const p = G.player;
    const sel = p.ammoSel[type];
    if (sel) { const it = P.findCons(sel); if (it) return it; }
    return p.inv.find(x => x.kind === 'cons' && DATA.cons[x.id].k === 'ammo' && DATA.cons[x.id].at === type) ||
      p.pouch.find(x => x.kind === 'cons' && DATA.cons[x.id].k === 'ammo' && DATA.cons[x.id].at === type);
  },
  magOf() { const w = G.player.equip.weapon; return w ? (G.player.mag[w.uid] || 0) : 0; },
  reload(silent) {
    const p = G.player, w = p.equip.weapon; if (!w) return 0;
    const b = IT.bases[w.base]; if (!b.gun) return 0;
    const cur = p.mag[w.uid] || 0;
    if (cur >= b.gun.mag) { if (!silent) UI.toast('装填済み'); return 0; }
    let loaded = 0;
    while (cur + loaded < b.gun.mag) {
      const a = this.ammoFor(b.ammo); if (!a) break;
      const n = Math.min(a.qty, b.gun.mag - cur - loaded);
      p.magAmmo = p.magAmmo || {}; p.magAmmo[w.uid] = a.id;
      P.takeCons(a.id, n); loaded += n;
    }
    if (!loaded) { UI.log('弾薬がない！', 'bad'); return 0; }
    p.mag[w.uid] = cur + loaded;
    UI.log(`リロードした（${p.mag[w.uid]}/${b.gun.mag}）`, 'dim');
    return Math.max(1, b.gun.reload - (G.d.m.reloadSpd || 0));
  },

  /* 射撃。戻り値：消費ターン（0なら不発） */
  shoot(target, o = {}) {
    const p = G.player, d = G.d, w = p.equip.weapon;
    const b = w ? IT.bases[w.base] : null;
    const free = o.free || (b && b.range && !b.ammo);
    if (!o.free && (!b || !b.range)) { UI.toast('遠距離武器を装備していない'); return 0; }
    const range = o.free ? 5 : b.range;
    if (U.dist(G.dungeon.px, G.dungeon.py, target.x, target.y) > range) { UI.toast('射程外'); return 0; }
    let ammo = null, cost = 1;
    if (!free) {
      if (b.gun) {
        if (this.magOf() <= 0) { const t = this.reload(true); if (!t) return 0; return t; }
        const aid = (p.magAmmo || {})[w.uid] || 'ammo_9mm';
        ammo = DATA.cons[aid];
      } else {
        const a = this.ammoFor(b.ammo);
        if (!a) { UI.log('矢がない！', 'bad'); return 0; }
        ammo = DATA.cons[a.id];
      }
    }
    const hits = o.hits || 1;
    for (let h = 0; h < hits; h++) {
      if (!free) {
        if (b.gun) { if (this.magOf() <= 0) break; if (!U.chance((d.m.ammoSave || 0) / 100)) p.mag[w.uid]--; }
        else { if (!U.chance((d.m.ammoSave || 0) / 100)) { if (!P.takeCons(ammo.id, 1)) break; } }
      }
      const path = DG.linePath(G.dungeon.px, G.dungeon.py, target.x, target.y, range);
      const pierce = o.pierce || d.m.sp_pierce || (b && b.cls === 'crossbow');
      let hitAny = false, ex = path[path.length - 1];
      for (const [x, y] of path) {
        if (!DG.passable(x, y)) break;
        const mon = DG.monAt(x, y);
        ex = [x, y];
        if (!mon || mon.ally) continue;
        if (mon.ab.npc) break;
        hitAny = true;
        this.shotHit(mon, ammo, o, b);
        if (!pierce) break;
      }
      UI.fxLine(G.dungeon.px, G.dungeon.py, ex[0], ex[1], ammo && ammo.el ? ammo.el : 'shot');
      if (b && b.gun && b.gun.spread) {
        for (const m2 of this.enemiesIn(target.x, target.y, 1)) if (m2 !== DG.monAt(target.x, target.y)) this.shotHit(m2, ammo, Object.assign({}, o, { mult: (o.mult || 1) * 0.5 }), b);
      }
      if (o.fx && o.fx.explode) this.area(ex[0], ex[1], 1, this.rollWeapon((o.mult || 1) * 0.8), 'fire', { burn: o.fx.burn || 0 });
      if (!hitAny) UI.log('弾は何にも当たらなかった。', 'dim');
    }
    if (b && b.gun) DG.makeNoise(G.dungeon.px, G.dungeon.py, b.gun.noise);
    if (b && b.slow) cost = 1.5;
    return cost;
  },
  shotHit(mon, ammo, o, b) {
    const d = G.d;
    if (!U.chance(this.hitChance(mon) * (o.snipe ? 1.1 : 1))) { UI.fxText(mon.x, mon.y, 'MISS', '#888'); return; }
    const crit = U.chance((d.crit + (o.fx && o.fx.crit || 0)) / 100);
    const cm = crit ? d.critDmg / 100 : 1;
    const mult = (o.mult || 1) * cm;
    let phys = this.rollWeapon(mult);
    const parts = this.elemParts(mult);
    if (ammo) {
      const ad = ammo.ad * d.dmgMult * (b && b.gun ? 1 : 0.6) * mult;
      if (ammo.el) parts[ammo.el] = (parts[ammo.el] || 0) + ad; else phys += ad;
    }
    parts.phys = phys;
    const dealt = this.applyDmg(mon, parts, { crit, pen: (ammo && ammo.fx && ammo.fx.pen) || (o.fx && o.fx.pen), undead2: (ammo && ammo.fx && ammo.fx.undead2) || (o.fx && o.fx.undead2) });
    UI.log(`${mon.n}に${dealt}のダメージ${crit ? '（会心）' : ''}${mon.dead ? '、倒した！' : ''}`, 'hit');
    SND.play(crit ? 'crit' : 'hit');
    if (!mon.dead) {
      const fx = Object.assign({}, o.fx || {});
      if (ammo && ammo.fx) for (const k in ammo.fx) fx[k] = (fx[k] || 0) + ammo.fx[k];
      this.onHitEffects(mon, { fx }, crit);
    }
    this.onHitProcs(mon, dealt, crit);
    if (d.m.lifeSteal) P.heal(Math.min(dealt * d.m.lifeSteal / 200, d.hpTotalMax * 0.04), { raw: true });
  },

  /* ---- スキル使用 ---- */
  spellDmg(e) {
    let v = G.d.spellPower * e.pw * U.rf(0.85, 1.15);
    if (e.el === 'ltn') v *= U.rf(0.5, 1.5);
    if (e.el && G.d.elem[e.el]) v += G.d.elem[e.el] * 0.8;
    if (e.fx && e.fx.str) v += Math.max(0, G.d.attr.str - 10) * 1.2 * e.pw;
    return v;
  },
  useSkill(id, target) {
    const chk = SK.canUse(id);
    if (!chk.ok) { UI.toast(`${SK.name(id)}：${chk.why}`); return 0; }
    const e = chk.e, p = G.player, dg = G.dungeon;
    const inDg = G.mode === 'dungeon';
    const town = ['buff', 'heal', 'util', 'shield'].includes(e.t);
    if (!inDg && !town) { UI.toast('迷宮内でしか使えない'); return 0; }
    if (!inDg && e.t === 'util' && ['recall', 'recall_now', 'detect', 'map', 'taunt', 'kiai'].includes(e.key)) { UI.toast('迷宮内でしか使えない'); return 0; }
    let tmon = target && target.uid ? target : (target && inDg ? DG.monAt(target.x, target.y) : null);
    const tx = target ? target.x : 0, ty = target ? target.y : 0;
    const el = e.el || 'phys';
    const fx = e.fx || {};
    let ok = true;
    switch (e.t) {
      case 'strike': {
        if (!tmon || tmon.ally) { UI.toast('対象がいない'); return 0; }
        const reach = (G.d.wpn.reach ? 2 : 1);
        if (U.dist(dg.px, dg.py, tmon.x, tmon.y) > reach) { UI.toast('届かない'); return 0; }
        this.attack(tmon, { mult: e.pw, hits: e.hits || 1, fx, el: e.el, crit: fx.crit, noExtra: true });
        break;
      }
      case 'adj': {
        const ms = DG.adjacentMons(dg.px, dg.py).filter(m => !m.ally && !m.ab.npc);
        if (!ms.length) { UI.toast('周囲に敵がいない'); return 0; }
        UI.fxArea(dg.px, dg.py, 1, el);
        for (const m of ms) this.attack(m, { mult: e.pw, fx, el: e.el, noExtra: true, noCleave: true });
        break;
      }
      case 'line': {
        const path = DG.linePath(dg.px, dg.py, tx, ty, e.rng || 3);
        UI.fxLine(dg.px, dg.py, path.length ? path[path.length - 1][0] : tx, path.length ? path[path.length - 1][1] : ty, el);
        for (const [x, y] of path) { if (!DG.passable(x, y)) break; const m = DG.monAt(x, y); if (m && !m.ally && !m.ab.npc) this.attack(m, { mult: e.pw, fx, el: e.el, sure: false, noExtra: true, noCleave: true }); }
        break;
      }
      case 'dash': {
        if (!tmon || tmon.ally) { UI.toast('対象がいない'); return 0; }
        if (U.dist(dg.px, dg.py, tmon.x, tmon.y) > (e.rng || 4)) { UI.toast('遠すぎる'); return 0; }
        const path = DG.linePath(dg.px, dg.py, tmon.x, tmon.y, e.rng || 4);
        for (const [x, y] of path) { if (x === tmon.x && y === tmon.y) break; if (!DG.passable(x, y) || DG.monAt(x, y)) break; dg.px = x; dg.py = y; }
        if (U.dist(dg.px, dg.py, tmon.x, tmon.y) <= 1) this.attack(tmon, { mult: e.pw, fx, el: e.el, noExtra: true });
        DG.updateFov();
        break;
      }
      case 'shot': {
        if (!tmon && !target) { UI.toast('対象がいない'); return 0; }
        const t = this.shoot(tmon || target, { mult: e.pw, hits: e.hits || 1, fx, pierce: fx.pierce, free: e.free, snipe: 1 });
        if (!t) return 0;
        if (fx.reload) this.reload(true);
        break;
      }
      case 'volley': {
        if (!G.d.wpn.range) { UI.toast('遠距離武器が必要'); return 0; }
        const n = e.hits || 1;
        const ms = this.enemiesIn(tx, ty, e.rad || 1);
        if (!ms.length) { UI.toast('範囲に敵がいない'); return 0; }
        UI.fxArea(tx, ty, e.rad || 1, 'shot');
        if (e.hits) for (let i = 0; i < n; i++) { const alive = ms.filter(m => !m.dead); if (!alive.length) break; this.shotHit(U.pick(alive), null, { mult: e.pw, fx }, null); }
        else for (const m of ms) this.shotHit(m, null, { mult: e.pw, fx }, null);
        DG.makeNoise(dg.px, dg.py, G.d.wpn.gun ? G.d.wpn.gun.noise : 0);
        break;
      }
      case 'bolt': case 'drain': {
        if (!tmon || tmon.ally) { UI.toast('対象がいない'); return 0; }
        if (U.dist(dg.px, dg.py, tmon.x, tmon.y) > (e.rng || 6) || !DG.los(dg.px, dg.py, tmon.x, tmon.y)) { UI.toast('届かない'); return 0; }
        const n = 1 + (e.hits || 0);
        for (let i = 0; i < n && !tmon.dead; i++) {
          UI.fxLine(dg.px, dg.py, tmon.x, tmon.y, el);
          const v = this.spellDmg(e);
          const dealt = this.applyDmg(tmon, { [el]: v }, { pen: fx.pen, undead2: fx.undead2 });
          if (!tmon.dead) this.spellFx(tmon, fx, v);
          if (fx.heal) P.heal(e.t === 'drain' ? dealt * fx.heal / 100 : G.d.hpTotalMax * fx.heal / 100, { raw: true });
          UI.log(`${e.name}！ ${tmon.n}に${dealt}のダメージ${tmon.dead ? '、倒した！' : ''}`, 'magic');
        }
        break;
      }
      case 'missile': {
        const ms = this.enemiesIn(dg.px, dg.py, e.rng || 7).filter(m => DG.los(dg.px, dg.py, m.x, m.y));
        if (!ms.length) { UI.toast('対象がいない'); return 0; }
        for (let i = 0; i < (e.hits || 1); i++) {
          const alive = ms.filter(m => !m.dead); if (!alive.length) break;
          const m = (tmon && !tmon.dead && i === 0) ? tmon : U.pick(alive);
          UI.fxLine(dg.px, dg.py, m.x, m.y, el);
          const v = this.spellDmg(e); this.applyDmg(m, { [el]: v }, { pen: fx.pen });
          if (!m.dead) this.spellFx(m, fx, v);
        }
        UI.log(`${e.name}！`, 'magic');
        break;
      }
      case 'beam': {
        const path = DG.linePath(dg.px, dg.py, tx, ty, e.rng || 7);
        let end = [dg.px, dg.py];
        for (const [x, y] of path) {
          if (!DG.passable(x, y)) break; end = [x, y];
          const m = DG.monAt(x, y); if (m && !m.ally && !m.ab.npc) { const v = this.spellDmg(e); this.applyDmg(m, { [el]: v }, { pen: fx.pen, undead2: fx.undead2 }); if (!m.dead) this.spellFx(m, fx, v); }
        }
        UI.fxLine(dg.px, dg.py, end[0], end[1], el, true);
        UI.log(`${e.name}！`, 'magic');
        break;
      }
      case 'ball': case 'rain': {
        if (U.dist(dg.px, dg.py, tx, ty) > (e.rng || 7)) { UI.toast('射程外'); return 0; }
        if (e.t === 'ball') {
          const n = 1 + (e.hits || 0);
          for (let i = 0; i < n; i++) this.area(tx, ty, e.rad || 1, this.spellDmg(e), el, fx);
        } else {
          UI.fxArea(tx, ty, e.rad || 2, el);
          for (let i = 0; i < (e.hits || 4); i++) {
            const ms = this.enemiesIn(tx, ty, e.rad || 2); if (!ms.length) break;
            const m = U.pick(ms); const v = this.spellDmg(e);
            this.applyDmg(m, { [el]: v }, { pen: fx.pen, undead2: fx.undead2 }); if (!m.dead) this.spellFx(m, fx, v);
          }
        }
        UI.log(`${e.name}！`, 'magic');
        break;
      }
      case 'nova': {
        this.area(dg.px, dg.py, e.rad || 1, this.spellDmg(e), el, fx);
        UI.log(`${e.name}！`, 'magic');
        break;
      }
      case 'cone': {
        const r = e.rng || 3;
        const ang = Math.atan2(ty - dg.py, tx - dg.px);
        UI.fxArea(dg.px, dg.py, r, el);
        for (const m of this.enemiesIn(dg.px, dg.py, r)) {
          const a2 = Math.atan2(m.y - dg.py, m.x - dg.px);
          let df = Math.abs(a2 - ang); if (df > Math.PI) df = 2 * Math.PI - df;
          if (df > Math.PI / 4 + 0.05 || !DG.los(dg.px, dg.py, m.x, m.y)) continue;
          const v = this.spellDmg(e); this.applyDmg(m, { [el]: v }, { pen: fx.pen }); if (!m.dead) this.spellFx(m, fx, v);
        }
        UI.log(`${e.name}！`, 'magic');
        break;
      }
      case 'chain': {
        const first = tmon && !tmon.ally ? tmon : this.enemiesIn(dg.px, dg.py, e.rng || 5).filter(m => DG.los(dg.px, dg.py, m.x, m.y)).sort((a, b) => U.dist(a.x, a.y, dg.px, dg.py) - U.dist(b.x, b.y, dg.px, dg.py))[0];
        if (!first || U.dist(dg.px, dg.py, first.x, first.y) > (e.rng || 5)) { UI.toast('対象がいない'); return 0; }
        this.chain(first, e.tg || 3, this.spellDmg(e), el, fx);
        UI.log(`${e.name}！`, 'magic');
        break;
      }
      case 'cloud': {
        if (U.dist(dg.px, dg.py, tx, ty) > (e.rng || 6)) { UI.toast('射程外'); return 0; }
        DG.addHazard(tx, ty, e.rad || 1, e.dur || 6, el, this.spellDmg(e) * 0.5, fx);
        UI.log(`${e.name}！`, 'magic');
        break;
      }
      case 'debuff': {
        const cx = e.self ? dg.px : tx, cy = e.self ? dg.py : ty;
        let ms;
        if (e.self) ms = this.enemiesIn(cx, cy, e.rad || 2);
        else { if (U.dist(dg.px, dg.py, cx, cy) > (e.rng || 6)) { UI.toast('射程外'); return 0; } ms = this.enemiesIn(cx, cy, e.rad || 0); }
        if (!ms.length) { UI.toast('対象がいない'); return 0; }
        UI.fxArea(cx, cy, e.rad || 0, 'magic');
        const bonus = (e.lv - 1) * 2;
        for (const m of ms) for (const k in fx) if (['stun', 'freeze', 'slow', 'weaken', 'abreak', 'root', 'sleep', 'confuse', 'fear'].includes(k)) this.monStatus(m, k, fx[k] + bonus);
          else if (['poison', 'burn', 'bleed'].includes(k)) this.monStatus(m, k, fx[k] + bonus, G.d.spellPower * 0.4);
        UI.log(`${e.name}！`, 'magic');
        break;
      }
      case 'buff': {
        const mods = {}; for (const k in e.mods) mods[k] = e.mods[k] * (k === 'sp_revive' ? 1 : (1 + 0.06 * (e.lv - 1)));
        if (mods.sp_revive && inDg) dg.revUsed = false;
        P.addBuff(e.name, (e.dur || 30) * (1 + 0.03 * (e.lv - 1)), mods, { src: id });
        UI.log(`${e.name}！`, 'magic');
        break;
      }
      case 'pbuff': {
        const mods = {}; for (const k in e.mods) mods[k] = e.mods[k] * (1 + 0.06 * (e.lv - 1));
        P.addBuff(e.name, e.dur || 30, mods, { src: id });
        if (inDg) for (const a of dg.mons) if (a.ally) a.buffT = e.dur || 30;
        UI.log(`${e.name}！ 仲間の士気が上がる！`, 'magic');
        break;
      }
      case 'heal': {
        const pct = e.p * (1 + 0.07 * (e.lv - 1)) * (1 + (G.d.attr.int - 10) * 0.01);
        const h = P.healPct(pct);
        if (e.cure) { for (const pt of DATA.parts) if (p.parts[pt.id].bl === 1) p.parts[pt.id].bl = 0; delete p.status.poison; }
        if (e.party && inDg) for (const a of dg.mons) if (a.ally) a.hp = Math.min(a.mhp, a.hp + a.mhp * pct / 100);
        if (inDg) UI.fxText(dg.px, dg.py, '+' + h, '#7f7');
        UI.log(`${e.name}！ HPが${h}回復した。`, 'good'); SND.play('heal');
        break;
      }
      case 'shield': {
        p.barrier = Math.round(G.d.spellPower * e.pw * 2); p.barrierT = 80;
        UI.log(`${e.name}！ ${p.barrier}の障壁を張った。`, 'magic');
        break;
      }
      case 'blink': {
        const ok2 = DG.blink(e.rng || 8);
        if (!ok2) { UI.toast('転移先がない'); return 0; }
        UI.log(`${e.name}！`, 'magic');
        break;
      }
      case 'summon': {
        const n = DG.summonAllies(e.sum, e.cnt || 1, e.dur || 60, e.lv);
        if (!n) { UI.toast('召喚する場所がない'); return 0; }
        UI.log(`${e.name}！ ${DATA.summons[e.sum].n}が現れた。`, 'magic');
        break;
      }
      case 'util': {
        ok = this.util(e);
        if (!ok) return 0;
        break;
      }
      default: return 0;
    }
    p.mp -= chk.c.mp; p.st -= chk.c.st;
    if (e.cd) p.cds[id] = Math.max(1, Math.round(e.cd * (1 - U.clamp(G.d.m.cdr || 0, 0, 60) / 100)));
    SK.gainXp(id, 1);
    SND.play('magic');
    return 1;
  },
  util(e) {
    const p = G.player, n = p.needs;
    switch (e.key) {
      case 'dispel': p.status = {}; p.buffs = p.buffs.filter(b => !(b.mods && Object.values(b.mods).some(v => v < 0))); P.calc(); UI.log('状態異常を解いた。', 'good'); return true;
      case 'recall_now': if (G.mode !== 'dungeon') return false; UI.log('空間に穴が開いた——', 'magic'); setTimeout(() => DG.exitToTown('worm'), 50); return true;
      case 'water': n.thirst = U.clamp(n.thirst + 30 + e.lv * 2, 0, 100); UI.log('冷たい水が湧き出た。', 'good'); return true;
      case 'purify': n.hygiene = U.clamp(n.hygiene + 50 + e.lv * 2, 0, 100); delete p.status.poison; UI.log('身体が清められた。', 'good'); return true;
      case 'identify': return P.special('identify');
      case 'recall': return P.special('recall');
      case 'detect': return P.special('detect');
      case 'map': return P.special('map');
      case 'beauty': p.today.skin += 1.2; P.addBuff('美容魔法', 1500, { charmPct: 8 + e.lv }); UI.log('肌がつやつやになった。', 'good'); return true;
      case 'rest': n.fatigue = U.clamp(n.fatigue - 12 - e.lv, 0, 100); n.stress = U.clamp(n.stress - 5, 0, 100); UI.log('短く深い眠りで疲れが取れた。', 'good'); return true;
      case 'kiai': p.st = Math.min(G.d.stMax, p.st + G.d.stMax * 0.4); P.addBuff('気合い', 12, { dmgPct: 20 + e.lv }); UI.log('気合いを入れた！', 'good'); return true;
      case 'taunt': for (const m of this.enemiesIn(G.dungeon.px, G.dungeon.py, 6)) { m.st.taunt = 10; m.awake = true; } P.addBuff('挑発', 10, { armorPct: 30 + e.lv * 2 }); UI.log('敵の注意を引きつけた！', 'good'); return true;
    }
    return false;
  },

  /* ---- 撃破 ---- */
  killMon(mon, o = {}) {
    if (mon.dead) return;
    // 不死
    if (mon.ab.revive && !mon.revived) { mon.revived = true; mon.hp = Math.round(mon.mhp * 0.4); UI.log(`${mon.n}が蘇った！`, 'bad'); return; }
    mon.dead = true;
    const dg = G.dungeon, p = G.player;
    if (mon.ally) {
      if (mon.npc) NP.allyDown(mon); else UI.log(`${mon.n}が消えた。`, 'dim');
      return;
    }
    if (mon.ab.npc) return;
    p.counters.kills++;
    p.needs.stress = U.clamp(p.needs.stress - 0.25 * (p.traits.includes('brave') ? 2 : 1), 0, 100);
    p.codex.mon[mon.id] = (p.codex.mon[mon.id] || 0) + 1;
    if (mon.uniq) p.counters.uniqueKills++;
    P.gainExp(mon.exp);
    for (const a of dg.mons) if (a.ally && a.npc && !a.dead) NP.allyExp(a, mon.exp * 0.5);
    const m = G.d.m;
    if (m.lifeOnKill) P.heal(m.lifeOnKill, { raw: true });
    if (m.mpOnKill) p.mp = Math.min(G.d.mpMax, p.mp + m.mpOnKill);
    if (m.proc_explode && U.chance(m.proc_explode / 100)) { UI.log('爆炎！', 'magic'); this.area(mon.x, mon.y, 1, (G.d.dmg[0] + G.d.dmg[1]) / 2 * 0.8, 'fire', { burn: 30 }); }
    if (mon.ab.explode) {
      UI.fxArea(mon.x, mon.y, 1, 'fire');
      const dmg = U.rf(mon.atk[0], mon.atk[1]) * mon.ab.explode;
      if (U.dist(mon.x, mon.y, dg.px, dg.py) <= 1) { CB.hurtPlayer(dmg, 'fire', mon, true); UI.log(`${mon.n}が爆発した！`, 'bad'); }
      for (const a of dg.mons) if (a.ally && !a.dead && U.dist(a.x, a.y, mon.x, mon.y) <= 1) DG.hurtAlly(a, dmg);
    }
    if (mon.ab.split && !mon.splitGen && mon.mhp > 8) {
      const def = DATA.monsters[mon.id];
      for (let i = 0; i < 2; i++) {
        const spot = DG.freeNear(mon.x, mon.y, 2); if (!spot) break;
        const c = this.makeMon(def, dg.floor, { awake: true });
        c.mhp = c.hp = Math.max(1, Math.round(mon.mhp * 0.35)); c.splitGen = 1; c.exp = mon.exp * 0.25; c.n = '小さな' + def.n;
        c.x = spot[0]; c.y = spot[1]; dg.mons.push(c);
      }
    }
    // ドロップ
    const drops = IT.monsterDrops(mon, dg.floor);
    DG.dropItems(mon.x, mon.y, drops);
    if (mon.boss) {
      p.counters.bossKills++;
      const next = dg.floor + 1;
      if (!p.checkpoints.includes(next)) { p.checkpoints.push(next); p.checkpoints.sort((a, b) => a - b); }
      dg.bossDead = true;
      UI.banner(`${mon.n} 撃破！`, '#ffd84a');
      UI.log(`${mon.n}を倒した！ 階段が開いた。地上のゲートから${next}階へ直接行けるようになった。`, 'legend');
      P.calc();
    }
    if (mon.ab.treasure) UI.log('財宝運びのゴブリンが宝をぶちまけた！', 'legend');
    QS.onKill(mon);
    SND.play('kill');
  },

  /* ---- プレイヤーへのダメージ ---- */
  hurtPlayer(raw, el, mon, noBlock) {
    const p = G.player, d = G.d;
    let dmg = raw;
    if (!noBlock && d.block > 0 && U.chance(d.block / 100)) {
      dmg *= 0.25; UI.fxText(G.dungeon.px, G.dungeon.py, 'BLOCK', '#9cf');
      if (d.m.thorns && mon && !mon.dead) this.applyDmg(mon, { phys: d.m.thorns * 0.5 }, { show: true });
      if (mon) UI.log(`${mon.n}の攻撃を盾で受け止めた！`, 'good');
      noBlock = 'blocked';
    }
    const part = U.wpick(DATA.parts, x => x.w).id;
    if (el === 'phys') {
      const K = 30 + (G.dungeon ? G.dungeon.floor : 1) * 6;
      dmg *= Math.max(0.15, K / (K + d.armor[part]));
    } else {
      dmg *= (1 - (d.res[el] || 0) / 100);
    }
    dmg *= 1 + d.dmgTaken / 100;
    if (d.m.sp_lastStand && P.hpRatio() < 0.25) dmg *= 1 - U.clamp(d.m.sp_lastStand, 0, 80) / 100;
    if (p.barrier > 0) { const ab = Math.min(p.barrier, dmg); p.barrier -= ab; dmg -= ab; if (ab > 0) UI.fxText(G.dungeon.px, G.dungeon.py, '障壁', '#9cf', 1); }
    dmg = Math.max(0, dmg);
    if (dmg > 0) {
      P.hurt(dmg, part, { el });
      UI.fxText(G.dungeon.px, G.dungeon.py, '-' + Math.round(dmg), '#f66');
      UI.hurtFlash();
      p.needs.stress = U.clamp(p.needs.stress + dmg / d.hpTotalMax * 7 * (1 + (d.m.stressMult || 0) / 100), 0, 100);
    }
    return { dmg: Math.round(dmg), part, blocked: noBlock === 'blocked' };
  },

  /* ---- 魔物の行動 ---- */
  monTurn(mon) {
    const dg = G.dungeon;
    if (mon.dead) return;
    const st = mon.st;
    // 継続ダメージ
    for (const k of ['burn', 'poison', 'bleed']) if (st[k]) {
      const dd = st[k].d * (k === 'poison' ? (1 - (mon.res.poison || 0) / 100) : 1);
      mon.hp -= dd; UI.fxText(mon.x, mon.y, Math.round(dd), k === 'burn' ? '#f84' : k === 'poison' ? '#8f4' : '#f44', 1);
      st[k].t--; if (st[k].t <= 0) delete st[k];
      if (mon.hp <= 0) { this.killMon(mon, {}); return; }
    }
    if (mon.ab.regen && mon.hp < mon.mhp) mon.hp = Math.min(mon.mhp, mon.hp + mon.mhp * mon.ab.regen / 100);
    for (const k of ['stun', 'freeze', 'sleep', 'fear', 'confuse', 'root', 'slow', 'weaken', 'abreak', 'taunt']) if (st[k]) { st[k]--; if (st[k] <= 0) delete st[k]; }
    if (st.stun || st.freeze || st.sleep) return;
    if (mon.dur != null) { mon.dur--; if (mon.dur <= 0) { mon.dead = true; UI.log(`${mon.n}は消えていった。`, 'dim'); return; } }
    if (mon.ally) { NP.allyAct(mon); return; }
    if (mon.ab.npc) return;
    for (const k in mon.cd) if (mon.cd[k] > 0) mon.cd[k]--;
    const px = dg.px, py = dg.py;
    const dist = U.dist(mon.x, mon.y, px, py);
    // 覚醒判定
    if (!mon.awake) {
      const vis = dg.vis[py * dg.w + px] && DG.isVisible(mon.x, mon.y);
      const stealth = U.clamp(G.d.stealth, 0, 80);
      if ((vis && dist <= 7 && U.chance(0.45 * (1 - stealth / 100))) || dist <= 2 && U.chance(0.7 - stealth / 200)) { mon.awake = true; if (DG.isVisible(mon.x, mon.y)) UI.fxText(mon.x, mon.y, '!', '#ff0', 1); }
      else return;
    }
    // 財宝ゴブリン
    if (mon.ab.flee) {
      mon.fleeT = (mon.fleeT || 0) + 1;
      if (mon.betrayer && mon.fleeT > 60) { mon.dead = true; if (mon.carry) { G.bmExtra = G.bmExtra || []; G.bmExtra.push(mon.carry); } UI.log(`${mon.n}は逃げ切った……。奪われた品は闇市に流れるかもしれない。`, 'bad'); return; }
      if (mon.fleeT > 90) { mon.dead = true; UI.log(`${mon.n}は財宝ごと姿を消した……。`, 'bad'); return; }
      DG.moveAway(mon, px, py); return;
    }
    if (st.fear) { DG.moveAway(mon, px, py); return; }
    if (st.confuse && U.chance(0.6)) { DG.moveRandom(mon); return; }
    // 標的：プレイヤーか隣接した味方
    let target = null;
    if (!st.taunt) {
      const adjA = dg.mons.find(a => a.ally && !a.dead && U.dist(a.x, a.y, mon.x, mon.y) <= 1);
      const tauntAlly = mon.tauntBy ? dg.mons.find(a => a.uid === mon.tauntBy && !a.dead) : null;
      if (tauntAlly && U.dist(tauntAlly.x, tauntAlly.y, mon.x, mon.y) <= 6) target = tauntAlly;
      else if (adjA && (dist > 1 || U.chance(adjA.role === 'tank' ? 0.7 : 0.35))) target = adjA;
    }
    const tx = target ? target.x : px, ty = target ? target.y : py;
    const tdist = U.dist(mon.x, mon.y, tx, ty);
    // 自爆
    if (mon.ab.suicide && tdist <= 1) { mon.hp = 0; this.killMon(mon, {}); return; }
    // 召喚
    if (mon.ab.summon && !mon.cd.summon && dist <= 8) {
      const cnt = dg.mons.filter(x => !x.dead && x.summoner === mon.uid).length;
      if (cnt < mon.ab.summon.max) {
        const def = DATA.monsters[mon.ab.summon.id];
        const spot = DG.freeNear(mon.x, mon.y, 2);
        if (def && spot) {
          const c = this.makeMon(def, dg.floor, { awake: true }); c.x = spot[0]; c.y = spot[1]; c.summoner = mon.uid; c.exp *= 0.3;
          dg.mons.push(c); mon.cd.summon = mon.ab.summon.cd;
          if (DG.isVisible(mon.x, mon.y)) UI.log(`${mon.n}が${def.n}を呼び出した！`, 'bad');
          return;
        }
      }
    }
    if (mon.ab.summonSelf && !mon.cd.summon && dist <= 8) {
      const cnt = dg.mons.filter(x => !x.dead && x.summoner === mon.uid).length;
      const spot = DG.freeNear(mon.x, mon.y, 2);
      if (cnt < 2 && spot) { const c = this.makeMon(DATA.monsters[mon.id], dg.floor, { awake: true }); c.x = spot[0]; c.y = spot[1]; c.summoner = mon.uid; c.exp *= 0.3; dg.mons.push(c); mon.cd.summon = 10; return; }
    }
    // 回復役
    if (mon.ab.healer && !mon.cd.heal) {
      const hurt = dg.mons.find(x => !x.dead && !x.ally && x !== mon && x.hp < x.mhp * 0.6 && U.dist(x.x, x.y, mon.x, mon.y) <= 5);
      if (hurt) { hurt.hp = Math.min(hurt.mhp, hurt.hp + hurt.mhp * 0.25); mon.cd.heal = 6; UI.fxText(hurt.x, hurt.y, '+', '#7f7', 1); return; }
    }
    // ブレス
    if (mon.ab.breath && !mon.cd.breath && tdist <= mon.ab.breath.r && DG.los(mon.x, mon.y, tx, ty)) {
      mon.cd.breath = mon.ab.breath.cd || 5;
      UI.fxLine(mon.x, mon.y, tx, ty, mon.ab.breath.el, true);
      const dmg = U.rf(mon.atk[0], mon.atk[1]) * mon.ab.breath.p * 1.2;
      if (!target) { const r = this.hurtPlayer(dmg, mon.ab.breath.el, mon, true); UI.log(`${mon.n}のブレス！ ${r.dmg}のダメージ！`, 'bad'); if (mon.ab.breath.el === 'fire') P.applyStatus('burn', 40, dmg * 0.1); }
      else DG.hurtAlly(target, dmg);
      return;
    }
    // 突進
    if (mon.ab.charge && !mon.cd.charge && tdist >= 2 && tdist <= 5 && DG.los(mon.x, mon.y, tx, ty) && U.chance(0.5)) {
      const path = DG.linePath(mon.x, mon.y, tx, ty, 5);
      for (const [x, y] of path) { if ((x === tx && y === ty) || !DG.passable(x, y) || DG.monAt(x, y)) break; mon.x = x; mon.y = y; }
      mon.cd.charge = 6;
      if (U.dist(mon.x, mon.y, tx, ty) <= 1) { UI.log(`${mon.n}が突進してきた！`, 'bad'); this.monMelee(mon, target, 1.5); }
      return;
    }
    // 遠距離
    if (mon.ab.ranged && tdist > 1 && tdist <= mon.ab.ranged.r && DG.los(mon.x, mon.y, tx, ty) && U.chance(0.65)) {
      UI.fxLine(mon.x, mon.y, tx, ty, mon.ab.ranged.el);
      if (target) { DG.hurtAlly(target, U.rf(mon.atk[0], mon.atk[1]) * mon.ab.ranged.p); return; }
      if (!U.chance(this.monHitChance(mon))) { UI.fxText(px, py, 'MISS', '#888'); return; }
      const r = this.hurtPlayer(U.rf(mon.atk[0], mon.atk[1]) * mon.ab.ranged.p * (st.weaken ? 0.7 : 1), mon.ab.ranged.el, mon);
      UI.log(`${mon.n}の遠隔攻撃！ ${DATA.parts.find(x => x.id === r.part).n}に${r.dmg}のダメージ`, 'bad');
      SND.play('hurt');
      this.monHitStatus(mon, r);
      return;
    }
    // 近接
    if (tdist <= 1) { this.monMelee(mon, target, 1); return; }
    if (mon.ab.stationary || st.root) return;
    if (target) DG.stepToward(mon, tx, ty); else DG.stepByMap(mon);
  },
  monMelee(mon, ally, mult) {
    const n = mon.ab.multi || 1;
    for (let i = 0; i < n; i++) {
      if (ally) { if (ally.dead) return; DG.hurtAlly(ally, U.rf(mon.atk[0], mon.atk[1]) * mult * (mon.st.weaken ? 0.7 : 1)); continue; }
      if (!U.chance(this.monHitChance(mon))) { UI.fxText(G.dungeon.px, G.dungeon.py, 'MISS', '#888'); UI.log(`${mon.n}の攻撃をかわした。`, 'dim'); continue; }
      const r = this.hurtPlayer(U.rf(mon.atk[0], mon.atk[1]) * mult * (mon.st.weaken ? 0.7 : 1), mon.el, mon);
      UI.log(`${mon.n}の攻撃！ ${DATA.parts.find(x => x.id === r.part).n}に${r.dmg}のダメージ${r.blocked ? '(ブロック)' : ''}`, 'bad');
      SND.play('hurt');
      if (!r.blocked) this.monHitStatus(mon, r);
      if (G.d.m.thorns && !mon.dead) this.applyDmg(mon, { phys: G.d.m.thorns }, {});
      if (mon.ab.drain && r.dmg > 0) mon.hp = Math.min(mon.mhp, mon.hp + r.dmg * mon.ab.drain / 100);
      if (mon.ab.thief && G.player.money > 0 && U.chance(0.3)) { const s = Math.min(G.player.money, Math.round(30 * G.dungeon.floor * U.rf(0.5, 1.5))); G.player.money -= s; UI.log(`${mon.n}に${U.yen(s)}盗まれた！`, 'bad'); }
      if (G.pendingDeath) return;
    }
  },
  monHitStatus(mon, r) {
    const ab = mon.ab, pw = (mon.atk[0] + mon.atk[1]) / 2 * 0.15;
    if (ab.bleed) P.applyStatus('bleed', ab.bleed);
    if (ab.frac) P.applyStatus('frac', ab.frac);
    if (ab.poison) P.applyStatus('poison', ab.poison, pw);
    if (ab.burn) P.applyStatus('burn', ab.burn, pw);
    if (ab.freeze) P.applyStatus('freeze', ab.freeze);
    if (ab.stun) P.applyStatus('stun', ab.stun);
    if (ab.slow) P.applyStatus('slow', ab.slow);
    if (ab.weaken) P.applyStatus('weaken', ab.weaken);
    if (ab.mpburn) P.applyStatus('mpburn', 50);
  },
};

</script>
<script>
/* js/dungeon.js */
'use strict';
/* ===== 迷宮：生成・視界・移動・ターン進行 ===== */
const DG = {
  W: 56, H: 36,

  biomeFor(f) { return DATA.biomes.find(b => f >= b.f[0] && f <= b.f[1]) || DATA.biomes[DATA.biomes.length - 1]; },
  idx(x, y) { return y * G.dungeon.w + x; },
  inb(x, y) { const d = G.dungeon; return x >= 0 && y >= 0 && x < d.w && y < d.h; },
  tile(x, y) { return this.inb(x, y) ? G.dungeon.map[this.idx(x, y)] : 0; },
  passable(x, y) { const t = this.tile(x, y); return t !== 0 && t !== 6 && t !== 8; },
  hazardTile(x, y) { const t = this.tile(x, y); return t === 9 || t === 11 || t === 12; },
  opaque(x, y) { if (!this.inb(x, y)) return true; const t = G.dungeon.map[this.idx(x, y)]; return t === 0 || t === 8; },
  monAt(x, y) { const ms = G.dungeon.mons; for (let i = 0; i < ms.length; i++) { const m = ms[i]; if (!m.dead && m.x === x && m.y === y) return m; } return null; },
  featAt(x, y) { return G.dungeon.feats.find(f => f.x === x && f.y === y && !f.gone); },
  itemsAt(x, y) { return G.dungeon.items.filter(i => i.x === x && i.y === y); },
  occupied(x, y) { const d = G.dungeon; return (d.px === x && d.py === y) || !!this.monAt(x, y) || !!(this.featAt(x, y) && this.featAt(x, y).t === 'chest'); },
  isVisible(x, y) { const d = G.dungeon; return this.inb(x, y) && d.vis[this.idx(x, y)] === 1; },
  visibleOrNear() { return true; },
  adjacentMons(x, y) { return G.dungeon.mons.filter(m => !m.dead && U.dist(m.x, m.y, x, y) === 1); },

  /* ===== 生成 ===== */
  enter(floor, opt = {}) {
    const p = G.player;
    if (G.mode !== 'dungeon') p.counters.dives++;
    G.mode = 'dungeon';
    const biome = this.biomeFor(floor);
    const d = { floor, turn0: Date.now() % 100000, biome: biome.id, w: this.W, h: this.H, map: [], seen: [], mons: [], items: [], feats: [], hazards: [], px: 0, py: 0, turn: 0, recall: 0, detect: 0, bossDead: false, revUsed: false };
    G.dungeon = d;
    const boss = floor % 5 === 0;
    this.generate(d, biome, boss);
    d.vis = new Uint8Array(d.w * d.h);
    p.counters.maxFloor = Math.max(p.counters.maxFloor, floor);
    NP.placeParty();
    P.calc();
    this.updateFov();
    UI.showDungeon();
    UI.log(`――${floor}階【${biome.n}】${biome.d}`, 'floor');
    if (boss) UI.log('強大な気配がする……この階には主がいる。', 'bad');
    else if (d.size !== 'normal') UI.log({ small: 'こぢんまりとした階だ。', large: '広大な階だ。迷わないように。', maze: '入り組んだ迷路の階だ……。' }[d.size], 'info');
    if (d.feats.some(f => f.t === 'portal' && f.kind === 'deep')) UI.log('どこかに深層へ続くポータルの気配がする。', 'magic');
    SND.play('stairs');
    QS.onFloor(floor);
    P.checkAcq();
    SV.auto();
  },

  generate(d, biome, boss) {
    // 階の広さ・型
    const f = d.floor;
    const size = boss ? 'normal' : U.wpick([['small', 2], ['normal', 5], ['large', 2.2], ['maze', 1.3]], x => x[1])[0];
    const dims = { small: [42, 28], normal: [56, 36], large: [70, 44], maze: [49, 33] }[size];
    d.w = dims[0]; d.h = dims[1]; d.size = size;
    let rooms = [];
    let gen = size === 'maze' ? 'maze' : biome.gen;
    if (gen === 'mix') gen = U.pick(['rooms', 'cave', 'maze']);
    for (let tries = 0; tries < 6; tries++) {
      d.map = new Array(d.w * d.h).fill(0);
      if (boss) rooms = this.genBoss(d);
      else if (gen === 'cave') { if (!this.genCave(d)) rooms = this.genRooms(d); else rooms = []; }
      else if (gen === 'maze') rooms = this.genMaze(d);
      else rooms = this.genRooms(d);
      const fl = d.map.filter(t => t === 1).length;
      if (fl > d.w * d.h * 0.12) break;
    }
    d.seen = new Array(d.w * d.h).fill(0);
    // 地形ギミック
    const gim = { sewer: [4, 8], forest: [11, 6], frost: [10, 7], lava: [9, 6], machine: [12, 5], crystal: [4, 3], chaos: [U.pick([4, 9, 10, 11, 12]), 6] }[biome.id];
    if (gim && !boss) {
      const n = Math.round(gim[1] * d.w * d.h / (56 * 36));
      for (let i = 0; i < n; i++) {
        const [cx, cy] = this.randFloor(d); const r = U.ri(1, 2);
        for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) if (this.inb(x, y) && d.map[this.idx(x, y)] === 1 && U.chance(0.65)) d.map[this.idx(x, y)] = gim[0];
      }
    }
    // 開始位置
    let start = rooms.length ? this.roomCenter(rooms[0]) : this.randFloor(d);
    d.px = start[0]; d.py = start[1];
    d.map[this.idx(d.px, d.py)] = 1;
    const dist = this.bfsFrom(d, d.px, d.py);
    // 階段：最も遠い
    let best = null, bd = -1;
    for (let i = 0; i < dist.length; i++) if (dist[i] > bd && dist[i] < 90000 && d.map[i] === 1) { bd = dist[i]; best = i; }
    d.stairs = { x: best % d.w, y: Math.floor(best / d.w) };
    d.map[best] = 2;
    // 帰還陣：中距離
    const mids = [];
    for (let i = 0; i < dist.length; i++) if (d.map[i] === 1 && dist[i] >= Math.min(12, bd * 0.4) && dist[i] <= bd * 0.75) mids.push(i);
    const ei = mids.length ? U.pick(mids) : best - 1;
    d.exit = { x: ei % d.w, y: Math.floor(ei / d.w) };
    d.map[ei] = 3;
    // 特殊部屋
    d.rooms = [];
    if (!boss && rooms.length > 3) {
      const cand = U.shuffle(rooms.slice(1).filter(r => !this.inRoom(r, d.stairs.x, d.stairs.y) && !this.inRoom(r, d.exit.x, d.exit.y) && r.w >= 4 && r.h >= 3));
      const nSp = U.chance(0.7) ? (U.chance(0.35) ? 2 : 1) : 0;
      for (let i = 0; i < nSp && i < cand.length; i++) {
        const kind = U.wpick(['vault', 'den', 'spring', 'trial', 'shrine'], k => ({ vault: 2, den: 2.5, spring: 2, trial: 1.6, shrine: 1.2 }[k]));
        d.rooms.push(Object.assign({}, cand[i], { kind, found: false }));
      }
    }
    // 魔物
    const pool = this.monPool(biome, f);
    const areaK = d.w * d.h / (56 * 36);
    if (boss) {
      const bdef = this.bossFor(f);
      const bm = CB.makeMon(bdef, f, { boss: true });
      if (f > 50) bm.n = '混沌の' + bm.n;
      const bc = rooms.length > 1 ? this.roomCenter(rooms[1]) : this.randFloorFar(d, dist, 10);
      bm.x = bc[0]; bm.y = bc[1];
      if (this.occupied(bm.x, bm.y)) { const s = this.freeNear(bm.x, bm.y, 3); if (s) { bm.x = s[0]; bm.y = s[1]; } }
      d.mons.push(bm);
      for (let i = 0; i < 3; i++) this.spawnRandom(d, pool, f, dist, 8);
    } else {
      const n = U.clamp(Math.round((10 + f * 0.35) * areaK), 7, 36);
      for (let i = 0; i < n; i++) this.spawnRandom(d, pool, f, dist, 6);
      if (U.chance(0.03 + f * 0.0005)) this.spawnSpecial(d, 'treasure_gob', f, dist);
      if (U.chance(0.12)) this.spawnSpecial(d, 'merchant_gob', f, dist);
      if (f >= 15 && !G.player.flags.gou_reform && !G.player.flags.gou_join && U.chance(0.04)) this.spawnGang(d, f, dist);
    }
    // 特殊部屋の中身
    for (const r of d.rooms) this.fillRoom(d, r, pool, f);
    // 宝箱・イベント・祠・罠
    const nc = boss ? 2 : Math.max(1, Math.round(U.ri(2, 4) * areaK));
    for (let i = 0; i < nc; i++) {
      const [x, y] = this.randFloorFar(d, dist, 4);
      const r = Math.random();
      const type = r < 0.08 ? 'rare' : r < 0.32 ? 'locked' : 'normal';
      d.feats.push({ x, y, t: 'chest', type, mimic: U.chance(0.07), trap: U.chance(0.15) ? U.pick(['needle', 'blast', 'alarm']) : null });
    }
    if (!boss) {
      const ne = U.chance(0.5) ? 2 : 1;
      for (let i = 0; i < ne; i++) { const [x, y] = this.randFloorFar(d, dist, 5); d.feats.push({ x, y, t: 'event' }); }
      if (U.chance(0.3)) { const [x, y] = this.randFloorFar(d, dist, 5); d.feats.push({ x, y, t: 'shrine' }); }
      if (!rooms.length && U.chance(0.35)) { const [x, y] = this.randFloorFar(d, dist, 8); d.feats.push(U.chance(0.5) ? { x, y, t: 'fountain', uses: 3 } : { x, y, t: 'trial' }); }
      const nt = Math.round((U.ri(2, 4) + Math.floor(f / 10) + (biome.id === 'ruins' ? 3 : 0)) * areaK);
      for (let i = 0; i < nt; i++) { const [x, y] = this.randFloorFar(d, dist, 4); d.feats.push({ x, y, t: 'trap', hidden: true, kind: U.pick(['dart', 'pit', 'alarm', 'teleport', 'gas']) }); }
      // ポータル
      const nextBoss = Math.ceil((f + 1) / 5) * 5;
      if (nextBoss - f >= 3 && U.chance(0.28)) { const [x, y] = this.randFloorFar(d, dist, 10); d.feats.push({ x, y, t: 'portal', kind: 'deep', to: Math.min(f + U.ri(2, 3), nextBoss) }); }
      if (U.chance(0.2)) { const [x, y] = this.randFloorFar(d, dist, 8); d.feats.push({ x, y, t: 'portal', kind: 'warp' }); }
      // 隠し部屋
      if (U.chance(0.45)) this.makeHidden(d, f);
    }
    // 床のアイテム
    const ni = Math.round(U.ri(3, 6) * areaK);
    for (let i = 0; i < ni; i++) { const [x, y] = this.randFloorFar(d, dist, 2); d.items.push({ x, y, it: IT.randomCons(f) }); }
    const ne2 = U.ri(1, 2);
    for (let i = 0; i < ne2; i++) { const [x, y] = this.randFloorFar(d, dist, 3); d.items.push({ x, y, it: IT.genEquip({ ilvl: Math.round(f * 1.4 + 1), mf: G.d.m.magicFind || 0 }) }); }
    if (U.chance(0.4)) { const [x, y] = this.randFloorFar(d, dist, 3); d.items.push({ x, y, it: { uid: U.uid(), kind: 'gold', amt: Math.round(U.ri(20, 60) * (1 + f * 0.6)) } }); }
  },
  inRoom(r, x, y) { return x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h; },
  roomSpots(d, r) {
    const out = [];
    for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) {
      const t = d.map[y * d.w + x];
      if (t !== 1) continue;
      if (d.mons.some(m => m.x === x && m.y === y) || d.feats.some(f => f.x === x && f.y === y)) continue;
      out.push([x, y]);
    }
    return U.shuffle(out);
  },
  fillRoom(d, r, pool, f) {
    const sp = this.roomSpots(d, r);
    const take = () => sp.pop();
    const ilvl = Math.round(f * 1.4 + 2);
    if (r.kind === 'vault') {
      for (let i = 0; i < 2; i++) { const s = take(); if (s) d.feats.push({ x: s[0], y: s[1], t: 'chest', type: 'rare', mimic: false, trap: U.chance(0.4) ? 'alarm' : null }); }
      for (let i = 0; i < U.ri(2, 3); i++) { const s = take(); if (!s) break; const m = CB.makeMon(U.pick(pool), f, { elite: true }); m.x = s[0]; m.y = s[1]; m.awake = false; d.mons.push(m); }
    } else if (r.kind === 'den') {
      for (let i = 0; i < U.ri(6, 9); i++) { const s = take(); if (!s) break; const m = CB.makeMon(U.pick(pool), f, { elite: U.chance(0.15) }); m.x = s[0]; m.y = s[1]; m.awake = false; d.mons.push(m); }
      for (let i = 0; i < 2; i++) { const s = take(); if (s) d.items.push({ x: s[0], y: s[1], it: { uid: U.uid(), kind: 'gold', amt: Math.round(U.ri(40, 100) * (1 + f * 0.6)) } }); }
      const s = take(); if (s) d.items.push({ x: s[0], y: s[1], it: IT.genEquip({ ilvl, minR: 2, mult: 1.5 }) });
    } else if (r.kind === 'spring') {
      const c = this.roomCenter(r); if (d.map[this.idx(c[0], c[1])] === 1 && !this.featAt(c[0], c[1])) d.feats.push({ x: c[0], y: c[1], t: 'fountain', uses: 3 });
      else { const s = take(); if (s) d.feats.push({ x: s[0], y: s[1], t: 'fountain', uses: 3 }); }
    } else if (r.kind === 'trial') {
      const c = this.roomCenter(r); const s = (d.map[this.idx(c[0], c[1])] === 1 && !this.featAt(c[0], c[1])) ? c : take();
      if (s) d.feats.push({ x: s[0], y: s[1], t: 'trial' });
    } else if (r.kind === 'shrine') {
      const s = take(); if (s) d.feats.push({ x: s[0], y: s[1], t: 'shrine' });
      const s2 = take(); if (s2) d.feats.push({ x: s2[0], y: s2[1], t: 'event' });
    }
  },
  genMaze(d) {
    const w = d.w, h = d.h;
    const cw = (w - 1) >> 1, ch = (h - 1) >> 1;
    const vis = new Uint8Array(cw * ch);
    const carve = (x, y) => { d.map[y * w + x] = 1; };
    const stack = [[U.ri(0, cw - 1), U.ri(0, ch - 1)]];
    vis[stack[0][1] * cw + stack[0][0]] = 1; carve(stack[0][0] * 2 + 1, stack[0][1] * 2 + 1);
    while (stack.length) {
      const [cx, cy] = stack[stack.length - 1];
      const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [cx + dx, cy + dy, dx, dy]).filter(([x, y]) => x >= 0 && y >= 0 && x < cw && y < ch && !vis[y * cw + x]);
      if (!nb.length) { stack.pop(); continue; }
      const [nx, ny, dx, dy] = U.pick(nb);
      vis[ny * cw + nx] = 1;
      carve(cx * 2 + 1 + dx, cy * 2 + 1 + dy); carve(nx * 2 + 1, ny * 2 + 1);
      stack.push([nx, ny]);
    }
    // ループを作る
    for (let i = 0; i < cw * ch * 0.1; i++) {
      const x = U.ri(1, w - 2), y = U.ri(1, h - 2);
      if (d.map[y * w + x] !== 0) continue;
      if ((d.map[y * w + x - 1] && d.map[y * w + x + 1]) || (d.map[(y - 1) * w + x] && d.map[(y + 1) * w + x])) d.map[y * w + x] = 1;
    }
    // 小部屋
    const rooms = [];
    for (let i = 0; i < 5; i++) {
      const rw = U.ri(3, 5), rh = U.ri(3, 4);
      const x = U.ri(1, w - rw - 2), y = U.ri(1, h - rh - 2);
      for (let yy = y; yy < y + rh; yy++) for (let xx = x; xx < x + rw; xx++) d.map[yy * w + xx] = 1;
      rooms.push({ x, y, w: rw, h: rh });
    }
    return rooms;
  },
  /* 隠し部屋：壁の中に部屋を作り、隠し扉(8)で本体とつなぐ */
  makeHidden(d, f) {
    const w = d.w, h = d.h;
    const reach = this.bfsFrom(d, d.px, d.py);
    const R = i => reach[i] < 90000;
    const nearReach = (x, y) => { for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue; if (R(ny * w + nx) && d.map[ny * w + nx] !== 0) return true; } return false; };
    for (let t = 0; t < 120; t++) {
      const rw = U.ri(3, 5), rh = U.ri(3, 4);
      const x0 = U.ri(2, w - rw - 3), y0 = U.ri(2, h - rh - 3);
      let ok = true;
      for (let y = y0 - 1; y <= y0 + rh && ok; y++) for (let x = x0 - 1; x <= x0 + rw && ok; x++) { if (d.map[y * w + x] !== 0 || nearReach(x, y)) ok = false; }
      if (!ok) continue;
      // 壁の中を掘り進んで本体へ
      const prev = new Int32Array(w * h).fill(-1);
      const q = [];
      for (let y = y0; y < y0 + rh; y++) for (let x = x0; x < x0 + rw; x++) { const i = y * w + x; prev[i] = i; q.push(i); }
      let door = -1, head = 0;
      while (head < q.length && door < 0) {
        const c = q[head++], cx = c % w, cy = (c / w) | 0;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = cx + dx, ny = cy + dy;
          if (nx < 1 || ny < 1 || nx >= w - 1 || ny >= h - 1) continue;
          const ni = ny * w + nx;
          if (prev[ni] >= 0) continue;
          if (d.map[ni] !== 0) continue;
          // 隣が本体の床なら、ここが隠し扉
          const touch = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([ex, ey]) => { const j = (ny + ey) * w + nx + ex; return R(j) && d.map[j] !== 0; });
          prev[ni] = c;
          if (touch) { door = ni; break; }
          if (nearReach(nx, ny)) continue;
          q.push(ni);
        }
      }
      if (door < 0) continue;
      for (let y = y0; y < y0 + rh; y++) for (let x = x0; x < x0 + rw; x++) d.map[y * w + x] = 1;
      let c = prev[door];
      while (prev[c] !== c) { d.map[c] = 1; c = prev[c]; }
      d.map[door] = 8;
      const room = { x: x0, y: y0, w: rw, h: rh, kind: 'hidden', found: false };
      d.rooms.push(room);
      const sp = this.roomSpots(d, room);
      const s1 = sp.pop(); if (s1) d.feats.push({ x: s1[0], y: s1[1], t: 'chest', type: 'rare', mimic: false, trap: null });
      for (let i = 0; i < U.ri(1, 2); i++) { const s = sp.pop(); if (s) d.items.push({ x: s[0], y: s[1], it: U.chance(0.5) ? IT.genEquip({ ilvl: Math.round(f * 1.4 + 3), minR: 2, mult: 2 }) : IT.randomCons(f) }); }
      if (U.chance(0.3)) { const s = sp.pop(); if (s) d.feats.push({ x: s[0], y: s[1], t: 'portal', kind: 'warp' }); }
      d.secret = { x: door % w, y: Math.floor(door / w) };
      return true;
    }
    return false;
  },
  monPool(biome, f) {
    let list;
    if (biome.id === 'chaos') list = Object.values(DATA.monsters).filter(m => m.b !== 'any');
    else list = Object.values(DATA.monsters).filter(m => m.b === biome.id);
    // 隣接階層の魔物も少し混ぜる
    const prev = DATA.biomes[DATA.biomes.indexOf(biome) - 1];
    if (prev && biome.id !== 'chaos' && f <= biome.f[0] + 1) list = list.concat(Object.values(DATA.monsters).filter(m => m.b === prev.id).slice(0, 3));
    return list;
  },
  bossFor(f) {
    if (f <= 50) return DATA.bosses.find(b => b.f === f) || DATA.bosses[0];
    const b = U.pick(DATA.bosses);
    return b;
  },
  spawnRandom(d, pool, f, dist, minD) {
    const def = U.pick(pool);
    const pos = this.randFloorFar(d, dist, minD);
    if (!pos || this.occupied(pos[0], pos[1])) return;
    const r = Math.random();
    const elite = r < 0.07 + f * 0.002, uniq = r < 0.012 + f * 0.0004;
    const m = CB.makeMon(def, f, { elite: elite || uniq, uniq });
    m.x = pos[0]; m.y = pos[1];
    m.awake = U.chance(0.35);
    d.mons.push(m);
    // 群れ
    if (!elite && U.chance(0.18)) {
      for (let k = 0; k < U.ri(1, 2); k++) {
        const s = this.freeNear(m.x, m.y, 2, d); if (!s) break;
        const c = CB.makeMon(def, f, {}); c.x = s[0]; c.y = s[1]; c.awake = m.awake; d.mons.push(c);
      }
    }
  },
  spawnSpecial(d, id, f, dist) {
    const pos = this.randFloorFar(d, dist, 8); if (!pos || this.occupied(pos[0], pos[1])) return;
    const m = CB.makeMon(DATA.monsters[id], f, {}); m.x = pos[0]; m.y = pos[1];
    if (id === 'merchant_gob') { m.awake = false; m.stock = null; }
    d.mons.push(m);
  },
  spawnGang(d, f, dist) {
    const pos = this.randFloorFar(d, dist, 10); if (!pos) return;
    const gdef = { id: 'gang', b: 'subway', n: '鉄喰の構成員', g: '@', c: '#c06060', hp: 30, atk: [5, 9], def: 4, acc: 85, eva: 20, spd: 105, exp: 15, tags: ['humanoid'], ab: { bleed: 20, thief: 1 } };
    for (let i = 0; i < 3; i++) {
      const s = i === 0 ? pos : this.freeNear(pos[0], pos[1], 2, d); if (!s) break;
      const m = CB.makeMon(gdef, f, { elite: i === 0 }); m.x = s[0]; m.y = s[1]; m.awake = true; d.mons.push(m);
    }
    UI.log('……殺気を感じる。冒険者狩りが近くにいるかもしれない。', 'bad');
  },

  genRooms(d) {
    const rooms = [];
    const target = U.ri(9, 14);
    for (let t = 0; t < 400 && rooms.length < target; t++) {
      const rw = U.ri(4, 10), rh = U.ri(3, 7);
      const x = U.ri(1, d.w - rw - 2), y = U.ri(1, d.h - rh - 2);
      if (rooms.some(r => x < r.x + r.w + 2 && x + rw + 2 > r.x && y < r.y + r.h + 2 && y + rh + 2 > r.y)) continue;
      rooms.push({ x, y, w: rw, h: rh });
      for (let yy = y; yy < y + rh; yy++) for (let xx = x; xx < x + rw; xx++) d.map[yy * d.w + xx] = 1;
    }
    rooms.sort((a, b) => (a.x + a.y * 0.5) - (b.x + b.y * 0.5));
    for (let i = 1; i < rooms.length; i++) this.corridor(d, this.roomCenter(rooms[i - 1]), this.roomCenter(rooms[i]));
    for (let i = 0; i < 3 && rooms.length > 3; i++) this.corridor(d, this.roomCenter(U.pick(rooms)), this.roomCenter(U.pick(rooms)));
    return rooms;
  },
  corridor(d, a, b) {
    let [x, y] = a;
    const horizFirst = U.chance(0.5);
    const carve = (xx, yy) => { if (xx > 0 && yy > 0 && xx < d.w - 1 && yy < d.h - 1) d.map[yy * d.w + xx] = d.map[yy * d.w + xx] || 1; };
