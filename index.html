<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABYSS DIVER ―迷宮都市の日々―</title>
<meta name="description" content="現代ダンジョン×生活シム×ハクスラのブラウザローグライク">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;700&family=M+PLUS+1p:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c12; --panel:#15151f; --panel2:#1c1c29; --line:#2c2c3e; --text:#e6e6ef; --dim:#8a8aa0;
  --gold:#ffd84a; --good:#5fe08a; --bad:#ff5a5a; --warn:#ffb347; --magic:#c9a0ff; --pink:#ff6fb0; --accent:#4ee0ff;
  --r0:#8d8d8d; --r1:#e6e6e6; --r2:#5aa7ff; --r3:#ffd84a; --r4:#c06bff; --r5:#ff8c1a; --r6:#3fe07a; --r7:#ff3b4e; --r8:#ff6be6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"M PLUS 1p","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:#4a4a66;background:#25253a}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;color:var(--text);background:#0f0f18;border:1px solid var(--line);border-radius:5px;padding:4px 6px}
textarea{width:100%;resize:vertical}
.dim{color:var(--dim)} .small{font-size:12px} .gold{color:var(--gold)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .magic{color:var(--magic)} .pink{color:var(--pink)}
b.gS,.gS{color:#ff8c1a} b.gA,.gA{color:#ffd84a} b.gB,.gB{color:#5aa7ff} b.gC,.gC{color:#8fd} b.gD,.gD{color:#888}
.perfect{color:#fff;text-shadow:0 0 6px #fff,0 0 12px #ff6be6}

#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
#topbar{display:flex;gap:12px;align-items:center;padding:6px 10px;background:#101018;border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto}
#topbar #tb-loc{color:var(--accent)} #topbar #tb-money{color:var(--gold)}
#tb-btns{margin-left:auto;display:flex;gap:6px}
#tb-btns button{padding:3px 9px}
#main{display:grid;grid-template-columns:1fr 280px;min-height:0}
#view{position:relative;min-height:0;overflow:hidden}
#side{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:8px}
#bottom{border-top:1px solid var(--line);background:#101018;display:grid;grid-template-columns:auto 1fr;gap:8px;padding:6px;height:150px}
#bars{display:flex;flex-direction:column;gap:4px;overflow:auto}
#hotbar,#quick{display:flex;gap:4px;flex-wrap:wrap}
.hk{position:relative;width:86px;height:46px;padding:2px 4px;text-align:left;font-size:11px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.hk i{position:absolute;top:1px;right:4px;font-style:normal;color:var(--dim);font-size:10px}
.hk b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hk small{color:#89a;font-size:10px}
.hk em{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px;color:#fff}
.hk.off{opacity:.55} .hk.empty{color:var(--dim)}
.qk{font-size:11px;padding:3px 6px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.qk em{font-style:normal;color:var(--gold);margin-left:4px}
.qk.off{opacity:.45} .qk.empty{color:#555}
#log{overflow-y:auto;font-size:13px;line-height:1.45;padding:2px 6px;background:#0a0a10;border-radius:6px;border:1px solid var(--line)}
#log .l{border-bottom:1px solid rgba(255,255,255,.03)}
.l.bad{color:#ff8a8a} .l.good{color:#8cf0a8} .l.dim{color:var(--dim)} .l.hit{color:#e8e8e8} .l.magic{color:var(--magic)} .l.gold{color:var(--gold)} .l.level{color:#ffe680;font-weight:bold}
.l.legend{color:#ffb050;font-weight:bold} .l.info{color:var(--accent)} .l.floor{color:#fff;font-weight:bold;background:rgba(78,224,255,.08)} .l.amb{color:#7f7f9a;font-style:italic} .l.npc{color:#9fe8d0} .l.crit{color:#ffd84a}
.l.r0{color:var(--r0)} .l.r1{color:var(--r1)} .l.r2{color:var(--r2)} .l.r3{color:var(--r3)} .l.r4{color:var(--r4);font-weight:bold} .l.r5{color:var(--r5);font-weight:bold;text-shadow:0 0 6px rgba(255,140,26,.5)} .l.r6{color:var(--r6);font-weight:bold} .l.r7{color:var(--r7);font-weight:bold;text-shadow:0 0 8px rgba(255,59,78,.7)} .l.r8{font-weight:bold;background:linear-gradient(90deg,#ff6be6,#6be6ff,#ffe66b,#ff6be6);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:300%;animation:rainbow 2s linear infinite}
@keyframes rainbow{to{background-position:300% 0}}

/* ステータス */
.who{font-size:15px}
.who span{margin-left:4px}
.pts{color:var(--gold);font-size:12px;margin:2px 0}
.bar{height:6px;background:#26263a;border-radius:3px;overflow:hidden;flex:1;min-width:30px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:#7a7aa8;border-radius:3px}
.bar.hp i{background:linear-gradient(90deg,#d0453a,#2e9e5b)} .bar.st i{background:#d8b03a} .bar.mp i{background:#4a7cf0} .bar.xp i{background:#a77cff}
.bar.bad i{background:var(--bad)} .bar.warn i{background:var(--warn)} .bar.baff i{background:var(--pink)} .bar.btrust i{background:var(--accent)}
.bar.baff,.bar.btrust{width:60px}
.xp .bar{width:100%;height:4px}
.body{display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:". h ." "la c ra" ". s ." "ll . rl";gap:3px;margin:6px 0}
.bp{border-radius:5px;padding:2px 3px;font-size:10px;text-align:center;line-height:1.2;color:#fff;text-shadow:0 1px 2px #000;position:relative;min-height:34px}
.bp span{display:block;opacity:.85} .bp b{font-size:13px} .bp i{position:absolute;top:0;right:1px;font-style:normal;font-size:10px}
.bp.h{grid-area:h} .bp.la{grid-area:la} .bp.c{grid-area:c} .bp.ra{grid-area:ra} .bp.s{grid-area:s} .bp.ll{grid-area:ll} .bp.rl{grid-area:rl}
.hpt{font-size:12px;display:flex;gap:6px;align-items:center}
.sm{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;font-size:11px;align-items:center;margin:4px 0}
.needs{margin:4px 0}
.need{display:grid;grid-template-columns:62px 1fr 30px;gap:6px;align-items:center;font-size:12px}
.need em{font-style:normal;text-align:right;color:var(--dim)}
.mini-st{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:11px;color:#bbc;margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{font-size:11px;padding:1px 6px;border-radius:10px;background:#26263a;border:1px solid #3a3a55}
.chip.bad{border-color:#803030;color:#ff9a9a} .chip.good{border-color:#307050;color:#9ff0c0} .chip.warn{border-color:#806030;color:#ffd090}
.party{margin-top:6px;border-top:1px solid var(--line);padding-top:4px}
.pm{display:grid;grid-template-columns:1fr 70px;font-size:12px;gap:4px;align-items:center}

/* 迷宮 */
#dungeon-view{position:absolute;inset:0;display:none}
#cv{display:block;width:100%;height:100%;cursor:crosshair}
#cv.aiming{cursor:cell}
#mini{position:absolute;top:6px;right:6px;width:168px;opacity:.85;border:1px solid var(--line);border-radius:4px;image-rendering:pixelated;cursor:pointer}
#dpad{position:absolute;left:8px;bottom:8px;display:none;grid-template-columns:repeat(3,52px);gap:4px;opacity:.85}
#dpad button{height:52px;font-size:20px;padding:0;background:rgba(30,30,48,.85)}
#dacts{position:absolute;right:6px;bottom:6px;display:flex;flex-direction:column;gap:4px}
#dacts button{font-size:12px;padding:4px 8px;background:rgba(28,28,41,.88)}

/* 街 */
#town-view{position:absolute;inset:0;overflow-y:auto;padding:10px 12px;display:none;background:radial-gradient(ellipse at top,#1a1a2a,#0c0c12 70%)}
.districts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.dist{padding:6px 14px}
.dist.on{background:#2a3350;border-color:var(--accent);color:#fff}
.dist-desc{color:#bbc;margin-bottom:10px}
.facs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.fac{display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto auto;text-align:left;padding:8px;gap:0 6px;min-height:64px}
.fac .fic{grid-row:1/4;font-size:22px;align-self:center}
.fac .fn{font-weight:bold} .fac .fh{font-size:11px;color:var(--dim)}
.fac.closed{opacity:.5}
.fnpc i{display:inline-block;font-style:normal;background:#2d4a44;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-size:11px;margin-right:2px;color:#bff}
.facview .fhead{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:6px;flex-wrap:wrap}
.fdesc{color:#bbc;margin-bottom:10px}
.npcs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.npc{display:flex;flex-direction:column;text-align:left;gap:1px;padding:6px 10px;border-color:#2f5d55;background:#162724}
.npc span{font-size:11px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.act{display:flex;flex-direction:column;text-align:left;gap:2px;padding:8px 10px}
.act span{font-size:11px;color:var(--dim)} .act em{font-size:11px;color:var(--bad);font-style:normal}
.closedmsg{color:var(--warn);padding:10px}

/* モーダル */
#modals .mwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.modal{background:var(--panel);border:1px solid #3a3a55;border-radius:10px;max-width:560px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.modal.wide{max-width:920px}
.modal.tall{height:88vh}
.mtitle{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.mtitle b{flex:1}
.mclose{padding:2px 10px}
.mbody{padding:10px 12px;overflow-y:auto;flex:1}
.dlg .modal{max-width:620px}
.dlg-text p{line-height:1.7;margin:6px 0}
.dlg-ch{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ch{text-align:left;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.ch span{font-size:12px;color:var(--gold)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.tabs button.on{background:#2a3350;border-color:var(--accent)}
.tabs .money{margin-left:auto;color:var(--gold)}
.sec{font-weight:bold;color:#cfd;margin:10px 0 4px;border-bottom:1px solid var(--line);padding-bottom:2px}
.row,.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
button.row{width:100%;text-align:left;justify-content:space-between;border-radius:6px;margin-bottom:4px}
.row2 button{margin-left:auto}
.kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 10px;font-size:13px}
.kv span{color:var(--dim)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.attr{display:grid;grid-template-columns:44px 34px 1fr auto;gap:4px;align-items:center;padding:3px 0}
.attr .v{font-size:16px;font-weight:bold;text-align:right}
.attr small{grid-column:1/-1}
.attr button{padding:0 8px}
table.parts,table.rank{width:100%;border-collapse:collapse;font-size:12px}
table.parts td,table.parts th,table.rank td{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
table.rank tr.me{background:#2a3350;color:var(--gold)}
.desc p{margin:4px 0;line-height:1.7}
.usertext{color:#ffc}
.axis{display:grid;grid-template-columns:70px 1fr 70px 90px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.axis span:last-of-type{text-align:right}
.ax-bar{height:8px;background:linear-gradient(90deg,#3a4a7a,#26263a,#7a4a3a);border-radius:4px;position:relative}
.ax-bar i{position:absolute;top:-3px;width:4px;height:14px;background:#fff;border-radius:2px;transform:translateX(-2px)}
.axis em{font-style:normal;color:var(--dim)}
.trait{margin:4px 0}

/* アイテム一覧 */
.invgrid{display:grid;grid-template-columns:330px 1fr;gap:12px;height:100%}
.eqcol,.invcol{min-height:0;overflow-y:auto}
.eqslot{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:4px}
.eqslot .sl{font-size:11px;color:var(--dim)}
.irow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer;border:1px solid transparent;background:#12121b;margin-bottom:2px;font-size:13px}
.irow:hover{border-color:#3a3a58;background:#1c1c2c}
.irow.empty{color:#444;cursor:default}
.irow .ig{width:16px;text-align:center;font-family:"M PLUS 1 Code",monospace;font-weight:bold}
.irow .in{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .is{font-size:11px;color:var(--dim);white-space:nowrap}
.irow i{font-style:normal;font-size:10px;padding:0 3px;border-radius:3px;background:#2a2a3e}
.irow i.new{background:#2a6a3a;color:#bfb} .irow i.unid{background:#5a3a8a;color:#e0d0ff}
.irow.r5,.irow.r7{background:linear-gradient(90deg,rgba(255,140,26,.12),#12121b 60%)}
.irow.r6{background:linear-gradient(90deg,rgba(63,224,122,.12),#12121b 60%)}
.irow.r8{background:linear-gradient(90deg,rgba(255,107,230,.15),rgba(107,230,255,.08),#12121b 70%)}
.irow .pr{color:var(--gold);font-size:12px}
.irow .mv{padding:1px 8px}
.ilist{max-height:none}
.acts2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.shoplist{display:flex;flex-direction:column;gap:2px}
.srow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:4px 6px;background:#12121b;border-radius:5px;font-size:13px}
.srow .in{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .is{font-size:11px;color:var(--dim)} .srow .pr{color:var(--gold);font-size:12px;text-align:right}
.srow .btns{display:flex;gap:3px} .srow .btns button{padding:2px 7px;font-size:12px}
.sel{margin-top:10px;padding:8px;border:1px solid #3a3a58;border-radius:8px;background:#141420}
.npchead{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.nface{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;flex-shrink:0;border:2px solid rgba(255,255,255,.2)}
.npcres{background:#141420;border-left:3px solid var(--pink);padding:8px;margin:6px 0;line-height:1.6;min-height:40px}
.topics{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.topics .pink{border-color:var(--pink);color:var(--pink)} .topics .gold{border-color:var(--gold);color:var(--gold)}
.npcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.ncard{background:#141420;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:13px}
.skl .skrow{background:#141420;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:5px}
.skrow .lv{color:var(--gold);margin-left:4px} .skrow .hbn{color:var(--accent);margin-left:4px}
.skbtn{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.skbtn button{padding:1px 7px;font-size:11px}
.skbtn button.on{background:#2a3350;border-color:var(--accent)}
.skbtn button.gold{border-color:var(--gold);color:var(--gold)}
.sxp{display:flex;align-items:center;gap:6px}
.sxp .bar{max-width:140px}
.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:5px}
.cx{background:#121219;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:13px;color:#555}
.cx.found{color:var(--text)}
.cx span{margin-left:6px}
.bigmap{width:100%;image-rendering:pixelated;border:1px solid var(--line)}
.opt{display:block;margin:5px 0}
.filebtn{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--panel2);cursor:pointer}
.filebtn input{display:none}
.help p{margin:3px 0;line-height:1.6}

/* ツールチップ */
#tip{position:fixed;z-index:80;display:none;pointer-events:none;max-width:360px}
.tt{background:#0e0e16;border:1px solid #44445e;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.5;margin-bottom:4px;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.tt.r3{border-color:#806a20} .tt.r4{border-color:#6a3a90} .tt.r5{border-color:#a0581a;box-shadow:0 0 18px rgba(255,140,26,.25)} .tt.r6{border-color:#2a8a50} .tt.r7{border-color:#a02a38;box-shadow:0 0 22px rgba(255,59,78,.35)} .tt.r8{border-color:#ff6be6;box-shadow:0 0 24px rgba(255,107,230,.35)}
.tt-name{font-weight:bold;font-size:15px}
.tt-sub{color:var(--dim);font-size:12px}
.tt-badges{margin:3px 0;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;padding:0 6px;border-radius:9px;border:1px solid #555;font-weight:bold}
.badge.gS{border-color:#ff8c1a} .badge.gA{border-color:#ffd84a} .badge.gB{border-color:#5aa7ff}
.badge.perfect{border-color:#fff;color:#fff;animation:pglow 1.2s ease-in-out infinite alternate}
@keyframes pglow{from{box-shadow:0 0 2px #fff}to{box-shadow:0 0 10px #ff6be6,0 0 4px #fff}}
.badge.curse{border-color:var(--bad);color:var(--bad)} .badge.chaos{border-color:#f0f;color:#f9f} .badge.ins{border-color:var(--accent);color:var(--accent)}
.tt-base{margin:4px 0;color:#dde}
.tt-imp{color:#9ab;border-top:1px dashed #333;padding-top:3px;margin-top:3px}
.tt-aff{border-top:1px solid #2a2a40;margin-top:4px;padding-top:3px}
.aff{display:grid;grid-template-columns:1fr auto 54px 34px;gap:5px;align-items:center;color:#9fd0ff}
.tt.r5 .aff,.tt.r7 .aff{color:#ffc890} .tt.r6 .aff{color:#9ff0c0}
.aff.bad{color:#ff8a8a!important}
.aff .tier{font-size:10px;padding:0 4px;border-radius:3px;background:#262636;color:#aab}
.tier.t0{background:linear-gradient(90deg,#ff6be6,#6be6ff);color:#000;font-weight:bold} .tier.t1{background:#6a4a10;color:#ffd84a} .tier.t2{background:#4a3a10;color:#e8c860} .tier.t3{background:#30304a;color:#c0c0ff} .tier.tu{background:#4a2a10;color:#ffb060}
.qbar{height:5px;background:#26263a;border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#666,#5aa7ff 50%,#ffd84a 85%,#fff)}
.qn{font-size:11px;color:var(--dim);text-align:right}
.tt-ex{color:var(--gold);border-top:1px solid #4a3a10;margin-top:4px;padding-top:3px}
.tt-anom{color:#ff9af0;border-top:1px solid #5a2a50;margin-top:4px;padding-top:3px}
.tt-curse{color:#ff9090;border-top:1px solid #5a2020;margin-top:4px;padding-top:3px}
.tt-chaos{color:#f9f;margin-top:4px}
.tt-curse .bad,.tt-anom .bad,.tt-chaos .bad{color:#ff6060}
.tt-unid{color:#c9a0ff;text-align:center;padding:6px;border:1px dashed #5a3a8a;border-radius:6px;margin-top:4px}
.tt-sock{margin-top:4px;font-size:12px} .gem.empty{color:#666}
.tt-set{margin-top:4px;font-size:12px;color:#6a8} .tt-set .on{color:#7f9}
.tt-flavor{color:#a99;font-style:italic;margin-top:5px;font-size:12px}
.tt-val{color:var(--gold);font-size:12px;margin-top:4px;text-align:right}
.tt-cmp{border-top:1px solid #333;margin-top:5px;padding-top:4px;display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px}
.tt-cmp .dim{width:100%}
.tt-cmp .up{color:var(--good)} .tt-cmp .down{color:var(--bad)}

.card .front{display:flex;align-items:center;justify-content:center;font-size:90px;font-weight:bold;color:var(--c);background:radial-gradient(circle,rgba(255,255,255,.08),#111 70%);border:2px solid var(--c);box-shadow:0 0 30px var(--c),inset 0 0 40px var(--c);animation:shake .5s infinite}

@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg) scale(1.02)}75%{transform:rotate(2deg) scale(1.02)}}
.card .back{transform:rotateY(180deg);position:relative}
.card.flip{transform:rotateY(180deg)}
.card.flip .front{position:absolute}

@keyframes banner{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:70;opacity:0}

<script>
/* js/util.js */
'use strict';
/* ===== 汎用ユーティリティ ===== */
const DATA = {};
let G = null; // ゲーム状態

const U = {
  ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },
  rf(a, b) { return a + Math.random() * (b - a); },
  chance(p) { return Math.random() < p; },
  pick(a) { return a[Math.floor(Math.random() * a.length)]; },
  wpick(arr, wf) {
    let tot = 0;
    for (const x of arr) tot += Math.max(0, wf(x));
    if (tot <= 0) return arr[0];
    let r = Math.random() * tot;
    for (const x of arr) { r -= Math.max(0, wf(x)); if (r <= 0) return x; }
    return arr[arr.length - 1];
  },
  shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
  esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  uid() { U._u = (U._u || 0) + 1; return Date.now().toString(36) + U._u.toString(36) + Math.random().toString(36).slice(2, 6); },
  fmt(n) { return Math.round(n).toLocaleString('ja-JP'); },
  yen(n) { return '¥' + U.fmt(n); },
  deep(o) { return JSON.parse(JSON.stringify(o)); },
  sum(a) { let s = 0; for (const x of a) s += x; return s; },
  dist(a, b, c, d) { return Math.max(Math.abs(a - c), Math.abs(b - d)); },
  addMods(t, m, mult = 1) {
    if (!m) return t;
    for (const k in m) {
      const v = m[k];
      if (typeof v !== 'number') continue;
      t[k] = (t[k] || 0) + v * mult;
    }
    return t;
  },
  round1(v) { return Math.round(v * 10) / 10; },
  signed(v, d = 0) { const r = d ? Math.round(v * Math.pow(10, d)) / Math.pow(10, d) : Math.round(v); return (r >= 0 ? '+' : '') + r; },
  bar(v, max, cls = '') {
    const p = U.clamp(max > 0 ? v / max * 100 : 0, 0, 100);
    return `<div class="bar ${cls}"><i style="width:${p}%"></i></div>`;
  },
  dayName(d) { return ['月', '火', '水', '木', '金', '土', '日'][(d - 1) % 7]; },
  timeStr(min) { const h = Math.floor(min / 60) % 24, m = Math.floor(min % 60); return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; },
};

/* ===== 効果音（WebAudioで合成、外部ファイル不要） ===== */
const SND = {
  ctx: null,
  on: true,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; }
  },
  tone(f, dur, type = 'sine', vol = 0.06, delay = 0, slide = 0) {
    if (!this.on || !this.ctx) return;
    try {
      const c = this.ctx, t = c.currentTime + delay;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* 無視 */ }
  },
  play(n) {
    if (!this.on) return;
    this.init();
    if (!this.ctx) return;
    switch (n) {
      case 'hit': this.tone(180, 0.07, 'square', 0.03, 0, -80); break;
      case 'crit': this.tone(320, 0.05, 'square', 0.05); this.tone(520, 0.1, 'sawtooth', 0.04, 0.04, -200); break;
      case 'hurt': this.tone(120, 0.15, 'sawtooth', 0.05, 0, -60); break;
      case 'miss': this.tone(600, 0.05, 'sine', 0.02, 0, 200); break;
      case 'kill': this.tone(260, 0.08, 'triangle', 0.05); this.tone(160, 0.12, 'triangle', 0.04, 0.06); break;
      case 'pick': this.tone(880, 0.05, 'sine', 0.03); break;
      case 'coin': this.tone(1320, 0.05, 'square', 0.025); this.tone(1760, 0.08, 'square', 0.025, 0.05); break;
      case 'step': break;
      case 'stairs': this.tone(400, 0.1, 'triangle', 0.04, 0, -200); this.tone(200, 0.2, 'triangle', 0.04, 0.1, -100); break;
      case 'level': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.05, i * 0.09)); break;
      case 'magic': this.tone(700, 0.2, 'sine', 0.04, 0, 400); break;
      case 'drop_rare': this.tone(988, 0.12, 'triangle', 0.05); this.tone(1318, 0.2, 'triangle', 0.05, 0.08); break;
      case 'drop_epic': [784, 988, 1318, 1568].forEach((f, i) => this.tone(f, 0.25, 'sine', 0.05, i * 0.07)); break;
      case 'drop_legend':
        this.tone(110, 0.6, 'sawtooth', 0.04, 0, -40);
        [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => this.tone(f, 0.45, 'triangle', 0.05, 0.1 + i * 0.08));
        break;
      case 'drop_set': [659, 880, 1108, 1318].forEach((f, i) => this.tone(f, 0.35, 'triangle', 0.05, i * 0.09)); break;
      case 'drop_mythic':
        this.tone(80, 0.9, 'sawtooth', 0.05, 0, -30);
        [440, 554, 659, 880, 1108, 1318, 1760].forEach((f, i) => this.tone(f, 0.5, 'square', 0.03, 0.12 + i * 0.07));
        break;
      case 'drop_anomaly':
        for (let i = 0; i < 10; i++) this.tone(300 + Math.random() * 1500, 0.3, i % 2 ? 'sine' : 'square', 0.03, i * 0.06, (Math.random() - 0.5) * 600);
        break;
      case 'identify': this.tone(500, 0.1, 'sine', 0.04); this.tone(1000, 0.15, 'sine', 0.04, 0.08); break;
      case 'reveal_good': [880, 1175, 1568, 2093].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.05, i * 0.06)); break;
      case 'fail': this.tone(200, 0.3, 'sawtooth', 0.04, 0, -120); break;
      case 'heal': this.tone(600, 0.15, 'sine', 0.04, 0, 300); break;
      case 'ui': this.tone(660, 0.03, 'sine', 0.02); break;
      case 'heart': this.tone(784, 0.12, 'sine', 0.04); this.tone(988, 0.2, 'sine', 0.04, 0.1); break;
      case 'betray': this.tone(150, 0.5, 'sawtooth', 0.05, 0, -90); this.tone(147, 0.5, 'sawtooth', 0.05, 0.05, -90); break;
    }
  }
};

</script>

<script>
/* js/items.js */
'use strict';
/* ===== アイテム生成・表示・クラフト ===== */
const IT = {
  bases: {},
  casterCls: ['staff', 'wand', 'lantern', 'bell', 'warfan', 'rift'],

  init() {
    const B = this.bases;
    const noScale = new Set(['sp_pierce', 'reloadSpd', 'lightRadius']);
    // 武器
    for (const cls in DATA.wclasses) {
      const wc = DATA.wclasses[cls];
      for (let t = 0; t < 6; t++) {
        const tm = wc.gun ? DATA.gunTierMult[t] : DATA.tierMult[t];
        const imp = {};
        for (const k in (wc.imp || {})) imp[k] = noScale.has(k) ? wc.imp[k] : U.round1(wc.imp[k] * (1 + t * 0.08));
        const id = `${cls}_${t}`;
        B[id] = {
          id, n: wc.names[t], slot: 'weapon', cat: 'weapon', cls, t, typeN: wc.n,
          dmg: [Math.max(1, Math.round(wc.dmg[0] * tm)), Math.max(2, Math.round(wc.dmg[1] * tm))],
          crit: wc.crit, w: U.round1(wc.w * (1 + t * 0.08)), hands: wc.hands || 1, range: wc.range || 0,
          ammo: wc.ammo === undefined ? undefined : wc.ammo, gun: wc.gun || null, reach: wc.reach || 0, slow: wc.slow || 0,
          noise: wc.noise || 0, st: wc.st, imp, req: DATA.tierIlvl[t], sockMax: (wc.hands === 2 ? 4 : 3), g: wc.g, fa: 0, d: wc.d,
        };
      }
    }
    // 防具
    for (const slot in DATA.armorSlots) {
      const as = DATA.armorSlots[slot];
      for (const style in DATA.armorStyles) {
        const st = DATA.armorStyles[style];
        for (let t = 0; t < 6; t++) {
          const imp = {};
          for (const k in st.imp) imp[k] = Math.round(st.imp[k] * (1 + t * 0.3));
          if (style === 'tactical' && slot === 'head' && t === 0) imp.lightRadius = 1;
          const id = `${slot}_${style}_${t}`;
          B[id] = {
            id, n: DATA.armorNames[slot][style][t], slot, cat: 'armor', style, t, typeN: `${DATA.slots[slot]}防具(${st.n})`,
            armor: Math.max(1, Math.round(as.base * st.am * DATA.tierMult[t])), eva: Math.round(st.eva * (1 + t * 0.35)),
            w: U.round1(as.w * st.wm * (1 + t * 0.08)), fa: st.fa + t, imp, cover: as.cover, req: DATA.tierIlvl[t],
            sockMax: slot === 'body' ? 3 : 2, g: '[',
          };
        }
      }
    }
    // その他
    const slotOf = { shield: 'offhand', greatshield: 'offhand', orb: 'offhand', tome: 'offhand', quiver: 'offhand', ring: 'ring', neck: 'neck', back: 'back', belt: 'belt', bag: 'bag', rig: 'rig' };
    const glyph = { ring: '=', neck: '"', shield: ']', greatshield: ']', orb: 'o', tome: '?', quiver: '}', bag: 'B', rig: 'R', back: '(', belt: '-' };
    const sockM = { ring: 1, neck: 1, shield: 3, greatshield: 3, orb: 2, tome: 2, quiver: 1, back: 1, belt: 1, bag: 0, rig: 0 };
    for (const type in DATA.miscBases) {
      const mb = DATA.miscBases[type];
      for (let t = 0; t < 6; t++) {
        const imp = {};
        for (const k in (mb.imp || {})) {
          const f = k === 'block' ? (1 + t * 0.08) : k === 'cdr' ? (1 + t * 0.2) : (1 + t * 0.45);
          imp[k] = U.round1(mb.imp[k] * f);
        }
        const id = `${type}_${t}`;
        B[id] = {
          id, n: mb.names[t], slot: slotOf[type], cat: 'misc', sub: type, t, typeN: mb.n,
          armor: mb.arm ? Math.round(mb.arm * DATA.tierMult[t]) : 0, eva: mb.eva ? Math.round(mb.eva * (1 + t * 0.3)) : 0,
          w: U.round1(mb.w * (1 + t * 0.1)), fa: (mb.fa || 0) + Math.floor(t / 2), imp, cover: mb.cover || null,
          req: DATA.tierIlvl[t], sockMax: sockM[type], g: glyph[type], heavy: mb.heavy || 0,
          bagSlots: mb.slotsBy ? mb.slotsBy[t] : 0, quick: mb.quickBy ? mb.quickBy[t] : 0,
        };
      }
    }
    DATA.outfits.forEach((o, i) => {
      B[`outfit_${i}`] = { id: `outfit_${i}`, n: o.n, slot: 'outfit', cat: 'style', t: Math.min(5, Math.floor(o.fa / 8)), typeN: '私服', fa: o.fa, imp: o.mods, w: 0.8, req: 1, sockMax: 0, g: '&', armor: 0, eva: 0 };
    });
    DATA.accs.forEach((o, i) => {
      B[`acc_${i}`] = { id: `acc_${i}`, n: o.n, slot: 'acc', cat: 'style', t: Math.min(5, Math.floor(o.fa / 5)), typeN: 'アクセサリー', fa: o.fa, imp: o.mods, w: 0.05, req: 1, sockMax: 1, g: '^', armor: 0, eva: 0 };
    });
    for (const id in B) B[id].groups = this.groupsOf(B[id]);
    this.byCat = { weapon: [], armor: [], jewel: [], off: [], backbelt: [], bagrig: [], style: [] };
    for (const id in B) {
      const b = B[id];
      if (b.slot === 'weapon') this.byCat.weapon.push(b);
      else if (b.cat === 'armor') this.byCat.armor.push(b);
      else if (b.slot === 'ring' || b.slot === 'neck') this.byCat.jewel.push(b);
      else if (b.slot === 'offhand') this.byCat.off.push(b);
      else if (b.slot === 'back' || b.slot === 'belt') this.byCat.backbelt.push(b);
      else if (b.slot === 'bag' || b.slot === 'rig') this.byCat.bagrig.push(b);
      else this.byCat.style.push(b);
    }
    // 各ユニーク・セットのベース存在確認
    DATA.uniques = DATA.uniques.filter(u => B[u.b]);
    for (const s of DATA.sets) s.pieces = s.pieces.filter(p => B[p.b]);
    this.setPieceMap = {};
    for (const s of DATA.sets) for (const p of s.pieces) this.setPieceMap[p.id] = { set: s, piece: p };
    this.uniqueMap = {};
    for (const u of DATA.uniques) this.uniqueMap[u.id] = u;
  },

  groupsOf(b) {
    const g = new Set();
    if (b.slot === 'weapon') {
      g.add('wpn'); g.add('any'); g.add(b.range ? 'ranged' : 'melee');
      if (this.casterCls.includes(b.cls)) g.add('caster');
    } else if (b.cat === 'armor') { g.add('arm'); g.add(b.slot); g.add('any'); }
    else if (b.slot === 'offhand') {
      g.add('off'); g.add('any');
      if (b.sub === 'shield' || b.sub === 'greatshield') g.add('shield');
      if (b.sub === 'orb' || b.sub === 'tome') g.add('caster');
      if (b.sub === 'quiver') g.add('quiverg');
    } else if (b.slot === 'ring') { g.add('jewel'); g.add('ring'); g.add('any'); }
    else if (b.slot === 'neck') { g.add('jewel'); g.add('neck'); g.add('any'); }
    else if (b.slot === 'bag' || b.slot === 'rig') { g.add(b.slot); }
    else { g.add(b.slot); g.add('any'); }
    return g;
  },

  maxTier(ilvl) { let t = 0; for (let i = 0; i < 6; i++) if (DATA.tierIlvl[i] <= ilvl) t = i; return t; },

  /* ---- レアリティ抽選 ---- */
  rollRarity(ilvl, mf = 0, mult = 1, minR = 0) {
    const d = 1 + ilvl / 60, m = Math.max(0, mf) / 100;
    const pity = G && G.player ? (G.player.pity || 0) : 0;
    const w = [
      120 / d, 500, 300 * (1 + m),
      110 * d * (1 + m * 0.8) * mult,
      28 * Math.pow(d, 1.3) * (1 + m * 0.6) * mult,
      4 * Math.pow(d, 1.5) * (1 + m * 0.45) * mult * (1 + pity / 400),
      3.5 * Math.pow(d, 1.5) * (1 + m * 0.45) * mult * (1 + pity / 600),
      0.35 * d * d * (1 + m * 0.3) * mult,
      0.18 * d * d * (1 + m * 0.3) * mult,
    ];
    if (ilvl < 6) { w[7] *= 0.2; w[8] *= 0.2; }
    for (let i = 0; i < minR; i++) w[i] = 0;
    let tot = 0; for (const x of w) tot += x;
    let r = Math.random() * tot;
    for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; }
    return 1;
  },

  pickBase(ilvl, slot, cat) {
    let pool;
    if (slot) pool = Object.values(this.bases).filter(b => (b.slot === slot || (slot === 'ring' && b.slot === 'ring')));
    else {
      const c = cat || U.wpick([['weapon', 30], ['armor', 35], ['jewel', 13], ['off', 10], ['backbelt', 6], ['bagrig', 4], ['style', 2]], x => x[1])[0];
      pool = this.byCat[c];
    }
    const mt = this.maxTier(ilvl);
    const cand = pool.filter(b => b.req <= ilvl);
    if (!cand.length) return pool[0];
    return U.wpick(cand, b => b.cat === 'style' ? 1 : (b.t === mt ? 5 : b.t === mt - 1 ? 2.5 : 0.6));
  },

  /* ---- 値の抽選 ---- */
  isInv(stat) { const s = DATA.statNames[stat]; return !!(s && s.inv); },
  rangeVal(r, q, stat, frac = 1) {
    const a = r[0] * frac, b = r[1] * frac;
    const lo = Math.min(a, b), hi = Math.max(a, b);
    const v = this.isInv(stat) ? hi - (hi - lo) * q : lo + (hi - lo) * q;
    const isInt = Number.isInteger(r[0]) && Number.isInteger(r[1]);
    if (isInt) {
      let rv = Math.round(v);
      if (rv === 0 && (r[0] !== 0 || r[1] !== 0)) rv = (r[0] + r[1]) > 0 ? 1 : -1;
      return rv;
    }
    return U.round1(v);
  },
  rollMods(m, qmin = 0) {
    const out = {};
    for (const k in m) { const r = m[k]; out[k] = Array.isArray(r) ? this.rangeVal(r, qmin + Math.random() * (1 - qmin), k) : r; }
    return out;
  },

  pickTier(ilvl, a, boost = 0) {
    const ts = [];
    for (let t = 0; t <= 8; t++) {
      if (DATA.affixTierIlvl[t] > ilvl + boost * 8) continue;
      if (a.minT && t > a.minT) continue;
      ts.push(t);
    }
    if (!ts.length) return a.minT ? -1 : 8;
    return U.wpick(ts, t => t === 0 ? 0.6 : Math.max(0.5, t - boost));
  },

  makeAffix(a, t) {
    const q = Math.random();
    const frac = DATA.affixTierFrac[t];
    return { id: a.id, s: a.s, t, q: U.round1(q * 100) / 100, v: this.rangeVal(a.r, q, a.s, frac) };
  },

  fillAffixes(it, n, boost = 0) {
    const b = this.bases[it.base];
    const have = new Set(it.aff.map(a => a.s));
    let pre = it.aff.filter(a => a.id && this.affixDef(a.id) && this.affixDef(a.id).k === 'pre').length;
    let suf = it.aff.filter(a => a.id && this.affixDef(a.id) && this.affixDef(a.id).k === 'suf').length;
    for (let i = 0; i < n; i++) {
      let k;
      if (pre >= 3 && suf >= 3) break;
      if (pre >= 3) k = 'suf'; else if (suf >= 3) k = 'pre'; else k = U.chance(0.5) ? 'pre' : 'suf';
      let pool = DATA.affixes.filter(a => a.k === k && !have.has(a.s) && a.g.some(g => b.groups.has(g)));
      if (!pool.length) { k = k === 'pre' ? 'suf' : 'pre'; pool = DATA.affixes.filter(a => a.k === k && !have.has(a.s) && a.g.some(g => b.groups.has(g))); }
      if (!pool.length) break;
      const a = U.wpick(pool, x => x.w);
      const t = this.pickTier(it.ilvl, a, boost);
      if (t < 0) { i--; have.add(a.s); continue; }
      it.aff.push(this.makeAffix(a, t));
      have.add(a.s);
      if (k === 'pre') pre++; else suf++;
    }
  },
  affixDef(id) { if (!this._afx) { this._afx = {}; for (const a of DATA.affixes) this._afx[a.id] = a; } return this._afx[id]; },

  rareName() { return U.pick(DATA.rareNameA) + U.pick(DATA.rareNameB); },

  /* ---- 装備生成 ---- */
  genEquip(o = {}) {
    const ilvl = Math.max(1, Math.round(o.ilvl || 1));
    let rar = o.rar != null ? o.rar : this.rollRarity(ilvl, o.mf || 0, o.mult || 1, o.minR || 0);
    if (o.maxR != null) rar = Math.min(rar, o.maxR);
    if (rar === 5 || rar === 7) {
      const u = this.pickUnique(ilvl, o.slot);
      if (u) return this.makeUnique(u, ilvl, rar === 7, o.idf);
      rar = 4;
    }
    if (rar === 6) {
      const sp = this.pickSetPiece(ilvl, o.slot);
      if (sp) return this.makeSet(sp, ilvl, o.idf);
      rar = 4;
    }
    const base = o.base ? this.bases[o.base] : this.pickBase(ilvl, o.slot, o.cat);
    const it = { uid: U.uid(), kind: 'equip', base: base.id, rar, ilvl: Math.max(ilvl, base.req), aff: [], sock: 0, gems: [], plus: 0, idf: o.idf != null ? o.idf : rar < 3, nw: 1 };
    if (rar >= 2 && rar <= 4) {
      const [a, b] = DATA.rarities[rar].aff;
      this.fillAffixes(it, U.ri(a, b));
      if (rar === 4 && U.chance(0.22)) this.addExalted(it);
      if (rar >= 3) it.rn = this.rareName();
    }
    if (rar === 8) {
      const an = U.pick(DATA.anomalies);
      it.anom = this.rollMods(an.m); it.anomN = an.n;
      this.fillAffixes(it, U.ri(3, 4), 2);
      it.rn = this.rareName();
    }
    this.rollSockets(it, base);
    if (rar >= 3 && rar <= 4 && U.chance(0.035)) this.curse(it);
    return it;
  },
  rollSockets(it, base) {
    const smax = base.sockMax || 0;
    if (!smax) return;
    const p = [0, 0.08, 0.15, 0.22, 0.3, 0.25, 0.25, 0.4, 0.45][it.rar];
    let s = 0; while (s < smax && U.chance(p)) s++;
    it.sock = s; it.gems = Array(s).fill(null);
  },
  addExalted(it) { const x = U.pick(DATA.exaltedAffixes); it.ex = { id: x.id, n: x.n, m: this.rollMods(x.mods) }; },
  curse(it) { const c = U.pick(DATA.curses); it.cur = { n: c.n, m: this.rollMods(c.m) }; },

  pickUnique(ilvl, slot) {
    const codex = G && G.player ? G.player.codex.uq : {};
    const c = DATA.uniques.filter(u => { const b = this.bases[u.b]; return b.req <= ilvl + 6 && (!slot || b.slot === slot); });
    if (!c.length) return null;
    return U.wpick(c, u => codex[u.id] ? 1 : 1.6);
  },
  pickSetPiece(ilvl, slot) {
    const c = [];
    for (const s of DATA.sets) for (const p of s.pieces) { const b = this.bases[p.b]; if (b.req <= ilvl + 6 && (!slot || b.slot === slot)) c.push(p); }
    return c.length ? U.pick(c) : null;
  },
  makeUnique(u, ilvl, mythic, idf) {
    const base = this.bases[u.b];
    const it = { uid: U.uid(), kind: 'equip', base: u.b, rar: mythic ? 7 : 5, ilvl: Math.max(ilvl, base.req), aff: [], uq: u.id, sock: 0, gems: [], plus: 0, idf: idf != null ? idf : false, nw: 1 };
    for (const k in u.m) {
      const r = u.m[k];
      if (Array.isArray(r)) {
        let q = Math.random(); if (mythic) q = 0.55 + q * 0.45;
        let v = this.rangeVal(r, q, k);
        if (mythic) v = this.boostVal(v, k);
        it.aff.push({ s: k, v, q: U.round1(q * 100) / 100, u: 1 });
      } else it.aff.push({ s: k, v: r, q: 1, u: 1, fix: 1 });
    }
    if (mythic) this.fillAffixes(it, 2, 3);
    this.rollSockets(it, base);
    if (!mythic && U.chance(0.03)) this.curse(it);
    return it;
  },
  boostVal(v, k) {
    const inv = this.isInv(k);
    if ((inv && v < 0) || (!inv && v > 0)) { const nv = v * 1.25; return Number.isInteger(v) ? Math.round(nv) : U.round1(nv); }
    return v;
  },
  makeSet(p, ilvl, idf) {
    const base = this.bases[p.b];
    const info = this.setPieceMap[p.id];
    const it = { uid: U.uid(), kind: 'equip', base: p.b, rar: 6, ilvl: Math.max(ilvl, base.req), aff: [], set: info.set.id, sp: p.id, sock: 0, gems: [], plus: 0, idf: idf != null ? idf : false, nw: 1 };
    for (const k in p.m) {
      const r = p.m[k];
      if (Array.isArray(r)) { const q = Math.random(); it.aff.push({ s: k, v: this.rangeVal(r, q, k), q: U.round1(q * 100) / 100, u: 1 }); }
      else it.aff.push({ s: k, v: r, q: 1, u: 1, fix: 1 });
    }
    this.rollSockets(it, base);
    return it;
  },
  makeByUid(id, ilvl) { // ユニークID・セット部位IDから生成
    if (this.uniqueMap[id]) return this.makeUnique(this.uniqueMap[id], ilvl || 1, false, true);
    if (this.setPieceMap[id]) return this.makeSet(this.setPieceMap[id].piece, ilvl || 1, true);
    return null;
  },

  /* ---- 消耗品 ---- */
  cons(id, qty = 1) {
    if (!DATA.cons[id]) { console.warn('unknown cons', id); return null; }
    return { uid: U.uid(), kind: 'cons', id, qty };
  },
  randomCons(floor, kinds) {
    const pool = Object.values(DATA.cons).filter(c => (c.lv || 1) <= floor + 2 && (!kinds || kinds.includes(c.k)) && !['ingr', 'mat'].includes(c.k) && c.id !== 'feather' && c.id !== 'elixir');
    const kw = { med: 25, food: 14, drink: 12, scroll: 10, tool: 5, throw: 6, orb: 7 + floor * 0.15, ammo: 9, gem: 5, book: 2.2, gift: 2, beauty: 2 };
    const c = U.wpick(pool, x => (kw[x.k] || 1) / Math.max(1, Object.values(DATA.cons).filter(y => y.k === x.k).length) * (x.p > 20000 ? 0.3 : 1));
    let qty = 1;
    if (c.k === 'ammo') qty = U.ri(10, 30);
    return this.cons(c.id, qty);
  },

  /* ---- 表示 ---- */
  base(it) { return this.bases[it.base]; },
  typeName(b) { return b.typeN || ''; },
  name(it) {
    if (!it) return '';
    if (it.kind === 'cons') { const c = DATA.cons[it.id]; return c ? c.n : '???'; }
    if (it.kind === 'gold') return `${U.fmt(it.amt)}円`;
    const b = this.bases[it.base];
    const R = DATA.rarities[it.rar];
    if (!it.idf) return `未鑑定の${R.n}・${b.typeN}`;
    let n;
    switch (it.rar) {
      case 0: n = '粗悪な' + b.n; break;
      case 1: n = b.n; break;
      case 2: {
        const pre = it.aff.find(a => a.id && this.affixDef(a.id) && this.affixDef(a.id).k === 'pre');
        const suf = it.aff.find(a => a.id && this.affixDef(a.id) && this.affixDef(a.id).k === 'suf');
        n = (pre ? this.affixDef(pre.id).n : '') + b.n + (suf ? this.affixDef(suf.id).n : '');
        break;
      }
      case 3: case 4: n = it.rn || b.n; break;
      case 5: n = (this.uniqueMap[it.uq] || {}).n || b.n; break;
      case 7: n = '神話・' + ((this.uniqueMap[it.uq] || {}).n || b.n); break;
      case 6: n = (this.setPieceMap[it.sp] || { piece: { n: b.n } }).piece.n; break;
      case 8: n = `異界の${it.rn || b.n}`; break;
      default: n = b.n;
    }
    if (it.cur) n = '呪われた' + n;
    if (it.plus) n += ` +${it.plus}`;
    return n;
  },
  color(it) {
    if (it.kind === 'cons') { const c = DATA.cons[it.id]; return c ? c.c : '#fff'; }
    if (it.kind === 'gold') return '#ffd700';
    return DATA.rarities[it.rar].c;
  },
  glyph(it) {
    if (it.kind === 'cons') return (DATA.cons[it.id] || {}).g || '?';
    if (it.kind === 'gold') return '$';
    return this.bases[it.base].g || ')';
  },
  weight(it) {
    if (it.kind === 'cons') return (DATA.cons[it.id].w || 0) * it.qty;
    if (it.kind === 'gold') return 0;
    return this.bases[it.base].w || 0;
  },

  baseStats(it) {
    const b = this.bases[it.base];
    const mult = (1 + (it.plus || 0) * 0.08) * (1 + Math.min(0.6, Math.max(0, it.ilvl - b.req) * 0.012)) * (it.rar === 0 ? 0.7 : 1);
    return {
      dmg: b.dmg ? [Math.max(1, Math.round(b.dmg[0] * mult)), Math.max(2, Math.round(b.dmg[1] * mult))] : null,
      armor: Math.round((b.armor || 0) * mult), eva: b.eva || 0, crit: b.crit || 0,
    };
  },

  mods(it) {
    const m = {};
    if (!it || it.kind !== 'equip') return m;
    const b = this.bases[it.base];
    U.addMods(m, b.imp);
    if (b.fa) m.fashion = (m.fashion || 0) + b.fa * (it.rar === 0 ? 0.5 : 1);
    if (b.bagSlots) m.bagSlots = (m.bagSlots || 0) + b.bagSlots;
    if (b.quick) m.quickSlots = (m.quickSlots || 0) + b.quick;
    if (!it.idf) return m;
    for (const a of it.aff) m[a.s] = (m[a.s] || 0) + a.v;
    if (it.ex) U.addMods(m, it.ex.m);
    if (it.cur) U.addMods(m, it.cur.m);
    if (it.anom) U.addMods(m, it.anom);
    if (it.chaos) U.addMods(m, it.chaos);
    const host = b.slot === 'weapon' ? 'wpn' : (b.slot === 'ring' || b.slot === 'neck' || b.slot === 'acc') ? 'jwl' : 'arm';
    for (const g of (it.gems || [])) {
      if (!g) continue;
      const def = DATA.cons[g]; if (!def) continue;
      const gt = DATA.gemTypes.find(x => x.id === def.gem);
      if (gt) U.addMods(m, gt[host], DATA.gemGrades[def.gr].m);
    }
    return m;
  },

  value(it) {
    if (it.kind === 'cons') return (DATA.cons[it.id].p || 0) * it.qty;
    if (it.kind === 'gold') return it.amt;
    const b = this.bases[it.base];
    const rm = [0.3, 1, 2.2, 5, 11, 30, 26, 80, 120][it.rar];
    let v = (300 + it.ilvl * 110) * (1 + b.t * 0.25) * rm * (1 + (it.plus || 0) * 0.2) * (1 + (it.sock || 0) * 0.1);
    if (b.cat === 'style') v += b.fa * 300;
    return Math.round(v);
  },
  sellPrice(it) {
    let v = this.value(it) * 0.3;
    if (it.kind === 'cons') v = this.value(it) * 0.4;
    if (it.kind === 'equip' && !it.idf) v *= 0.6;
    const disc = G && G.d ? G.d.m.shopDiscount || 0 : 0;
    return Math.max(1, Math.floor(v * (1 + disc / 200)));
  },
  buyPrice(it, markup = 1) {
    let v = this.value(it) * markup;
    if (it.kind === 'equip') v *= 1.2;
    const disc = G && G.d ? U.clamp(G.d.m.shopDiscount || 0, -30, 40) : 0;
    return Math.max(1, Math.round(v * (1 - disc / 100)));
  },

  /* 評価：S/A/B/C/D と完璧ロール */
  grade(it) {
    if (it.kind !== 'equip' || !it.idf) return null;
    const rnd = it.aff.filter(a => !a.fix);
    if (!rnd.length) return null;
    const avgQ = U.sum(rnd.map(a => a.q)) / rnd.length;
    const tierS = U.sum(rnd.map(a => a.u ? 1 : (9 - a.t) / 8)) / rnd.length;
    const sc = avgQ * 0.6 + Math.min(1, tierS) * 0.4;
    const perfect = rnd.every(a => a.q >= 0.95) && rnd.every(a => a.u || a.t <= 2);
    const g = sc >= 0.88 ? 'S' : sc >= 0.74 ? 'A' : sc >= 0.58 ? 'B' : sc >= 0.4 ? 'C' : 'D';
    return { g, sc, perfect };
  },

  modLine(k, v) {
    const s = DATA.statNames[k];
    if (!s) return '';
    if (k === 'sp_revive' || k === 'sp_pierce' || k === 'sp_lightAura' && false) return s.n;
    if (k === 'sp_revive') return s.n;
    if (k === 'sp_pierce') return s.n;
    const val = Number.isInteger(v) ? v : U.round1(v);
    return `${val >= 0 ? '+' : ''}${val}${s.u || ''} ${s.n}`;
  },
  isBad(k, v) { return this.isInv(k) ? v > 0 : v < 0; },

  tooltip(it, cmp) {
    if (!it) return '';
    if (it.kind === 'cons') return this.consTooltip(it);
    const b = this.bases[it.base], R = DATA.rarities[it.rar];
    const bs = this.baseStats(it);
    const L = [];
    L.push(`<div class="tt-name" style="color:${R.c}">${U.esc(this.name(it))}</div>`);
    let sub = `${R.n} ${b.typeN}`;
    if (it.idf && (it.rar >= 3)) sub += `（${b.n}）`;
    L.push(`<div class="tt-sub">${U.esc(sub)} ・ iLv${it.ilvl} ・ ${b.w}kg${b.hands === 2 ? ' ・ 両手' : ''}</div>`);
    const gr = this.grade(it);
    let badges = '';
    if (gr) badges += `<span class="badge g${gr.g}">評価 ${gr.g}</span>`;
    if (gr && gr.perfect) badges += `<span class="badge perfect">PERFECT</span>`;
    if (it.cur) badges += `<span class="badge curse">呪物</span>`;
    if (it.corr) badges += `<span class="badge chaos">混沌化</span>`;
    if (it.lock) badges += `<span class="badge lock">🔒</span>`;
    if (G && G.player && G.player.insured && G.player.insured[it.uid]) badges += `<span class="badge ins">保険</span>`;
    if (badges) L.push(`<div class="tt-badges">${badges}</div>`);
    // 基本性能
    const bl = [];
    if (bs.dmg) bl.push(`ダメージ <b>${bs.dmg[0]}〜${bs.dmg[1]}</b>　会心 ${bs.crit}%`);
    if (b.range) bl.push(`射程 ${b.range}${b.ammo ? `　弾:${({ arrow: '矢', bullet: '弾丸', shell: '散弾' })[b.ammo]}` : '　弾不要'}${b.gun ? `　装弾数${b.gun.mag}・リロード${b.gun.reload}T・騒音${b.gun.noise}` : ''}`);
    if (b.reach) bl.push('リーチ：2マス先まで届く');
    if (b.slow) bl.push('攻撃が重い（行動に時間がかかる）');
    if (b.noise && !b.gun) bl.push(`騒音 ${b.noise}`);
    if (bs.armor) bl.push(`防御 <b>${bs.armor}</b>${b.cover ? `（${b.cover.map(c => DATA.parts.find(p => p.id === c).n).join('・')}）` : ''}`);
    if (bs.eva) bl.push(`回避 ${bs.eva >= 0 ? '+' : ''}${bs.eva}`);
    if (b.bagSlots) bl.push(`所持枠 +${b.bagSlots}`);
    if (b.quick) bl.push(`クイックスロット +${b.quick}`);
    if (b.fa) bl.push(`おしゃれ度 ${b.fa}`);
    if (bl.length) L.push(`<div class="tt-base">${bl.join('<br>')}</div>`);
    // 固有
    const imp = Object.keys(b.imp || {}).filter(k => DATA.statNames[k]);
    if (imp.length) L.push(`<div class="tt-imp">${imp.map(k => this.modLine(k, b.imp[k])).join('<br>')}</div>`);
    if (!it.idf) {
      L.push(`<div class="tt-unid">？？？ 未鑑定 ？？？<br><small>鑑定の巻物・鑑定所・鑑定魔法で正体が分かる</small></div>`);
    } else {
      if (it.anom) L.push(`<div class="tt-anom">《${U.esc(it.anomN)}》<br>${Object.keys(it.anom).map(k => `<span class="${this.isBad(k, it.anom[k]) ? 'bad' : ''}">${this.modLine(k, it.anom[k])}</span>`).join('<br>')}</div>`);
      const al = it.aff.map(a => {
        const bad = this.isBad(a.s, a.v);
        const tier = a.u ? (a.fix ? '固定' : '固有') : DATA.affixTierName[a.t];
        const qp = Math.round((a.q || 0) * 100);
        return `<div class="aff ${bad ? 'bad' : ''}"><span>${this.modLine(a.s, a.v)}</span><span class="tier t${a.u ? 'u' : a.t}">${tier}</span>${a.fix ? '' : `<span class="qbar"><i style="width:${qp}%"></i></span><span class="qn">${qp}%</span>`}</div>`;
      }).join('');
      if (al) L.push(`<div class="tt-aff">${al}</div>`);
      if (it.ex) L.push(`<div class="tt-ex">${U.esc(it.ex.n)}<br>${Object.keys(it.ex.m).map(k => this.modLine(k, it.ex.m[k])).join('<br>')}</div>`);
      if (it.chaos) L.push(`<div class="tt-chaos">混沌：${Object.keys(it.chaos).map(k => `<span class="${this.isBad(k, it.chaos[k]) ? 'bad' : ''}">${this.modLine(k, it.chaos[k])}</span>`).join('<br>')}</div>`);
      if (it.cur) L.push(`<div class="tt-curse">呪い《${U.esc(it.cur.n)}》<br>${Object.keys(it.cur.m).map(k => `<span class="${this.isBad(k, it.cur.m[k]) ? 'bad' : ''}">${this.modLine(k, it.cur.m[k])}</span>`).join('<br>')}</div>`);
    }
    if (it.sock) {
      const gl = it.gems.map(g => g ? `<span class="gem" style="color:${DATA.cons[g].c}">◆${U.esc(DATA.cons[g].n)}</span>` : '<span class="gem empty">◇空き</span>').join(' ');
      L.push(`<div class="tt-sock">ソケット ${gl}</div>`);
    }
    if (it.set && it.idf) {
      const s = DATA.sets.find(x => x.id === it.set);
      const eq = G && G.player ? Object.values(G.player.equip).filter(e => e && e.set === s.id).map(e => e.sp) : [];
      const cnt = new Set(eq).size;
      L.push(`<div class="tt-set"><b>セット：${U.esc(s.n)}</b>（${cnt}/${s.pieces.length}装備中）<br>${s.pieces.map(p => `<span class="${eq.includes(p.id) ? 'on' : ''}">${U.esc(p.n)}</span>`).join(' / ')}<br>${Object.keys(s.bonus).map(n => `<span class="${cnt >= +n ? 'on' : ''}">(${n}) ${Object.keys(s.bonus[n]).map(k => this.modLine(k, s.bonus[n][k])).join('、')}</span>`).join('<br>')}</div>`);
    }
    const fl = it.uq ? (this.uniqueMap[it.uq] || {}).fl : null;
    if (fl && it.idf) L.push(`<div class="tt-flavor">${U.esc(fl)}</div>`);
    else if (b.d && it.rar <= 2) L.push(`<div class="tt-flavor">${U.esc(b.d)}</div>`);
    if (cmp) L.push(cmp);
    L.push(`<div class="tt-val">売値 ${U.yen(this.sellPrice(it))}</div>`);
    return `<div class="tt r${it.rar}">${L.join('')}</div>`;
  },

  consTooltip(it) {
    const c = DATA.cons[it.id];
    const L = [`<div class="tt-name" style="color:${c.c}">${U.esc(c.n)}${it.qty > 1 ? ` ×${it.qty}` : ''}</div>`];
    const kn = { med: '医療品', food: '食べ物', drink: '飲み物', ingr: '食材', tool: '道具', throw: '投擲物', scroll: '巻物', orb: '結晶', mat: '素材', gem: '宝石', ammo: '弾薬', gift: '雑貨', beauty: '美容', book: '書物' }[c.k] || '';
    L.push(`<div class="tt-sub">${kn} ・ ${c.w}kg${c.t ? ` ・ 使用${c.t}ターン` : ''}</div>`);
    const u = c.u || {}, lines = [];
    if (u.heal) lines.push(`HP+${u.heal}`); if (u.healPct) lines.push(`HP+${u.healPct}%`);
    if (u.bleed) lines.push(u.bleed >= 2 ? '出血(重)を止める' : '出血(軽)を止める');
    if (u.frac) lines.push('骨折を固定'); if (u.pain) lines.push(`痛み止め ${u.pain}ターン`); if (u.surgery) lines.push('機能停止した部位を復活');
    if (u.hunger) lines.push(`満腹 +${u.hunger}`); if (u.thirst) lines.push(`水分 ${u.thirst > 0 ? '+' : ''}${u.thirst}`);
    if (u.fatigue) lines.push(`疲労 ${u.fatigue > 0 ? '+' : ''}${u.fatigue}`); if (u.stress) lines.push(`ストレス ${u.stress > 0 ? '+' : ''}${u.stress}`);
    if (u.protein) lines.push(`タンパク質 ${u.protein}g`); if (u.kcal) lines.push(`${u.kcal}kcal`);
    if (u.mp) lines.push(`MP+${u.mp}`); if (u.st) lines.push(`スタミナ+${u.st}`);
    if (u.skin) lines.push(`肌ツヤ +${u.skin}`); if (u.hair) lines.push(`髪ツヤ +${u.hair}`); if (u.hygiene) lines.push(`清潔 +${u.hygiene}`);
    if (u.buff) lines.push(`効果「${u.buff.n}」${u.buff.dur}T：${Object.keys(u.buff.mods).map(k => this.modLine(k, u.buff.mods[k])).join('、')}`);
    if (u.throw) lines.push(`投擲：威力${u.throw.p}倍${u.throw.rad ? ` 範囲${u.throw.rad}` : ''}`);
    if (u.risk) lines.push(`<span class="bad">${u.risk}%で腹を壊す</span>`);
    if (c.k === 'ammo') lines.push(`弾薬ダメージ +${c.ad}${c.el ? `（${DATA.elements[c.el]}属性）` : ''}`);
    if (c.k === 'gem') {
      const gt = DATA.gemTypes.find(x => x.id === c.gem), m = DATA.gemGrades[c.gr].m;
      lines.push(`武器：${Object.keys(gt.wpn).map(k => this.modLine(k, U.round1(gt.wpn[k] * m))).join('')}`);
      lines.push(`防具：${Object.keys(gt.arm).map(k => this.modLine(k, U.round1(gt.arm[k] * m))).join('')}`);
      lines.push(`装身具：${Object.keys(gt.jwl).map(k => this.modLine(k, U.round1(gt.jwl[k] * m))).join('')}`);
    }
    if (c.tags && c.tags.length) lines.push(`<span class="dim">贈り物：${c.tags.map(t => DATA.giftTagName[t] || t).join('・')}</span>`);
    if (lines.length) L.push(`<div class="tt-base">${lines.join('<br>')}</div>`);

  },

  /* ---- 鑑定 ---- */
  identify(it) {

    if (it.uq && G.player) { G.player.codex.uq[it.uq] = (G.player.codex.uq[it.uq] || 0) + 1; }
    if (it.sp && G.player) { G.player.codex.sp[it.sp] = (G.player.codex.sp[it.sp] || 0) + 1; }

  },

  /* ---- クラフト ---- */
  craft(it, op, opt = {}) {
    if (it.kind !== 'equip') return { ok: false, msg: '装備品にしか使えない。' };
    if (!it.idf) return { ok: false, msg: '未鑑定品には使えない。' };
    if (it.corr && op !== 'enhance') return { ok: false, msg: '混沌化した装備は変更できない。' };
    const rnd = () => it.aff.filter(a => !a.u);

            if (!src || !Array.isArray(src.m[a.s])) continue;
            const q = it.rar === 7 ? 0.55 + Math.random() * 0.45 : Math.random();
            let v = this.rangeVal(src.m[a.s], q, a.s); if (it.rar === 7) v = this.boostVal(v, a.s);
            a.v = v; a.q = U.round1(q * 100) / 100; n++;
          } else {
            const d = this.affixDef(a.id); if (!d) continue;
            const q = Math.random(); a.q = U.round1(q * 100) / 100; a.v = this.rangeVal(d.r, q, d.s, DATA.affixTierFrac[a.t]); n++;
          }
        }
        return n ? { ok: true, msg: '数値が振り直された。' } : { ok: false, msg: '振り直せる効果がない。' };
      }
      case 'divine': {
        const a = it.aff[opt.idx];
        if (!a || a.fix) return { ok: false, msg: 'その効果は振り直せない。' };
        const q = Math.max(a.q, Math.random());
        if (a.u) {
          const src = it.uq ? this.uniqueMap[it.uq] : it.sp ? this.setPieceMap[it.sp].piece : null;
          if (!src || !Array.isArray(src.m[a.s])) return { ok: false, msg: '振り直せない。' };
          let v = this.rangeVal(src.m[a.s], it.rar === 7 ? Math.max(q, 0.55) : q, a.s); if (it.rar === 7) v = this.boostVal(v, a.s);
          a.v = v;
        } else { const d = this.affixDef(a.id); a.v = this.rangeVal(d.r, q, d.s, DATA.affixTierFrac[a.t]); }
        a.q = U.round1(q * 100) / 100;
        return { ok: true, msg: `「${DATA.statNames[a.s].n}」が ${Math.round(q * 100)}% になった。` };
      }
      case 'upgrade': {
        if (R < 2 || R > 3) return { ok: false, msg: 'マジックかレアにのみ有効。' };
        const p = R === 2 ? 0.6 : 0.25;

        it.rar = R + 1; if (!it.rn) it.rn = this.rareName();
        const need = DATA.rarities[it.rar].aff[0] - rnd().length;
        if (need > 0) this.fillAffixes(it, need);

      }
      case 'remove': {
        const r = rnd(); if (R < 2 || R > 4 || !r.length) return { ok: false, msg: '消せる効果がない。' };

        it.sock = (it.sock || 0) + 1; it.gems.push(null);

      }
      case 'chaos': {
        it.corr = true; const r = Math.random();
        if (r < 0.3) { const x = U.pick(DATA.exaltedAffixes); it.chaos = this.rollMods(x.mods); return { ok: true, msg: `混沌が《${x.n}》の力を宿した！` }; }
        if (r < 0.5) { it.sock = (it.sock || 0) + 1; it.gems.push(null); return { ok: true, msg: '限界を超えてソケットが開いた！' }; }
        if (r < 0.7) { for (const a of rnd()) { a.t = Math.max(0, a.t - 2); const d = this.affixDef(a.id); if (d) a.v = this.rangeVal(d.r, a.q, d.s, DATA.affixTierFrac[a.t]); } return { ok: true, msg: '全ての効果のティアが上昇した！' }; }
        if (r < 0.85) return { ok: true, msg: '……何も起きなかった。もう変更はできない。' };
        const x = U.pick(DATA.curses); it.chaos = this.rollMods(x.m);
        return { ok: true, fail: true, msg: `混沌が牙を剥いた。《${x.n}》が刻まれた……` };
      }
      case 'clean': {
        if (!it.cur) return { ok: false, msg: '呪われていない。' };
        delete it.cur; return { ok: true, msg: '呪いが浄化された。' };
      }
      case 'ancient': {
        if (R !== 5) return { ok: false, msg: 'レジェンダリーにのみ有効。' };
        if (!U.chance(0.3)) return { ok: true, fail: true, msg: '刻印は輝きを失った……（成功率30%）' };
        it.rar = 7;
        for (const a of it.aff) if (!a.fix) a.v = this.boostVal(a.v, a.s);
        this.fillAffixes(it, 2, 3);

      }
      case 'enhance': {
        if ((it.plus || 0) >= 15) return { ok: false, msg: 'これ以上強化できない(+15)。' };
        const deft = G.player.traits.includes('deft') ? 0.05 : 0;
        const p = Math.max(0.12, 0.95 - (it.plus || 0) * 0.075) + deft;
        if (U.chance(p)) { it.plus = (it.plus || 0) + 1; return { ok: true, msg: `強化成功！ +${it.plus}になった！`, p }; }
        if (!opt.safe && (it.plus || 0) >= 4 && U.chance(0.5)) { it.plus--; return { ok: true, fail: true, msg: `強化失敗……強化値が+${it.plus}に下がった。`, p }; }
        return { ok: true, fail: true, msg: '強化失敗……強化値は変わらなかった。', p };
      }
    }
    return { ok: false, msg: '?' };
  },
  enhanceCost(it) { return Math.round(800 * Math.pow((it.plus || 0) + 1, 1.6) * (1 + this.bases[it.base].t * 0.3)); },

  salvage(it) {
    const out = [];
    if (it.kind !== 'equip') return out;
    out.push(this.cons('mat_scrap', U.ri(1, 3)));
    if (it.rar >= 2) out.push(this.cons('mat_shard', U.ri(1, 2 + (it.rar >= 4 ? 2 : 0))));
    if (it.rar >= 3) out.push(this.cons('mat_core', it.rar >= 4 ? U.ri(1, 2) : 1));
    if (it.rar >= 5 && it.rar !== 8) out.push(this.cons('mat_essence', it.rar === 7 ? 2 : 1));
    if (it.rar === 8) out.push(this.cons('mat_anomaly', 1));
    if (it.plus >= 3) out.push(this.cons('enhance', Math.floor(it.plus / 3)));
    for (const g of (it.gems || [])) if (g) out.push(this.cons(g, 1));
    return out;
  },

  /* ---- ドロップ ---- */
  monsterDrops(mon, floor) {
    const out = [];
    const mf = (G.d.m.magicFind || 0) + (G.d.attr.luk - 10) * 1.5;
    const ilvl = Math.round(floor * 1.4 + 1);

    if (mon.boss) { nItems = U.ri(5, 7); mult = 8; minR = 3; gold = true; }
    else if (mon.ab && mon.ab.treasure) { nItems = U.ri(6, 10); mult = 4; minR = 2; gold = true; }
    else if (mon.uniq) { nItems = U.ri(2, 4); mult = 4; minR = 2; gold = true; }
    else if (mon.elite) { nItems = U.ri(1, 2); mult = 2; gold = U.chance(0.7); }
    else if (U.chance(0.2)) nItems = 1;
    for (let i = 0; i < nItems; i++) {
      const it = this.genEquip({ ilvl: ilvl + (mon.boss ? 3 : 0), mf, mult, minR: i === 0 ? minR : Math.min(minR, 2) });
      out.push(it);
    }
    if (mon.boss && U.chance(0.35)) out.push(this.genEquip({ ilvl: ilvl + 3, rar: U.chance(0.5) ? 5 : 6 }));
    // 消耗品
    const cc = mon.boss ? 4 : mon.uniq ? 2 : mon.elite ? 1 : (U.chance(0.12) ? 1 : 0);
    for (let i = 0; i < cc; i++) out.push(this.randomCons(floor));
    if (mon.ab && mon.ab.gems) out.push(this.cons(`gem_${U.pick(DATA.gemTypes).id}_${U.clamp(Math.floor(floor / 12), 0, 4)}`));
    if (mon.tags.includes('beast') && U.chance(0.18)) out.push(this.cons('monstermeat'));
    if (gold) {
      const gf = 1 + (G.d.m.goldFind || 0) / 100 + (G.d.m.sp_doubleGold || 0) / 100;
      let amt = Math.round(U.ri(4, 14) * (1 + floor * 0.6) * gf * (mon.boss ? 15 : mon.uniq ? 6 : mon.elite ? 2.5 : 1) * (mon.ab && mon.ab.treasure ? 20 : 1));

  },

<script>
/* js/player.js */
'use strict';
/* ===== プレイヤー：作成・能力計算・身体・所持品 ===== */
const P = {
  expNeed(l) { return Math.floor(40 * Math.pow(l, 1.75)); },

  create(o) {
    const race = DATA.races.find(r => r.id === o.race) || DATA.races[0];
    const bg = DATA.backgrounds.find(b => b.id === o.bg) || DATA.backgrounds[0];
    const build = DATA.looks.build.find(b => b.id === o.look.build) || DATA.looks.build[1];
    const base = { str: 10, dex: 10, vit: 10, int: 10, agi: 10, luk: 10, cha: 10 };
    U.addMods(base, race.stat); U.addMods(base, bg.stat);
    if (o.bonus) U.addMods(base, o.bonus);
    const p = {
      name: o.name || '名無し', sex: o.sex || 'その他', age: o.age || 20, race: race.id, bg: bg.id,
      look: Object.assign({ height: 170, build: 'normal', hairColor: '黒', hairStyle: 'ショート', eyeColor: '黒', skin: '普通', text: '' }, o.look),
      ax: Object.assign({}, o.axes), traits: (o.traits || []).slice(0, 3), acq: [],
      level: 1, exp: 0, statPts: 0, skillPts: 1, base,
      parts: {}, st: 100, mp: 40,
      needs: { hunger: 80, thirst: 80, fatigue: 10, stress: 20, hygiene: 85 },
      status: {}, painSup: 0, alc: 0,
      body: { muscle: build.muscle + (bg.muscle || 0), fat: build.fat, skin: 55, hair: 60, looks: U.ri(46, 58) },
      money: bg.money, bank: 0,
      equip: {}, inv: [], pouch: [],
      skills: {}, sxp: {}, hotbar: Array(8).fill(null), quick: Array(10).fill(null), cds: {},
      buffs: [], ammoSel: {}, mag: {},
      counters: { kills: 0, deaths: 0, maxFloor: 0, helped: 0, betrayed: 0, robbed: 0, legends: 0, lovers: 0, bossKills: 0, uniqueKills: 0, dives: 0 },
      codex: { uq: {}, sp: {}, mon: {} },
      checkpoints: [1], insured: {}, insClaims: [], rep: 0,
      house: 'room1', pity: 0, today: { kcal: 0, protein: 0, train: 0, act: 0, skin: 0, hair: 0 }, lastTrain: 1,
      flags: {}, quests: [], fortune: null, lastDay: 1,
    };
    for (const s of DATA.slotOrder) p.equip[s] = null;
    for (const pt of DATA.parts) p.parts[pt.id] = { hp: pt.base, bl: 0, fr: false, dead: false };
    G.player = p;
    // 初期装備
    const wcls = bg.weapon || 'improv';
    p.equip.weapon = IT.genEquip({ ilvl: 1, base: `${wcls}_0`, rar: 1 });
    p.equip.outfit = IT.genEquip({ ilvl: 1, base: 'outfit_1', rar: 1 });
    p.equip.feet = IT.genEquip({ ilvl: 1, base: 'feet_leather_0', rar: 1 });
    p.equip.bag = IT.genEquip({ ilvl: 1, base: 'bag_1', rar: 1 });
    p.equip.body = IT.genEquip({ ilvl: 1, base: wcls === 'pistol' ? 'body_tactical_1' : 'body_leather_0', rar: 1 });
    for (const s of DATA.slotOrder) if (p.equip[s]) p.equip[s].nw = 0;
    for (const id of (bg.items || [])) P.addItem(IT.cons(id, 1), true);
    P.addItem(IT.cons('bandage', 2), true); P.addItem(IT.cons('water', 1), true); P.addItem(IT.cons('onigiri', 1), true);
    if (bg.ammo) P.addItem(IT.cons(bg.ammo[0], bg.ammo[1]), true);
    // スキル
    for (const s of DATA.skills) if (s.race && s.race.includes(race.id)) SK.learn(s.id, true);
    for (const sid of (race.skills || [])) SK.learn(sid, true);
    for (const sid of (bg.skills || [])) SK.learn(sid, true);
    SK.learn('first_aid', true);
    SK.learn(U.pick(['ignite', 'static', 'pebble', 'breeze', 'chill', 'magicmissile']), true);
    SK.learn(wcls === 'pistol' || wcls === 'bow' ? 'snipe' : 'power', true);
    let hb = 0; for (const id in p.skills) { if (SK.def(id).t !== 'passive' && hb < 8) p.hotbar[hb++] = id; }
    P.calc();
    for (const pt of DATA.parts) p.parts[pt.id].hp = G.d.hpMax[pt.id];
    p.st = G.d.stMax; p.mp = G.d.mpMax;

  },

  traitDef(id) { return DATA.traits.find(t => t.id === id) || DATA.acqTraits.find(t => t.id === id); },
  partyCount() { return G.party ? G.party.length : 0; },

  /* ===== 能力計算 ===== */
  calc() {
    const p = G.player;
    if (!p) return;
    const d = this.compute();
    G.d = d;
    for (const pt of DATA.parts) { const pp = p.parts[pt.id]; if (pp.hp > d.hpMax[pt.id]) pp.hp = d.hpMax[pt.id]; }
    if (p.st > d.stMax) p.st = d.stMax;
    if (p.mp > d.mpMax) p.mp = d.mpMax;
    return d;
  },
  compute() {
    const p = G.player;
    const m = {};
    const race = DATA.races.find(r => r.id === p.race), bg = DATA.backgrounds.find(b => b.id === p.bg);
    U.addMods(m, race.mods); U.addMods(m, bg.mods);
    const solo = P.partyCount() === 0;
    for (const id of p.traits.concat(p.acq)) {
      const t = P.traitDef(id); if (!t) continue;
      if (t.solo && !solo) continue;
      U.addMods(m, t.mods);
    }
    for (const id in p.skills) { const s = SK.def(id); if (s && s.t === 'passive') U.addMods(m, s.mods, SK.level(id)); }
    const setCount = {}, seenSp = new Set();
    for (const slot of DATA.slotOrder) {
      const it = p.equip[slot]; if (!it) continue;
      U.addMods(m, IT.mods(it));
      if (it.set && it.idf && !seenSp.has(it.sp)) { seenSp.add(it.sp); setCount[it.set] = (setCount[it.set] || 0) + 1; }
    }
    const setsOn = {};
    for (const sid in setCount) {
      const s = DATA.sets.find(x => x.id === sid); if (!s) continue;
      for (const n in s.bonus) if (setCount[sid] >= +n) U.addMods(m, s.bonus[n]);
      setsOn[sid] = setCount[sid];
    }
    for (const b of p.buffs) U.addMods(m, b.mods);
    const house = DATA.houses.find(h => h.id === p.house);
    // 能力値
    const attr = {};
    for (const a of DATA.attrs) attr[a.id] = p.base[a.id] + (m[a.id] || 0);
    attr.str += Math.floor((p.body.muscle - 40) / 6);
    if (p.body.fat > 40) attr.agi -= Math.floor((p.body.fat - 40) / 5);
    const hour = Math.floor((G.minute || 0) / 60) % 24;
    let allB = 0;
    if (p.traits.includes('nightowl') && (hour >= 18 || hour < 4)) allB += 2;
    if (p.traits.includes('earlybird') && hour >= 5 && hour < 12) allB += 2;
    if (p.traits.includes('lonely') && !solo) allB += 2;
    if (allB) for (const a of DATA.attrs) attr[a.id] += allB;
    let pen = 1;
    const n = p.needs;
    if (n.fatigue > 80) pen -= 0.2; else if (n.fatigue > 60) pen -= 0.1;
    if (n.hunger < 10) pen -= 0.1; if (n.thirst < 10) pen -= 0.1; if (n.stress > 85) pen -= 0.1;
    if (pen < 1) for (const a of DATA.attrs) attr[a.id] = Math.max(1, Math.round(attr[a.id] * pen));
    for (const a of DATA.attrs) attr[a.id] = Math.max(1, Math.round(attr[a.id]));

    const d = { m, attr, setsOn, pen };
    // 武器
    const w = p.equip.weapon;
    let wb;
    if (w) {
      const b = IT.bases[w.base], bs = IT.baseStats(w);
      wb = { cls: b.cls, dmg: bs.dmg, crit: bs.crit, st: b.st, range: b.range, ammo: b.ammo, gun: b.gun, reach: b.reach, slow: b.slow, hands: b.hands, noise: b.noise };
    } else wb = { cls: 'none', dmg: [1, 3], crit: 3, st: 'str', range: 0, hands: 1 };
    d.wpn = wb;
    const isGun = !!wb.gun;
    let pct = (m.dmgPct || 0) + (wb.range ? (m.rangedPct || 0) : (m.meleePct || 0)) + (m.sp_glassCannon || 0);
    if (m.sp_greedDmg) pct += Math.min(300, Math.floor((p.money) / 10000) * m.sp_greedDmg);
    if (isGun) pct *= 0.5;
    const sv = attr[wb.st || 'str'] || 10;
    const scale = 1 + pct / 100 + (sv - 10) * (isGun ? 0.008 : 0.028);
    const flat = (m.dmgFlat || 0) * (isGun ? 0.5 : 1);
    d.dmgMult = Math.max(0.1, scale);
    d.dmg = [Math.max(1, Math.round((wb.dmg[0] + flat * 0.7) * d.dmgMult)), Math.max(1, Math.round((wb.dmg[1] + flat) * d.dmgMult))];
    const ep = 1 + (m.elemPct || 0) / 100;
    d.elem = { fire: (m.fireDmg || 0) * ep, ice: (m.iceDmg || 0) * ep, ltn: (m.ltnDmg || 0) * ep, poison: (m.poisonDmg || 0) * ep, holy: (m.holyDmg || 0) * ep, dark: (m.darkDmg || 0) * ep };
    d.crit = U.clamp(5 + wb.crit + (m.critChance || 0) + (attr.luk - 10) * 0.3 + (attr.dex - 10) * 0.2, 1, 80);
    d.critDmg = 150 + (m.critDmg || 0);
    let acc = 75 + attr.dex * 1.5 + (m.accuracy || 0);
    // 部位・痛み
    const pain = P.inPain();
    d.pain = pain;
    if (pain) acc *= (1 - 0.2 * (1 - U.clamp(m.painResist || 0, 0, 100) / 100));
    if (p.alc > 0) acc -= p.alc * 8;
    if (p.parts.rarm.fr || p.parts.rarm.dead) { acc -= 15; d.dmg = d.dmg.map(x => Math.max(1, Math.round(x * 0.75))); }
    d.acc = Math.max(10, acc);
    let armEva = 0;
    for (const slot of DATA.slotOrder) { const it = p.equip[slot]; if (it) armEva += IT.bases[it.base].eva || 0; }
    d.eva = Math.max(0, attr.agi * 1.5 + (m.evasion || 0) + armEva);
    d.block = U.clamp(m.block || 0, 0, 75);
    // 防御（部位別）
    const ap = 1 + (m.armorPct || 0) / 100;
    const armor = {};
    for (const pt of DATA.parts) armor[pt.id] = (m.armor || 0) * ap;
    for (const slot of DATA.slotOrder) {
      const it = p.equip[slot]; if (!it) continue;
      const b = IT.bases[it.base]; if (!b.cover) continue;
      const a = IT.baseStats(it).armor * ap * (slot === 'feet' ? 0.5 : 1);
      for (const c of b.cover) armor[c] += a;
    }
    for (const k in armor) armor[k] = Math.max(0, Math.round(armor[k]));
    d.armor = armor;
    // HP
    const hpM = {};
    let tot = 0;
    const hm = 1 + (attr.vit - 10) * 0.03 + (p.level - 1) * 0.05 + (m.hpPct || 0) / 100;
    for (const pt of DATA.parts) { hpM[pt.id] = Math.max(5, Math.round(pt.base * Math.max(0.3, hm) + (m.hpMax || 0) * pt.base / 435)); tot += hpM[pt.id]; }
    d.hpMax = hpM; d.hpTotalMax = tot;
    d.stMax = Math.round(80 + attr.vit * 2 + p.level * 2 + (m.stMax || 0));
    d.mpMax = Math.round(10 + attr.int * 3 + p.level * 1.5 + (m.mpMax || 0));
    // 重量・速度
    d.carry = Math.round(25 + attr.str * 1.5 + p.body.muscle * 0.25 + (m.carry || 0));
    d.weight = U.round1(P.totalWeight());
    let spd = 100 + (attr.agi - 10) * 1.2 + (m.speed || 0);
    for (const leg of ['lleg', 'rleg']) {
      const L = p.parts[leg];
      if (L.dead) spd -= 30; else if (L.fr) spd -= p.painSup > 0 ? 8 : 18;
    }
    if (d.weight > d.carry) spd -= Math.min(60, (d.weight / d.carry - 1) * 100);
    if (n.fatigue > 85) spd -= 10;
    if (p.status.slow > 0) spd -= 30;
    d.speed = Math.max(30, Math.round(spd));
    let biomeLight = 0;
    if (G.mode === 'dungeon' && G.dungeon) biomeLight = { library: -2, forest: -1, canopy: -1, crystal: 1, lava: 1 }[G.dungeon.biome] || 0;
    d.light = Math.max(1, Math.round(5 + (m.lightRadius || 0) + biomeLight));
    d.sense = Math.max(0, Math.round(m.sense || 0));
    d.stealth = m.stealth || 0;
    const res = {};
    for (const el of ['fire', 'ice', 'ltn', 'poison', 'holy', 'dark']) {
      const k = 'res' + el.charAt(0).toUpperCase() + el.slice(1);
      res[el] = U.clamp(Math.round((m[k] || 0) + (m.resAll || 0)), -100, 75);
    }
    d.res = res;
    d.bagSlots = 8 + Math.round(m.bagSlots || 0);
    d.quickSlots = U.clamp(2 + Math.round(m.quickSlots || 0), 2, 10);
    // 魔力
    let casterAvg = 0;
    if (w && IT.casterCls.includes(wb.cls)) casterAvg = (wb.dmg[0] + wb.dmg[1]) / 2;
    d.spellPower = (6 + attr.int * 1.3 + p.level * 1.2 + casterAvg * 0.6) * (1 + (m.spellPct || 0) / 100);
    d.dmgTaken = U.clamp((m.dmgTaken || 0) + (m.sp_glassCannon || 0), -60, 200);
    // 魅力度
    const cp = {};
    cp.face = U.clamp(p.body.looks + (attr.cha - 10) * 1.5, 0, 100);
    cp.groom = U.clamp(p.body.hair * 0.5 + p.body.skin * 0.5, 0, 100);
    cp.fashion = U.clamp((m.fashion || 0) * 1.1 * (p.traits.includes('fashionista') ? 1.3 : 1), 0, 100);
    cp.physique = U.clamp(100 - Math.abs(p.body.muscle - 58) * 1.1 - Math.abs(p.body.fat - 18) * 2.2, 0, 100);
    cp.hygiene = n.hygiene;
    cp.vital = U.clamp(100 - n.fatigue * 0.5 - n.stress * 0.5, 0, 100);
    const hw = p.traits.includes('neatfreak') ? 0.18 : 0.1;
    let charm = cp.face * 0.28 + cp.groom * 0.16 + cp.fashion * 0.2 + cp.physique * 0.14 + cp.hygiene * hw + cp.vital * 0.1;
    charm *= 1 + (m.charmPct || 0) / 100;
    charm += (house && house.charm) || 0;
    d.charm = Math.round(U.clamp(charm, 0, 150));
    d.charmParts = cp;
    return d;
  },

  inPain() {
    const p = G.player;
    if (p.painSup > 0) return false;
    for (const pt of DATA.parts) {
      const pp = p.parts[pt.id];
      if (pp.fr || pp.dead) return true;
      if (G.d && G.d.hpMax && pp.hp < G.d.hpMax[pt.id] * 0.35) return true;
    }
    return false;
  },

  totalWeight() {
    const p = G.player; let w = 0;
    for (const s of DATA.slotOrder) if (p.equip[s]) w += IT.weight(p.equip[s]);
    for (const it of p.inv) w += IT.weight(it);
    for (const it of p.pouch) w += IT.weight(it);
    return w;
  },
  hp() { let s = 0; for (const k in G.player.parts) s += Math.max(0, G.player.parts[k].hp); return s; },
  hpRatio() { return P.hp() / Math.max(1, G.d.hpTotalMax); },

  /* ===== ダメージ・回復 ===== */
  hurt(amount, partId, opt = {}) {
    const p = G.player;
    amount = Math.max(0, amount);
    if (amount <= 0) return;
    let part = p.parts[partId];
    const hard = G.settings.mode === 'hardcore';
    if (part.dead) {
      // 機能停止部位へのダメージは他部位に拡散
      const alive = DATA.parts.filter(x => !p.parts[x.id].dead);
      const each = amount * 0.7 / Math.max(1, alive.length);
      for (const x of alive) P.applyPartDamage(x.id, each, hard);
    } else P.applyPartDamage(partId, amount, hard);
    if (G.dungeon && G.dungeon.recall > 0) { G.dungeon.recall = 0; UI.log('帰還の詠唱が中断された！', 'bad'); }
    if (p.status.sleep) p.status.sleep = 0;
  },
  applyPartDamage(pid, amt, hard) {
    const p = G.player, pp = p.parts[pid], def = DATA.parts.find(x => x.id === pid);
    const max = G.d.hpMax[pid];
    const before = pp.hp;
    pp.hp -= amt;
    if (pp.hp <= 0) {
      if (def.vital) {
        if (!hard && before > max * 0.25) { pp.hp = 1; UI.log(`${def.n}に致命的な一撃！ ギリギリ耐えた！`, 'bad'); return; }
        pp.hp = 0;
        P.checkDeath();
      } else {
        pp.hp = 0;
        if (!pp.dead) { pp.dead = true; pp.bl = 0; pp.fr = false; UI.log(`${def.n}が機能停止した！（手術で回復可能）`, 'bad'); P.calc(); }
      }
    }
  },
  checkDeath() {
    const p = G.player;
    if (p.parts.head.hp > 0 && p.parts.chest.hp > 0) return false;
    if (G.d.m.sp_revive && G.dungeon && !G.dungeon.revUsed) {
      G.dungeon.revUsed = true;
      P.revive(0.35); UI.log('不死鳥の力で蘇った！', 'legend'); UI.flash('#ff8c1a'); return false;
    }
    const fe = P.findCons('feather');
    if (fe) {
      P.removeItem(fe.uid, 1);
      P.revive(0.5); UI.log('不死鳥の羽が燃え尽き、命を繋いだ！', 'legend'); UI.flash('#ff8c1a'); return false;
    }
    G.pendingDeath = true;
    return true;
  },
  revive(pct) {
    const p = G.player;
    for (const pt of DATA.parts) {
      const pp = p.parts[pt.id];
      if (pt.vital && pp.hp <= 0) pp.hp = Math.round(G.d.hpMax[pt.id] * pct);
      pp.bl = 0;
    }
    G.pendingDeath = false;
  },
  heal(amount, opt = {}) {
    const p = G.player;
    amount *= opt.raw ? 1 : (1 + (G.d.m.healEff || 0) / 100);
    if (amount <= 0) return 0;
    let left = amount, total = 0;
    for (let iter = 0; iter < 4 && left > 0.01; iter++) {
      const parts = DATA.parts.filter(x => !p.parts[x.id].dead && p.parts[x.id].hp < G.d.hpMax[x.id]);
      if (!parts.length) break;
      const miss = parts.map(x => G.d.hpMax[x.id] - p.parts[x.id].hp);
      const sumMiss = U.sum(miss);
      parts.forEach((x, i) => {
        const give = Math.min(miss[i], left * miss[i] / sumMiss);
        p.parts[x.id].hp += give; total += give;
      });
      left = amount - total;
    }
    return Math.round(total);
  },
  healPct(pct) { return P.heal(G.d.hpTotalMax * pct / 100); },
  fullHeal() {
    const p = G.player;
    for (const pt of DATA.parts) { const pp = p.parts[pt.id]; pp.dead = false; pp.hp = G.d.hpMax[pt.id]; pp.bl = 0; pp.fr = false; }
    p.status = {};
  },

  /* ===== 状態異常（プレイヤー） ===== */
  applyStatus(k, chance, power = 1) {
    const p = G.player, m = G.d.m;
    if (k === 'bleed') {
      if (!U.chance(chance / 100 * (1 - U.clamp(m.resBleed || 0, 0, 95) / 100))) return;
      const pid = U.pick(['chest', 'stomach', 'larm', 'rarm', 'lleg', 'rleg']);
      const pp = p.parts[pid]; if (pp.dead) return;
      const heavy = U.chance(0.25);
      if (pp.bl < (heavy ? 2 : 1)) { pp.bl = heavy ? 2 : 1; UI.log(`${DATA.parts.find(x => x.id === pid).n}から${heavy ? '大量に' : ''}出血している！`, 'bad'); }
      return;
    }
    if (k === 'frac') {
      if (!U.chance(chance / 100 * (1 - U.clamp(m.resFracture || 0, 0, 95) / 100))) return;
      const pid = U.pick(['larm', 'rarm', 'lleg', 'rleg']);
      const pp = p.parts[pid]; if (pp.dead || pp.fr) return;
      pp.fr = true; UI.log(`${DATA.parts.find(x => x.id === pid).n}を骨折した！`, 'bad'); P.calc();
      return;
    }
    const resMap = { poison: 'poison', burn: 'fire', freeze: 'ice', stun: null };
    let r = 0;
    if (resMap[k]) r = G.d.res[resMap[k]] || 0;
    if (k === 'stun' || k === 'freeze') r += m.resStun || 0;
    if (!U.chance(chance / 100 * (1 - U.clamp(r, 0, 95) / 100))) return;
    const st = p.status;
    const dur = { poison: 12, burn: 6, freeze: 2, stun: 1, slow: 10, weaken: 15, mpburn: 1 }[k] || 5;
    if (k === 'mpburn') { p.mp = Math.max(0, p.mp - 15); UI.log('MPが吸い取られた！', 'bad'); return; }
    if (k === 'poison' || k === 'burn') {
      st[k] = { t: dur, d: Math.max(1, power) };
    } else st[k] = Math.max(st[k] || 0, dur);
    const nm = { poison: '毒', burn: '炎上', freeze: '凍結', stun: 'スタン', slow: '鈍足', weaken: '衰弱' }[k];
    if (nm) UI.log(`${nm}状態になった！`, 'bad');
    if (k === 'slow') P.calc();
  },

  /* ===== 時間経過（迷宮：1ターン=5秒） ===== */
  tickTurn(el) {
    const p = G.player, d = G.d, m = d.m;
    const tm = d.hpTotalMax;
    // 出血
    let bleeding = false;
    for (const pt of DATA.parts) {
      const pp = p.parts[pt.id];
      if (pp.dead || !pp.bl) continue;
      bleeding = true;
      const loss = (pp.bl === 1 ? 0.0012 : 0.0038) * tm * el;
      P.applyPartDamage(pt.id, loss, G.settings.mode === 'hardcore');
      if (pp.bl === 1 && U.chance(0.006 * el)) { pp.bl = 0; UI.log(`${pt.n}の出血が止まった。`, 'good'); }
    }
    const st = p.status;
    if (st.poison) { const d2 = st.poison.d * el * 0.5 * (1 - d.res.poison / 100); P.applyPartDamage(U.pick(['stomach', 'chest']), d2, false); st.poison.t -= el; if (st.poison.t <= 0) delete st.poison; }
    if (st.burn) { const d2 = st.burn.d * el * 0.6 * (1 - d.res.fire / 100); P.applyPartDamage(U.pick(['chest', 'larm', 'rarm', 'lleg', 'rleg']), d2, false); st.burn.t -= el; if (st.burn.t <= 0) delete st.burn; }
    for (const k of ['freeze', 'stun', 'slow', 'weaken', 'root', 'sleep']) if (st[k]) { st[k] -= el; if (st[k] <= 0) { delete st[k]; if (k === 'slow') P.calc(); } }
    // 自然回復
    const n = p.needs;
    if (!bleeding && n.hunger > 15 && n.thirst > 15) P.heal((tm * 0.0012 + (m.hpRegen || 0) * 0.1) * el, { raw: true });
    else if (m.hpRegen > 0) P.heal((m.hpRegen || 0) * 0.05 * el, { raw: true });
    else if (m.hpRegen < 0) P.applyPartDamage('stomach', -m.hpRegen * 0.05 * el, false);
    p.st = Math.min(d.stMax, p.st + (2 + d.attr.vit * 0.1 + (m.stRegen || 0)) * el * (d.pain ? 0.6 : 1));
    p.mp = Math.min(d.mpMax, p.mp + (0.15 + d.attr.int * 0.02 + (m.mpRegen || 0) * 0.25) * el);
    // 欲求
    const mins = el * 5 / 60;
    P.needsTick(mins, 1.2);
    if (n.hunger <= 0) P.applyPartDamage('stomach', 0.06 * el * tm / 435, false);
    if (n.thirst <= 0) P.applyPartDamage('chest', 0.08 * el * tm / 435, false);
    if (n.fatigue >= 100 && !st.stun) { st.stun = 15; n.fatigue = 92; UI.log('疲労の限界で意識が遠のく……！', 'bad'); }
    if (p.painSup > 0) p.painSup = Math.max(0, p.painSup - el);
    if (p.alc > 0) p.alc = Math.max(0, p.alc - el * 0.004);
    // バフ
    P.tickBuffs(el);
    for (const k in p.cds) { p.cds[k] -= el; if (p.cds[k] <= 0) delete p.cds[k]; }
  },
  needsTick(mins, mult = 1) {
    const p = G.player, n = p.needs, m = G.d.m;
    n.hunger = U.clamp(n.hunger - 0.065 * mins * mult * (1 + (m.hungerMult || 0) / 100) * (p.body.fat > 30 ? 0.9 : 1), 0, 100);
    n.thirst = U.clamp(n.thirst - 0.09 * mins * mult * (1 + (m.thirstMult || 0) / 100), 0, 100);
    n.fatigue = U.clamp(n.fatigue + 0.055 * mins * mult * (1 + (m.fatigueMult || 0) / 100), 0, 100);
    n.hygiene = U.clamp(n.hygiene - 0.03 * mins * mult * (G.mode === 'dungeon' ? 1.8 : 1), 0, 100);
    if (G.mode === 'dungeon') n.stress = U.clamp(n.stress + 0.012 * mins * (1 + (m.stressMult || 0) / 100), 0, 100);
    if (p.traits.includes('neatfreak') && n.hygiene < 40) n.stress = U.clamp(n.stress + 0.01 * mins, 0, 100);
    p.today.act += mins * (G.mode === 'dungeon' ? 6 : 1.2);
  },
  tickBuffs(el) {
    const p = G.player; let changed = false;
    for (const b of p.buffs) b.dur -= el;
    const before = p.buffs.length;
    p.buffs = p.buffs.filter(b => b.dur > 0);
    if (p.buffs.length !== before) changed = true;
    if (changed) P.calc();
  },
  addBuff(n, dur, mods, opt = {}) {
    const p = G.player;
    const ex = p.buffs.find(b => b.n === n);
    if (ex) { ex.dur = Math.max(ex.dur, dur); ex.mods = mods; }
    else p.buffs.push({ n, dur, mods, src: opt.src || '' });
